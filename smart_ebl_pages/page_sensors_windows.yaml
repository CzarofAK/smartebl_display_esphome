# =============================================================================
#  smart_ebl_pages/page_sensors_windows.yaml -- page: Sensors, sub-page 1 (Fenster/Türen)
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §5/§7: Sensors section's sub-page 1. Real entity list
# confirmed by the repo owner (2026-09-19), replacing the honest
# placeholder grid page_sensors_overview.yaml used to be (see that file's
# own git history) - Sensors now has THREE sub-pages instead of two:
# 1 Fenster/Türen (this file), 2 Klappen (page_sensors_flaps.yaml), 3
# Levelling (page_sensors_levelling.yaml, unchanged) - repo-owner call,
# splitting the single door/window/flap category into two pages rather
# than cramming all 18 contacts onto one, since each card here shows five
# values (state/battery/voltage/temperature/last-seen), not just the
# dot+cap+state the old placeholder mocked up. nav_show_sensors/draw_nav
# (main device file) updated for the 1/3-2/3-3/3 cycle.
#
# 11 door/window contacts, all Home Assistant-fed (Zigbee-style per-device
# diagnostics: battery %, voltage, device temperature, last_seen - same
# entity-naming pattern for every one of the 18 contacts across both
# pages, repo-owner-confirmed): binary_sensor.<name>_contact (device_class
# door/window - ASSUMED standard HA convention, "on" = open, "off" =
# closed, not separately confirmed per-entity) + sensor.<name>_battery
# (%) + sensor.<name>_voltage (V) + sensor.<name>_device_temperature (°C)
# + sensor.<name>_last_seen (HA timestamp string, device_class timestamp).
#
# Grid: 3 columns x 4 rows (12 cells, 11 used - last cell simply not
# drawn, same "leave the trailing slot empty" precedent as
# page_sensors_flaps.yaml's own 9-cell/7-used grid) - 3x340px cells +
# 2x30px gaps = 1080px, centered in the 1150px content area -> 35px side
# margin -> columns x165/535/905 (same column x's the old placeholder
# already used - kept rather than re-derived). 4x168px rows + 3x16px gaps
# = 736px = exactly the content area height -> rows y72/256/440/624 (8px
# top/bottom margin). Same dot+cap+state cell shape as
# page_electric_fuses.yaml's fuse grid, extended with two more lines
# (battery/voltage/temp combined, last-seen) since this card carries more
# values per entity than a fuse does.
#
# "Last seen" - NOT a timezone-converted read of the HA entity's own raw
# UTC ISO8601 string (no confirmed local-timezone parsing exists anywhere
# else in this codebase to reuse, and getting that wrong silently would
# be worse than not showing it precisely - design_rules.md's own "don't
# invent precision this display doesn't have" reasoning). Instead this
# tracks, in millis(), when THIS DISPLAY last observed the entity's
# last_seen value change and shows elapsed time since then ("vor Xm"/"vor
# Xh Ym") - a good proxy for "how stale is this reading" in practice,
# since a Zigbee-style last_seen entity only changes when the physical
# sensor actually reports. Known limitation, stated honestly: right after
# this display reboots, every card reads "vor <1 Min" until each
# entity's next real update, even if the underlying sensor's last
# genuine report was hours ago - accepted trade-off, not silently
# claimed otherwise.
# =============================================================================

