script:
  # ---- draw_sensors_windows (page_sensors_windows) - one shared
  # set_contact() lambda per card, same "one drawing script per page"
  # rule as design_rules.md §2's §9 reference - called from every
  # contact/battery/voltage/temp/last_seen entity's own on_value/on_state
  # above, plus esphome:on_boot below.
  - id: draw_sensors_windows
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          uint32_t now = millis();

          auto fmt_seen = [&](uint32_t seen_ms) -> std::string {
            if (seen_ms == 0) return "--";
            uint32_t d = (now - seen_ms) / 1000;
            if (d < 60) return "vor <1 Min";
            uint32_t m = d / 60;
            if (m < 60) { char b[16]; snprintf(b, sizeof(b), "vor %u Min", m); return b; }
            uint32_t h = m / 60; m = m % 60;
            char b[24]; snprintf(b, sizeof(b), "vor %uh %um", h, m); return b;
          };

          // has_contact/open - device_class door/window ASSUMED (this
          // file's own header) - open = OFFEN (warning-orange, matches
          // pages.md §7's "worth attention, not yet an alarm" framing for
          // an open contact outside a driving context), closed =
          // GESCHLOSSEN (good-green). has_contact/has_batt/has_volt/
          // has_temp are each gated independently (api_ok + has_state())
          // rather than off one combined flag - design_rules.md §2's
          // invalid-value rule is per VALUE, not per device.
          auto set_contact = [&](lv_obj_t *dot, lv_obj_t *lbl_state, lv_obj_t *lbl_vals, lv_obj_t *lbl_seen,
                                  bool has_contact, bool open,
                                  bool has_batt, float batt,
                                  bool has_volt, float volt,
                                  bool has_temp, float temp,
                                  uint32_t seen_ms) {
            uint32_t col;
            if (!has_contact) {
              col = 0x555555;
              lv_label_set_text(lbl_state, "---");
            } else if (open) {
              col = 0xF39C12;
              lv_label_set_text(lbl_state, "OFFEN");
            } else {
              col = 0x2ECC71;
              lv_label_set_text(lbl_state, "GESCHLOSSEN");
            }
            lv_obj_set_style_text_color(lbl_state, lv_color_hex(col), 0);
            lv_obj_set_style_bg_color(dot, lv_color_hex(col), 0);

            char bbuf[8], vbuf[8], tbuf[8], vals[40];
            if (has_batt) snprintf(bbuf, sizeof(bbuf), "%.0f%%", batt); else snprintf(bbuf, sizeof(bbuf), "--%%");
            if (has_volt) snprintf(vbuf, sizeof(vbuf), "%.2fV", volt); else snprintf(vbuf, sizeof(vbuf), "--V");
            if (has_temp) snprintf(tbuf, sizeof(tbuf), "%.0f°C", temp); else snprintf(tbuf, sizeof(tbuf), "--°C");
            snprintf(vals, sizeof(vals), "%s / %s / %s", bbuf, vbuf, tbuf);
            lv_label_set_text(lbl_vals, vals);
            lv_obj_set_style_text_color(lbl_vals, lv_color_hex((has_batt || has_volt || has_temp) ? 0xBDC1C6 : 0x555555), 0);

            lv_label_set_text(lbl_seen, fmt_seen(seen_ms).c_str());
            lv_obj_set_style_text_color(lbl_seen, lv_color_hex(seen_ms == 0 ? 0x555555 : 0x707070), 0);
          };

          set_contact(id(dot_beifahrerture), id(lbl_beifahrerture_state), id(lbl_beifahrerture_vals), id(lbl_beifahrerture_seen),
              api_ok && id(s_beifahrerture_contact).has_state(), id(s_beifahrerture_contact).state,
              api_ok && id(s_beifahrerture_battery).has_state(), id(s_beifahrerture_battery).state,
              api_ok && id(s_beifahrerture_voltage).has_state(), id(s_beifahrerture_voltage).state,
              api_ok && id(s_beifahrerture_device_temperature).has_state(), id(s_beifahrerture_device_temperature).state,
              id(g_beifahrerture_last_seen_ms));
          set_contact(id(dot_fahrerture), id(lbl_fahrerture_state), id(lbl_fahrerture_vals), id(lbl_fahrerture_seen),
              api_ok && id(s_fahrerture_contact).has_state(), id(s_fahrerture_contact).state,
              api_ok && id(s_fahrerture_battery).has_state(), id(s_fahrerture_battery).state,
              api_ok && id(s_fahrerture_voltage).has_state(), id(s_fahrerture_voltage).state,
              api_ok && id(s_fahrerture_device_temperature).has_state(), id(s_fahrerture_device_temperature).state,
              id(g_fahrerture_last_seen_ms));
          set_contact(id(dot_eingangsture), id(lbl_eingangsture_state), id(lbl_eingangsture_vals), id(lbl_eingangsture_seen),
              api_ok && id(s_eingangsture_contact).has_state(), id(s_eingangsture_contact).state,
              api_ok && id(s_eingangsture_battery).has_state(), id(s_eingangsture_battery).state,
              api_ok && id(s_eingangsture_voltage).has_state(), id(s_eingangsture_voltage).state,
              api_ok && id(s_eingangsture_device_temperature).has_state(), id(s_eingangsture_device_temperature).state,
              id(g_eingangsture_last_seen_ms));
          set_contact(id(dot_kuchenfenster), id(lbl_kuchenfenster_state), id(lbl_kuchenfenster_vals), id(lbl_kuchenfenster_seen),
              api_ok && id(s_kuchenfenster_contact).has_state(), id(s_kuchenfenster_contact).state,
              api_ok && id(s_kuchenfenster_battery).has_state(), id(s_kuchenfenster_battery).state,
              api_ok && id(s_kuchenfenster_voltage).has_state(), id(s_kuchenfenster_voltage).state,
              api_ok && id(s_kuchenfenster_device_temperature).has_state(), id(s_kuchenfenster_device_temperature).state,
              id(g_kuchenfenster_last_seen_ms));
          set_contact(id(dot_tischfenster), id(lbl_tischfenster_state), id(lbl_tischfenster_vals), id(lbl_tischfenster_seen),
              api_ok && id(s_tischfenster_contact).has_state(), id(s_tischfenster_contact).state,
              api_ok && id(s_tischfenster_battery).has_state(), id(s_tischfenster_battery).state,
              api_ok && id(s_tischfenster_voltage).has_state(), id(s_tischfenster_voltage).state,
              api_ok && id(s_tischfenster_device_temperature).has_state(), id(s_tischfenster_device_temperature).state,
              id(g_tischfenster_last_seen_ms));
          set_contact(id(dot_bettfenster_links), id(lbl_bettfenster_links_state), id(lbl_bettfenster_links_vals), id(lbl_bettfenster_links_seen),
              api_ok && id(s_bettfenster_links_contact).has_state(), id(s_bettfenster_links_contact).state,
              api_ok && id(s_bettfenster_links_battery).has_state(), id(s_bettfenster_links_battery).state,
              api_ok && id(s_bettfenster_links_voltage).has_state(), id(s_bettfenster_links_voltage).state,
              api_ok && id(s_bettfenster_links_device_temperature).has_state(), id(s_bettfenster_links_device_temperature).state,
              id(g_bettfenster_links_last_seen_ms));
          set_contact(id(dot_bettfenster_rechts), id(lbl_bettfenster_rechts_state), id(lbl_bettfenster_rechts_vals), id(lbl_bettfenster_rechts_seen),
              api_ok && id(s_bettfenster_rechts_contact).has_state(), id(s_bettfenster_rechts_contact).state,
