              # (white/orange/red) is still set in draw_electric, only
              # the position/font came from the anchor.
              - label:
                  <<: *row_main
                  id: lbl_electric_batt_main
                  text: "---%"
              # Shared state/secondary-line slot - see row_state's own
              # comment (on the Shore box, above; this is the box the
              # pattern was named after). Remaining time below is EXTRA,
              # not part of that shared slot - Battery is the one box
              # with a second line of its own between the state line and
              # the bottom row.
              - label:
                  <<: *row_state
                  id: lbl_electric_batt_state
                  text: "---"
              - label:
                  id: lbl_electric_batt_time
                  align: TOP_MID
                  y: 164
                  text: ""
                  text_font: font_ui_20
                  text_color: 0xBDC1C6
              # DC bus V / A / W, left / middle / right. x/width match
              # row_bottom_l/r's own 24px inset and gap exactly (repo-
              # owner: "alle Werte auf der untersten Ebene sind zu weit
              # aussen") - 24px side padding + 3x76 + 2x12 gap = 252px,
              # i.e. 300 - 2x24.
              - label:
                  id: lbl_electric_batt_v
                  align: TOP_LEFT
                  x: 24
                  y: 210
                  width: 76
                  text_align: CENTER
                  text: "---V"
                  text_font: font_ui_20
                  text_color: 0x555555
              - label:
                  id: lbl_electric_batt_a
                  align: TOP_MID
                  y: 210
                  width: 76
                  text_align: CENTER
                  text: "---A"
                  text_font: font_ui_20
                  text_color: 0x555555
              - label:
