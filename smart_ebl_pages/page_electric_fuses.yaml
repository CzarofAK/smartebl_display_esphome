  # sub-page). All 16, protocol.md group 1 - smartebl already broadcasts
  # this group (see that repo's smart-ebl.yaml) but nothing on the
  # display side consumed it until now. Names/functions are smartebl's
  # own real fuse table (CLAUDE.md "Outputs"/"Special Outputs"), not the
  # old Nextion mockup's generic "Fuse.1 Main" placeholders - real
  # function per fuse, same one smartebl's own hardware datasheet uses.
  # `fuse_fN_ok = voltage > 1.0V` (design_rules.md §2) is computed in
  # draw_fuses directly from these, not a separate binary_sensor here -
  # same reasoning as smartebl's own fuse_fN_ok template sensors: no
  # need to send/store both the raw value and its derived boolean.
