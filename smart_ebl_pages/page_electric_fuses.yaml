script:
  # ---- Fuses (page_electric_fuses, Electric section's sub-page 2) -
  # protocol.md group 1, all 16, now real on both ends (see the sensor:
  # block's own comment). `fuse_fN_ok = voltage > 1.0V` is smartebl's
  # OWN rule for itself (design_rules.md §2), reused here - but applied
  # more carefully than a blanket "low voltage = blown fuse" would be:
  # these ADCs read the LOAD side of each fuse, so a SWITCHED group
  # (Light/12V/AUX/Pump) reads near 0V any time its own group switch is
  # simply off, same as a blown fuse would look. Cross-referencing each
  # switched fuse against its own group's mirror (already on this
  # display via the link) turns "AUS" (switch off, expected, not a
  # fault) and "AUSGEFALLEN?" (should be live, isn't - a real fault)
  # into two different things instead of one ambiguous red dot. F2/F3
  # (vehicle/D+-controlled) and F10 (fridge D+/programmable) have no
  # switch mirror on this display to check against - shown read-only,
  # never alarmed, same "don't claim precision this display doesn't
  # have" reasoning as the Home page's Fridge tile.
  - id: draw_fuses
    mode: restart
    then:
      - lambda: |-
          bool connected = id(link_last_rx_ms) != 0 &&
              (millis() - id(link_last_rx_ms)) < 3000;

          // kind: 0 = permanent (always expected live), 1 = switched
          // (expected live only while sw_state is true), 2 = vehicle/
          // D+-controlled or conditional (no known expectation here).
          auto set_fuse = [&](lv_obj_t *dot, lv_obj_t *lbl_v, lv_obj_t *lbl_state,
                               float v, int kind, bool sw_state) {
            char b[16];
            if (!connected) {
              lv_label_set_text(lbl_v, "---V");
              lv_label_set_text(lbl_state, "---");
              lv_obj_set_style_text_color(lbl_state, lv_color_hex(0x555555), 0);
              lv_obj_set_style_bg_color(dot, lv_color_hex(0x555555), 0);
              return;
            }
            snprintf(b, sizeof(b), "%.2fV", v);
            lv_label_set_text(lbl_v, b);
            bool live = v > 1.0f;
            uint32_t col; std::string txt;
            if (kind == 0) {
              col = live ? 0x2ECC71 : 0xE74C3C;
              txt = live ? "OK" : "AUSGEFALLEN";
            } else if (kind == 1) {
              if (sw_state && !live) { col = 0xE74C3C; txt = "AUSGEFALLEN?"; }
              else if (sw_state) { col = 0x2ECC71; txt = "OK"; }
              else { col = 0x707070; txt = "AUS"; }
            } else {
              col = live ? 0x2ECC71 : 0x555555;
              txt = live ? "OK" : "---";
            }
            lv_label_set_text(lbl_state, txt.c_str());
            lv_obj_set_style_text_color(lbl_state, lv_color_hex(col), 0);
            lv_obj_set_style_bg_color(dot, lv_color_hex(col), 0);
          };

          set_fuse(id(dot_fuse_f1), id(lbl_fuse_f1_v), id(lbl_fuse_f1_state),
                    id(s_fuse_f1_voltage).state, 1, id(sw_pump_mirror).state);
          set_fuse(id(dot_fuse_f2), id(lbl_fuse_f2_v), id(lbl_fuse_f2_state),
                    id(s_fuse_f2_voltage).state, 2, false);
          set_fuse(id(dot_fuse_f3), id(lbl_fuse_f3_v), id(lbl_fuse_f3_state),
                    id(s_fuse_f3_voltage).state, 2, false);
          set_fuse(id(dot_fuse_f4), id(lbl_fuse_f4_v), id(lbl_fuse_f4_state),
                    id(s_fuse_f4_voltage).state, 1, id(sw_light_mirror).state);
          set_fuse(id(dot_fuse_f5), id(lbl_fuse_f5_v), id(lbl_fuse_f5_state),
                    id(s_fuse_f5_voltage).state, 1, id(sw_light_mirror).state);
          set_fuse(id(dot_fuse_f6), id(lbl_fuse_f6_v), id(lbl_fuse_f6_state),
                    id(s_fuse_f6_voltage).state, 0, true);
          set_fuse(id(dot_fuse_f7), id(lbl_fuse_f7_v), id(lbl_fuse_f7_state),
                    id(s_fuse_f7_voltage).state, 0, true);
          set_fuse(id(dot_fuse_f8), id(lbl_fuse_f8_v), id(lbl_fuse_f8_state),
                    id(s_fuse_f8_voltage).state, 0, true);
          set_fuse(id(dot_fuse_f9), id(lbl_fuse_f9_v), id(lbl_fuse_f9_state),
                    id(s_fuse_f9_voltage).state, 0, true);
          set_fuse(id(dot_fuse_f10), id(lbl_fuse_f10_v), id(lbl_fuse_f10_state),
                    id(s_fuse_f10_voltage).state, 2, false);
          set_fuse(id(dot_fuse_f11), id(lbl_fuse_f11_v), id(lbl_fuse_f11_state),
                    id(s_fuse_f11_voltage).state, 1, id(sw_aux_mirror).state);
          set_fuse(id(dot_fuse_f12), id(lbl_fuse_f12_v), id(lbl_fuse_f12_state),
                    id(s_fuse_f12_voltage).state, 1, id(sw_aux_mirror).state);
          set_fuse(id(dot_fuse_f13), id(lbl_fuse_f13_v), id(lbl_fuse_f13_state),
                    id(s_fuse_f13_voltage).state, 1, id(sw_aux_mirror).state);
          set_fuse(id(dot_fuse_f14), id(lbl_fuse_f14_v), id(lbl_fuse_f14_state),
                    id(s_fuse_f14_voltage).state, 1, id(sw_12v_mirror).state);
          set_fuse(id(dot_fuse_f15), id(lbl_fuse_f15_v), id(lbl_fuse_f15_state),
                    id(s_fuse_f15_voltage).state, 1, id(sw_12v_mirror).state);
          set_fuse(id(dot_fuse_f16), id(lbl_fuse_f16_v), id(lbl_fuse_f16_state),
                    id(s_fuse_f16_voltage).state, 1, id(sw_12v_mirror).state);

          // ---- Footer: first real fault found, permanent fuses first
          // (a genuinely unexpected 0V there) then switched fuses whose
          // own group is commanded on but reading dead.
          const char *fault = nullptr;
          if (connected) {
            if (id(s_fuse_f6_voltage).state <= 1.0f) fault = "F6";
            else if (id(s_fuse_f7_voltage).state <= 1.0f) fault = "F7";
            else if (id(s_fuse_f8_voltage).state <= 1.0f) fault = "F8";
            else if (id(s_fuse_f9_voltage).state <= 1.0f) fault = "F9";
            else if (id(sw_pump_mirror).state && id(s_fuse_f1_voltage).state <= 1.0f) fault = "F1";
            else if (id(sw_light_mirror).state && id(s_fuse_f4_voltage).state <= 1.0f) fault = "F4";
            else if (id(sw_light_mirror).state && id(s_fuse_f5_voltage).state <= 1.0f) fault = "F5";
            else if (id(sw_aux_mirror).state && id(s_fuse_f11_voltage).state <= 1.0f) fault = "F11";
            else if (id(sw_aux_mirror).state && id(s_fuse_f12_voltage).state <= 1.0f) fault = "F12";
            else if (id(sw_aux_mirror).state && id(s_fuse_f13_voltage).state <= 1.0f) fault = "F13";
            else if (id(sw_12v_mirror).state && id(s_fuse_f14_voltage).state <= 1.0f) fault = "F14";
            else if (id(sw_12v_mirror).state && id(s_fuse_f15_voltage).state <= 1.0f) fault = "F15";
            else if (id(sw_12v_mirror).state && id(s_fuse_f16_voltage).state <= 1.0f) fault = "F16";
          }
          if (!connected) {
            lv_label_set_text(id(lbl_fuses_status), "KEINE VERBINDUNG");
            lv_obj_set_style_text_color(id(lbl_fuses_status), lv_color_hex(0x555555), 0);
          } else if (fault) {
            char b[32];
            snprintf(b, sizeof(b), "SICHERUNG %s AUSGEFALLEN", fault);
            lv_label_set_text(id(lbl_fuses_status), b);
            lv_obj_set_style_text_color(id(lbl_fuses_status), lv_color_hex(0xE74C3C), 0);
          } else {
            lv_label_set_text(id(lbl_fuses_status), "");
          }

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_fuses

