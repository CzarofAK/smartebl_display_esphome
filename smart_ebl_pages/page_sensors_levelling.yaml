# =============================================================================
#  smart_ebl_pages/page_sensors_levelling.yaml -- page: Sensors, sub-page 2 (Levelling)
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §5: ported from m5dial_fram/page_levelling.yaml - same
# MPU6050 tilt sensor + four pre-computed per-corner cm entities, same
# bubble-target-rings metaphor. Reached as Sensors section's sub-page 2
# (nav_show_sensors, main device file) - this page has no nav entry of
# its own.
#
# ---- 2026-09-06 relayout (repo-owner: "sensors2: das Widget ist VIEL zu
# klein! eine Seite der freien Flaeche benutzen. Die andere Haelfte ist
# fuer die Huebstuetzen-Kontrolle reserviert.") ------------------------
# The bubble-level widget used to be a single 200x200 box adrift in the
# middle of a 1150x736 content area - correct content, wrong scale.
# Split the content area at x=705 (same left/right halves split as
# page_fans's own obj_fans_divider) instead:
#   - LEFT half: the same bubble-level widget, everything doubled (200
#     -> 400 root box, every ring/bubble/offset inside it x2 as well -
#     a clean scale factor, not a re-guess at the geometry) so it
#     actually fills its half instead of floating small inside the
#     whole page.
#   - RIGHT half: NEW - Huebstuetzen (leveling jack) control.
#     Repo-owner-confirmed (2026-09-06): the jacks are **not physically
#     installed in this motorhome yet** - there is nothing real to wire
#     regardless of what entity_ids get guessed. An earlier round of
#     this file built a fully-wired panel against PLACEHOLDER
#     entity_ids (switch.hubstuetzen_ausfahren/_einfahren,
#     binary_sensor.hubstuetze_vl/_vr/_hl/_hr, live HA polling, a
#     retract-confirm popup) - torn back out per that confirmation:
#     polling entities that don't exist anywhere would just log HA
#     warnings for nothing (the exact case m5dial_fram/design_rules.md
#     already calls out as the one real exception to "poll every
#     page's entities"), and per-corner AUSFAHREN/EINFAHREN was this
#     repo's own invented guess at the UI shape, not something the
#     repo owner actually asked for.
#
#     What's here instead is a genuinely reserved placeholder - same
#     "reserve the slot regardless of outcome, permanently-invalid
#     style, no live entity, no on_click" treatment as the Home page's
#     own Fridge tile - sized and laid out for the FUTURE control the
#     repo owner actually described once the hardware exists: one ON/OFF
#     switch, one AUTOLEVEL button, and a status indicator that's green
#     when retracted / red when extended ("maybe others" - the repo
#     owner's own words, so this isn't assumed final). Wiring it for
#     real is then "replace this mockup's widgets with live ones",
#     never "figure out the layout" - same reasoning
#     page_sensors_overview.yaml's own placeholder already established
#     for door/window contacts.
# =============================================================================

sensor:
  # ---- Sensors/Levelling (page_sensors_levelling) - same MPU6050 tilt
  # sensor + four pre-computed per-corner cm entities m5dial_fram's
  # page_levelling.yaml already reads (see that file's own header for
  # why the degrees-to-cm math happens in HA, not on any display).
  - platform: homeassistant
    id: s_levelling_lon
    entity_id: sensor.mpu6050_pitch
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_lat
    entity_id: sensor.mpu6050_roll
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_vl
    entity_id: sensor.mpu6050_womo_vl_cm
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_vr
    entity_id: sensor.mpu6050_womo_vr_cm
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_hl
    entity_id: sensor.mpu6050_womo_hl_cm
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_hr
    entity_id: sensor.mpu6050_womo_hr_cm
    on_value:
      - script.execute: draw_levelling

script:
  # ---- Sensors / Levelling (page_sensors_levelling, Sensors section's
  # sub-page 2) - ported from m5dial_fram/page_levelling.yaml, same real
  # entities, same bubble-level metaphor and per-corner cm readout (see
  # that file's own header for the full reasoning, including its own
  # still-open item: the corner sensors read 0 until an HA-side template
  # sensor does the real degrees-to-cm math, per that file's OPEN ITEM
  # note - nothing to change here once that lands, same as there).
  # Read-only, no button, same as the M5Dial version - and no arc
  # (design_rules.md §3: a tilt isn't a 0-100% quantity either).
  - id: poll_levelling
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_pitch
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_roll
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_vl_cm
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_vr_cm
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_hl_cm
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_hr_cm

  - id: draw_levelling
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif

          // ---- Bubble position - R_MAX=170px maps to DEG_MAX=4°, same
          // as m5dial_fram/page_levelling.yaml (same UNVERIFIED
          // direction-sign caveat that file's header documents - flip
          // here too if it reads backwards on the real device). R_MAX
          // doubled (85->170) along with every other dimension in this
          // widget for the 2026-09-06 relayout (see this file's own
          // header) - proportions unchanged, just twice the size.
          const float R_MAX = 170.0f, DEG_MAX = 4.0f;
          bool lat_ok = api_ok && id(s_levelling_lat).has_state();
          bool lon_ok = api_ok && id(s_levelling_lon).has_state();
          float ox = 0, oy = 0;
          if (lat_ok) {
            ox = -(id(s_levelling_lat).state / DEG_MAX) * R_MAX;
            if (ox > R_MAX) ox = R_MAX;
            if (ox < -R_MAX) ox = -R_MAX;
          }
          if (lon_ok) {
            oy = (id(s_levelling_lon).state / DEG_MAX) * R_MAX;
            if (oy > R_MAX) oy = R_MAX;
            if (oy < -R_MAX) oy = -R_MAX;
          }
          // obj_levelling_bubble's parent is obj_levelling_root, a local
          // 400x400 coordinate container (same "local coordinate origin"
          // trick page_climate's own obj_truma_room/obj_truma_water use)
          // filling the left half of the content area rather than the
          // whole screen - see that container's own widget comment.
          // lv_obj_set_pos is always parent-relative, so ox/oy=0 has to
          // land on the container's own center: (400-52)/2 = 174 on
          // both axes (bubble is now 52x52, doubled from 26x26).
          lv_obj_set_pos(id(obj_levelling_bubble), (int) ox + 174, (int) oy + 174);

          bool vl_ok = api_ok && id(s_levelling_vl).has_state();
          bool vr_ok = api_ok && id(s_levelling_vr).has_state();
          bool hl_ok = api_ok && id(s_levelling_hl).has_state();
          bool hr_ok = api_ok && id(s_levelling_hr).has_state();

          // Bubble color follows the worst corner (cm), same as
          // m5dial_fram - so the bubble and the four numbers never
          // disagree about how bad it is.
          uint32_t bubble_col = 0x555555;
          if (vl_ok && vr_ok && hl_ok && hr_ok) {
            float v = id(s_levelling_vl).state;
            float t;
            t = id(s_levelling_vr).state; if (t > v) v = t;
            t = id(s_levelling_hl).state; if (t > v) v = t;
            t = id(s_levelling_hr).state; if (t > v) v = t;
            if (v < 0.0f) v = 0.0f;
            bubble_col = v >= 3.0f ? 0xE74C3C : (v >= 1.5f ? 0xF39C12 : 0xFFFFFF);
          }
          lv_obj_set_style_bg_color(id(obj_levelling_bubble), lv_color_hex(bubble_col), 0);

          auto set_corner = [&](lv_obj_t *lbl, const char *prefix, bool ok, float raw) {
            char b[16];
            if (!ok) {
              snprintf(b, sizeof(b), "%s --cm", prefix);
              lv_label_set_text(lbl, b);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0x555555), 0);
              return;
            }
            float v = raw < 0.0f ? 0.0f : raw;
            snprintf(b, sizeof(b), "%s %.0fcm", prefix, v);
            lv_label_set_text(lbl, b);
            uint32_t col = v >= 3.0f ? 0xE74C3C : (v >= 1.5f ? 0xF39C12 : 0xBDC1C6);
            lv_obj_set_style_text_color(lbl, lv_color_hex(col), 0);
          };
          set_corner(id(lbl_levelling_vl), "VL", vl_ok, vl_ok ? id(s_levelling_vl).state : 0.0f);
          set_corner(id(lbl_levelling_vr), "VR", vr_ok, vr_ok ? id(s_levelling_vr).state : 0.0f);
          set_corner(id(lbl_levelling_hl), "HL", hl_ok, hl_ok ? id(s_levelling_hl).state : 0.0f);
          set_corner(id(lbl_levelling_hr), "HR", hr_ok, hr_ok ? id(s_levelling_hr).state : 0.0f);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_levelling

lvgl:
  pages:
    # =========================================================================
    # Sensors, sub-page 2 (page_sensors_levelling) - see this file's own
    # header for the 2026-09-06 left/right-half relayout. Divider at
    # x=705 - same left/right halves split as page_fans's own
    # obj_fans_divider, for a consistent "two-halves" convention across
    # pages that use it.
    - id: page_sensors_levelling
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - script.execute: poll_levelling
      widgets:
        - obj:
            id: obj_levelling_divider
            align: TOP_LEFT
            x: 705
            y: 90
            width: 1
            height: 620
            bg_color: 0x3C4043
            bg_opa: COVER
            border_width: 0
            radius: 0
            clickable: false

        # ---- LEFT half: bubble level, doubled (400x400 root, was
        # 200x200) - x=218,y=232 centers it in the left half (content
        # x130-705, y64-800): centerX=(130+705)/2=418, centerY=
        # (64+800)/2=432, box half-size=200 -> x=218, y=232.
        #
        # scrollbar_mode: OFF (repo-owner, 2026-09-06: "die Libelle hat
        # auch scroll bars... auch weg.") - same LVGL default-scrollable-
        # obj cause as page_levels.yaml's tank columns/page_fans.yaml's
        # FANBOARD half (see either one's own comment for the mechanism)
        # - the three target rings (largest is 400x400, exactly this
        # container's own size) sit right at that overflow edge.
        - obj:
            id: obj_levelling_root
            align: TOP_LEFT
            x: 218
            y: 232
            width: 400
            height: 400
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: OFF
            widgets:
              # ---- Static target rings (all x2 from the original
              # 200/140/80 set, see this file's header) -----------------
              - obj:
                  align: CENTER
                  width: 400
                  height: 400
                  radius: 200
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x2A2D30
              - obj:
                  align: CENTER
                  width: 280
                  height: 280
                  radius: 140
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x2A2D30
              - obj:
                  align: CENTER
                  width: 160
                  height: 160
                  radius: 80
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x2ECC71

              # ---- The bubble itself (doubled: 52x52, was 26x26) --------
              - obj:
                  id: obj_levelling_bubble
                  align: CENTER
                  width: 52
                  height: 52
                  radius: 26
                  bg_color: 0x555555
                  bg_opa: COVER
                  border_width: 0

              # ---- Four corners: cm to add, VL/VR top, HL/HR bottom
              # (offsets doubled: ±88/∓108, was ±44/∓54; font bumped
              # 16->24 to match the bigger widget) ------------------------
              - label:
                  id: lbl_levelling_vl
                  align: CENTER
                  x: -88
                  y: -108
                  text: "VL --cm"
                  text_font: font_ui_24
                  text_color: 0x555555
              - label:
                  id: lbl_levelling_vr
                  align: CENTER
                  x: 88
                  y: -108
                  text: "VR --cm"
                  text_font: font_ui_24
                  text_color: 0x555555
              - label:
                  id: lbl_levelling_hl
                  align: CENTER
                  x: -88
                  y: 108
                  text: "HL --cm"
                  text_font: font_ui_24
                  text_color: 0x555555
              - label:
                  id: lbl_levelling_hr
                  align: CENTER
                  x: 88
                  y: 108
                  text: "HR --cm"
                  text_font: font_ui_24
                  text_color: 0x555555

        # ---- RIGHT half: Huebstuetzen (leveling jacks) - RESERVED, not
        # installed yet (this file's own header) - a mockup of the
        # future control, permanently in the invalid/grey style, no
        # live entity, no on_click, same treatment as the Home page's
        # Fridge tile. Sized so wiring it for real later is "swap these
        # widgets for live ones", not "invent the layout".
        #
        # y:182 (was 110), height:500 unchanged (repo-owner, 2026-09-06:
        # "Hubstützen Übersicht weiter runter, vertikal einmitten") -
        # centered the same way the LEFT half's own bubble-level root is
        # (see that container's own comment): centerY=(64+800)/2=432,
        # box half-height=250 -> y=182. y:110 used to put this box's
        # visible top noticeably above the bubble's own y:232 - now both
        # halves' boxes share the same vertical center.
        - obj:
            id: obj_hub_panel
            align: TOP_LEFT
            x: 730
            y: 182
            width: 500
            height: 500
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: OFF
            widgets:
              - label:
                  align: TOP_MID
                  y: 0
                  text_font: font_ui_20
                  text: "HUBSTÜTZEN"
                  text_color: 0x707070
              - label:
                  align: TOP_MID
                  y: 36
                  text_font: font_ui_16
                  text: "NOCH NICHT VERBAUT"
                  text_color: 0x555555

              # ---- Future control mockup - ON/OFF switch look-alike,
              # AUTOLEVEL button, status dot (repo-owner spec: green =
              # eingefahren/retracted, red = ausgefahren/extended -
              # "vielleicht auch andere", so more may be added later).
              # All greyed out and non-interactive on purpose.
              - obj:
                  id: obj_hub_onoff_track
                  align: TOP_MID
                  y: 100
                  width: 90
                  height: 44
                  radius: 22
                  bg_color: 0x202124
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x3C4043
                  clickable: false
                  widgets:
                    - obj:
                        id: obj_hub_onoff_knob
                        align: LEFT_MID
                        x: 4
                        width: 36
                        height: 36
                        radius: 18
                        bg_color: 0x555555
                        bg_opa: COVER
                        border_width: 0
                        clickable: false
              - label:
                  align: TOP_MID
                  y: 154
                  text_font: font_ui_16
                  text: "EIN / AUS"
                  text_color: 0x555555

              - obj:
                  id: obj_hub_autolevel
                  align: TOP_MID
                  y: 220
                  width: 260
                  height: 80
                  radius: 12
                  bg_color: 0x202124
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x3C4043
                  clickable: false
                  widgets:
                    - label:
                        align: CENTER
                        text: "AUTOLEVEL"
                        text_font: font_ui_20
                        text_color: 0x555555

              - obj:
                  id: dot_hub_status
                  align: TOP_MID
                  y: 340
                  width: 20
                  height: 20
                  radius: 10
                  bg_color: 0x555555
                  bg_opa: COVER
                  border_width: 0
                  clickable: false
              - label:
                  align: TOP_MID
                  y: 372
                  width: 460
                  text_align: CENTER
                  text_font: font_ui_16
                  text: "Status: grün = eingefahren, rot = ausgefahren"
                  text_color: 0x555555
