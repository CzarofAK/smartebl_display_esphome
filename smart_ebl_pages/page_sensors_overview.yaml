# =============================================================================
#  smart_ebl_pages/page_sensors_overview.yaml -- page: Sensors, sub-page 1 (Overview)
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §5/§7: honest placeholder - the real door/window/presence
# entity list isn't enumerated yet. Exists (with its own nav entry + "1/2"
# indicator) so sub-page 2 (Levelling, page_sensors_levelling.yaml, real)
# is reachable without waiting on this page's content. Replace this
# page's widgets once that entity list exists - no navigation wiring
# needed here, that already lives in nav_show_sensors (main device file).
#
# ---- 2026-09-06 (repo-owner: "welche Sensoren brauchst du? Schliesser
# wie Tueren, etc.?") ---------------------------------------------------
# Category confirmed: **door/window contacts** (the other candidates
# offered - presence/motion, water leak, smoke/CO - were not selected).
# Real per-door/window entity_ids still aren't known, so this stays a
# placeholder, but now a SHAPED one instead of just a caption: the same
# dot+caption+state cell `page_electric_fuses.yaml`'s fuse grid already
# uses, which is itself `smartebl_display/docs/design.md`'s Template 2
# ("Status Grid Overview") - reused rather than invented a second grid
# style. 6 generic cells (2 rows x 3 columns, "KONTAKT 1".."KONTAKT 6")
# in the permanently-invalid grey style, no entity, no on_value - swap
# each cell's caption + wire a real binary_sensor (device_class door or
# window) once the actual entity list exists; the grid itself doesn't
# need to change shape for that, only content (same "reserve the slot"
# reasoning as page_sensors_levelling.yaml's Huebstuetzen mockup).
# =============================================================================

lvgl:
  pages:
    # =========================================================================
    # Sensors, sub-page 1 (page_sensors_overview) - see this file's own
    # header. 6 cells, 2 rows x 3 columns: 3x340px cells + 2x30px gaps =
    # 1080px, centered in the 1150px content area -> 35px side margin ->
    # columns x165/535/905; 2x200px rows + 1x40px gap = 440px, centered
    # in the 736px content height -> 148px top/bottom margin -> rows
    # y212/452. Same dot+cap+state cell shape as
    # page_electric_fuses.yaml's real fuse grid, just every cell greyed
    # out (no entity behind any of them yet).
    - id: page_sensors_overview
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - obj: &contact_cell
            id: obj_contact_1
            align: TOP_LEFT
            x: 165
            y: 212
            width: 340
            height: 200
            radius: 12
            bg_color: 0x202124
            bg_opa: COVER
            border_width: 1
            border_color: 0x3C4043
            pad_all: 0
            widgets:
              - label: &contact_cap
                  align: TOP_LEFT
                  x: 16
                  y: 14
                  text: "KONTAKT 1"
                  text_font: font_ui_20
                  text_color: 0x707070
              - obj: &contact_dot
                  id: dot_contact_1
                  align: TOP_RIGHT
                  x: -16
                  y: 18
                  width: 20
                  height: 20
                  radius: 10
                  bg_color: 0x555555
                  bg_opa: COVER
                  border_width: 0
              - label: &contact_state
                  id: lbl_contact_1_state
                  align: BOTTOM_LEFT
                  x: 16
                  y: -14
                  text: "---"
                  text_font: font_ui_20
                  text_color: 0x555555
        - obj:
            <<: *contact_cell
            id: obj_contact_2
            x: 535
            widgets:
              - label: {<<: *contact_cap, text: "KONTAKT 2"}
              - obj: {<<: *contact_dot, id: dot_contact_2}
              - label: {<<: *contact_state, id: lbl_contact_2_state}
        - obj:
            <<: *contact_cell
            id: obj_contact_3
            x: 905
            widgets:
              - label: {<<: *contact_cap, text: "KONTAKT 3"}
              - obj: {<<: *contact_dot, id: dot_contact_3}
              - label: {<<: *contact_state, id: lbl_contact_3_state}
        - obj:
            <<: *contact_cell
            id: obj_contact_4
            y: 452
            widgets:
              - label: {<<: *contact_cap, text: "KONTAKT 4"}
              - obj: {<<: *contact_dot, id: dot_contact_4}
              - label: {<<: *contact_state, id: lbl_contact_4_state}
        - obj:
            <<: *contact_cell
            id: obj_contact_5
            x: 535
            y: 452
            widgets:
              - label: {<<: *contact_cap, text: "KONTAKT 5"}
              - obj: {<<: *contact_dot, id: dot_contact_5}
              - label: {<<: *contact_state, id: lbl_contact_5_state}
        - obj:
            <<: *contact_cell
            id: obj_contact_6
            x: 905
            y: 452
            widgets:
              - label: {<<: *contact_cap, text: "KONTAKT 6"}
              - obj: {<<: *contact_dot, id: dot_contact_6}
              - label: {<<: *contact_state, id: lbl_contact_6_state}

        - label:
            align: BOTTOM_MID
            y: -12
            width: 900
            text_align: CENTER
            text_font: font_ui_16
            text: "Tür-/Fensterkontakte bestätigt - reale Entity-Liste fehlt noch (docs/pages.md §7)"
            text_color: 0x555555
