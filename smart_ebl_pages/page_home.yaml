# =============================================================================
#  smart_ebl_pages/page_home.yaml -- page: Home (Mainscreen)
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §6: digital clock (right half, see that section's own
# note - replaced the round `sbb_clock` widget 2026-09-19) + 5 switch
# tiles in a 2x3 grid (Fridge slot reserved, not wired yet - see that
# section's own table). The 5 switches here mirror smartebl's own relay
# groups over the RS232 link (docs/protocol.md groups 2/4), not Home
# Assistant - same reason page_electric's link-fed values don't need an
# api_ok guard either.
#
# ---- Alarmo (2026-09-06, repo-owner: "koennen wir noch irgendwo die
# Alarmanlage integrieren?") -------------------------------------------
# Exactly the design pages.md §6 already specified but never built: a
# home-page-only tile + PIN popup (numeric keypad) -> arm/disarm,
# deliberately NOT in the quick-switch popup or the status bar (a
# security action, own confirmation step - same reasoning as the
# Huebstuetzen EINFAHREN confirm on page_sensors_levelling.yaml). The
# 2x3 switch-tile grid was already full (pages.md §6's own diagram has
# no Alarmo slot in it) - placed instead below the clock, in the
# previously-empty x815-1135/y605-755 strip.
#
# Entity_id: alarm_control_panel.alarmo - NOT a blind guess like the
# Huebstuetzen placeholders on page_sensors_levelling.yaml: "Alarmo" is
# a specific HACS integration (not a generic term for "an alarm
# system"), and it exposes exactly one entity per instance, always
# named alarm_control_panel.alarmo by default - reused here on that
# strength, but still flag if this installation's instance was ever
# renamed away from the default.
# =============================================================================

text_sensor:
  - platform: homeassistant
    id: s_alarmo_state
    entity_id: alarm_control_panel.alarmo
    on_value:
      - script.execute: draw_alarm_tile

globals:
  # PIN entry buffer for the arm/disarm keypad popup below - cleared on
  # open, on CLR, and after every submit (success or failure) so a code
  # never lingers on screen or gets accidentally resubmitted.
  - id: g_alarm_pin
    type: std::string
    restore_value: false
    initial_value: '""'

switch:
  # Optimistic local mirrors of smartebl's switches - reflect the
  # tile's ON/OFF state only, no turn_on_action/turn_off_action.
  #
  # BUG FIXED (found on real hardware, see the commit this comment
  # landed in): these used to have turn_on_action/turn_off_action
  # calling send_link_command directly. ESPHome's switch component
  # unconditionally calls write_state() - which runs those actions -
  # in two situations this repo never wants to send a command for:
  #   1. At boot, to enact the (restored/default) initial state -
  #      this alone sent "everything OFF" to smartebl on every single
  #      display reboot, regardless of smartebl's actual state.
  #   2. Every time the link reader below reflects an incoming
  #      telemetry frame via turn_on()/turn_off() - since that ALSO
  #      unconditionally re-ran the action, every ~800ms telemetry
  #      cycle re-sent the same command back to smartebl, which would
  #      re-pulse the physical bistable relay coil over and over for
  #      as long as the link stayed up, not just on an actual change.
  # Fix: these switches now hold state only (publish_state() from the
  # reader, not turn_on()/turn_off()) and the tiles below call
  # send_link_command explicitly from on_click - the only place a
  # command is actually supposed to originate from.
  - platform: template
    id: sw_pump_mirror
    name: "Water Pump (via link)"
    icon: mdi:water-pump
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_light_mirror
    name: "Light Group (via link)"
    icon: mdi:lightbulb-group
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_12v_mirror
    name: "12V Group (via link)"
    icon: mdi:power-socket-eu
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_aux_mirror
    name: "AUX Group (via link)"
    icon: mdi:power
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_eisex_mirror
    name: "EisEx Heater (via link)"
    icon: mdi:heating-coil
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

script:
  # ---- Mainscreen (page_home) tiles -------------------------------------
  # design_rules.md §2's one-script-per-related-values pattern: all five
  # switch tiles are redrawn together rather than five separate lambdas
  # racing each other.
  - id: draw_home_tiles
    mode: restart
    then:
      - lambda: |-
          auto set_tile = [](lv_obj_t *lbl, bool on) {
            lv_label_set_text(lbl, on ? "ON" : "OFF");
            lv_obj_set_style_text_color(lbl,
                lv_color_hex(on ? 0x2ECC71 : 0xBDC1C6), 0);
          };
          set_tile(id(lbl_tile_12v), id(sw_12v_mirror).state);
          set_tile(id(lbl_tile_aux), id(sw_aux_mirror).state);
          set_tile(id(lbl_tile_light), id(sw_light_mirror).state);
          set_tile(id(lbl_tile_pump), id(sw_pump_mirror).state);
          set_tile(id(lbl_tile_eisex), id(sw_eisex_mirror).state);

  # ---- Alarmo tile - humanized state + color, same "one script redraws
  # everything this value drives" pattern as draw_home_tiles above.
  - id: draw_alarm_tile
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          if (!api_ok || !id(s_alarmo_state).has_state()) {
            lv_label_set_text(id(lbl_tile_alarm), "---");
            lv_obj_set_style_text_color(id(lbl_tile_alarm), lv_color_hex(0x555555), 0);
            return;
          }
          // Repo owner: "ich nutze nur Armed home, Armed away und
          // Disarmed" - those three get their own short tags; the
          // three Alarmo modes this installation doesn't use
          // (armed_night/armed_vacation/armed_custom_bypass) still get
          // a sane fallback rather than silently reading as "---".
          std::string s = id(s_alarmo_state).state;
          std::string text; uint32_t col;
          if (s == "disarmed") {
            text = "AUS"; col = 0x2ECC71;
          } else if (s == "triggered") {
            text = "ALARM"; col = 0xE74C3C;
          } else if (s == "pending" || s == "arming" || s == "disarming") {
            text = "..."; col = 0xF39C12;
          } else if (s == "armed_home") {
            text = "SCHARF H"; col = 0xE74C3C;
          } else if (s == "armed_away") {
            text = "SCHARF A"; col = 0xE74C3C;
          } else if (s.rfind("armed", 0) == 0) {
            text = "SCHARF"; col = 0xE74C3C;
          } else {
            text = "---"; col = 0x555555;
          }
          lv_label_set_text(id(lbl_tile_alarm), text.c_str());
          lv_obj_set_style_text_color(id(lbl_tile_alarm), lv_color_hex(col), 0);
      # Keeps the popup's ARM HOME/ARM AWAY/DISARM buttons correct even
      # if the state changes while the popup happens to already be
      # open - see draw_alarm_popup_buttons' own comment.
      - script.execute: draw_alarm_popup_buttons

  # ---- PIN popup (numeric keypad) - arm/disarm, see this file's own
  # header comment for why this lives here rather than in the
  # quick-switch popup or the status bar.
  - id: alarm_pin_add_digit
    parameters:
      digit: string
    then:
      - lambda: |-
          if (id(g_alarm_pin).size() < 8) {
            id(g_alarm_pin) += digit;
          }
          // Masked with 'X', not '*' - this file's shared glyph set
          // (smart-ebl-display.yaml's font: block) doesn't include '*',
          // same "tofu box" bug that block's own header comment already
          // fixed once for umlauts/arrows - reusing a glyph already in
          // that set avoids reintroducing it for one popup.
          std::string mask(id(g_alarm_pin).size(), 'X');
          lv_label_set_text(id(lbl_alarm_pin_display), mask.empty() ? "----" : mask.c_str());

  - id: alarm_pin_clear
    then:
      - lambda: |-
          id(g_alarm_pin).clear();
          lv_label_set_text(id(lbl_alarm_pin_display), "----");

  - id: show_alarm_popup
    then:
      - script.execute: alarm_pin_clear
      - script.execute: draw_alarm_popup_buttons
      - lvgl.widget.update: {id: obj_alarm_popup_backdrop, hidden: false}
      - lvgl.widget.update: {id: obj_alarm_popup_panel, hidden: false}

  - id: close_alarm_popup
    then:
      - script.execute: alarm_pin_clear
      - lvgl.widget.update: {id: obj_alarm_popup_backdrop, hidden: true}
      - lvgl.widget.update: {id: obj_alarm_popup_panel, hidden: true}

  # ---- Arm/disarm - THREE separate actions, not one generic "OK"
  # (repo-owner: "ich nutze nur Armed home, Armed away und Disarmed") -
  # a service call's own service: string isn't templatable in ESPHome
  # (same reason act_multiplus_set_mode/act_daynight_set_mode pick one
  # of several FIXED homeassistant.service: blocks via a button/option
  # rather than trying to template the service name itself), so each
  # mode gets its own button + its own fixed service call instead of
  # one action trying to infer which of three the tap meant.
  # draw_alarm_popup_buttons (below) shows only the buttons that make
  # sense for the CURRENT confirmed state - ARM HOME/ARM AWAY while
  # disarmed, DISARM while armed - so there's no way to tap the wrong
  # one for the state actually in effect.
  - id: act_alarm_arm_home
    then:
      - homeassistant.service:
          service: alarm_control_panel.alarm_arm_home
          data:
            entity_id: alarm_control_panel.alarmo
          data_template:
            code: "{{ code }}"
          variables:
            code: !lambda "return id(g_alarm_pin);"
      - script.execute: close_alarm_popup

  - id: act_alarm_arm_away
    then:
      - homeassistant.service:
          service: alarm_control_panel.alarm_arm_away
          data:
            entity_id: alarm_control_panel.alarmo
          data_template:
            code: "{{ code }}"
          variables:
            code: !lambda "return id(g_alarm_pin);"
      - script.execute: close_alarm_popup

  - id: act_alarm_disarm
    then:
      - homeassistant.service:
          service: alarm_control_panel.alarm_disarm
          data:
            entity_id: alarm_control_panel.alarmo
          data_template:
            code: "{{ code }}"
          variables:
            code: !lambda "return id(g_alarm_pin);"
      - script.execute: close_alarm_popup

  # ---- Popup button visibility - ARM HOME/ARM AWAY while disarmed
  # (or unknown), DISARM while any armed_* state. Called from
  # show_alarm_popup (so it's never stale when the popup opens) AND
  # from draw_alarm_tile (so it stays correct if the state changes
  # while the popup happens to be open already).
  - id: draw_alarm_popup_buttons
    then:
      - if:
          condition:
            lambda: |-
              #ifdef USE_API
              bool api_ok = api_is_connected();
              #else
              bool api_ok = true;
              #endif
              return api_ok && id(s_alarmo_state).has_state() &&
                  id(s_alarmo_state).state.rfind("armed", 0) == 0;
          then:
            - lvgl.widget.update: {id: btn_alarm_arm_home, hidden: true}
            - lvgl.widget.update: {id: btn_alarm_arm_away, hidden: true}
            - lvgl.widget.update: {id: btn_alarm_disarm, hidden: false}
          else:
            - lvgl.widget.update: {id: btn_alarm_arm_home, hidden: false}
            - lvgl.widget.update: {id: btn_alarm_arm_away, hidden: false}
            - lvgl.widget.update: {id: btn_alarm_disarm, hidden: true}

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_alarm_tile

lvgl:
  pages:
    # =========================================================================
    # Mainscreen (page_home) - pages.md §5/§6
    # =========================================================================
    - id: page_home
      # bg_color/bg_opa here, not just lvgl: bottom_layer: above - an
      # LVGL page has its own background that sits on top of
      # bottom_layer, and was NOT black by default on the real device
      # (reported by the repo owner) despite bottom_layer being black.
      # Every page below repeats this explicitly for the same reason.
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # ---- Right half: digital clock -----------------------------------
        # Replaces the round `sbb_clock` canvas widget (2026-09-19,
        # repo-owner: wants a version "ohne SBB clock, aber mit einer
        # weniger HW intensiven digital Uhr" - design_rules.md §4's own
        # open item names that canvas as a real, confirmed contributor to
        # the PSRAM-bus pressure behind the recurring DSI underrun/blue-
        # flash symptom). Plain LVGL labels instead of a canvas: no
        # PSRAM allocation, no per-frame redraw, no external_component -
        # just four `lv_label_set_text` calls a second, and only while
        # this page is even the one on screen (see `draw_status_bar`'s
        # own comment in the device file for the gating).
        #
        # Widened + rescaled (2026-09-19, round 2 - repo-owner: "die
        # Daten sind viel zu klein! dürfen breiter sein als der Alarmo
        # Button darunter. Die Uhr sogar BOLT!"): 320 -> 460, re-centered
        # on the same horizontal midpoint the old 320-wide box used
        # (815+160=975, so 975-230=745) rather than just growing one
        # edge - stays wider than `btn_tile_alarm` below (320) on both
        # sides, not just one. y/height (187/320) unchanged, so the
        # bottom edge and the 20px gap above the Alarmo tile are
        # untouched. Exact label x/y offsets below are a first pass, not
        # measured against real glyph metrics from the compiled subset
        # font (design_rules.md's own "decided by looking at the actual
        # device" reasoning) - refine once seen on real hardware.
        - obj:
            id: obj_home_clock
            align: TOP_LEFT
            x: 745
            y: 187
            width: 460
            height: 320
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              # HH:MM - large AND bold now (repo-owner's own ask,
              # verbatim "BOLT") - font_ui_72_bold is a dedicated font
              # (device file, `gfonts://Montserrat@bold`), the only bold
              # weight and the only 72px font anywhere in this project,
              # deliberately just for this one label. "Standard blue"
              # (design_rules.md §2's palette calls 0x4A9EFF "neutral
              # active"; reused verbatim, no new color).
              - label:
                  id: lbl_home_clock_time
                  align: TOP_MID
                  y: 55
                  text: "--:--"
                  text_font: font_ui_72_bold
                  text_color: 0x4A9EFF
              # DDD DD.MM.YY - German 2-letter day (Mo/Di/Mi/Do/Fr/Sa/So,
              # repo-owner's own pick over the 3/4-letter alternatives -
              # ESP-IDF's strftime has no German locale to draw "%a" from,
              # so `draw_status_bar` looks this up from a small fixed
              # table instead) + 2-digit year. font_ui_40 (not bold,
              # just bigger than the original font_ui_20 - only the time
              # line itself was asked to be bold) - already the shared
              # main-value size (Electric's boxes), no new font needed.
              - label:
                  id: lbl_home_clock_date
                  align: TOP_MID
                  y: 160
                  text: "-- --.--.--"
                  text_font: font_ui_40
                  text_color: 0x4A9EFF
              # OUT / IN temp - same size as the date line above, same
              # blue. Two separate labels (not one combined string) so
              # each can independently drop to the design_rules.md §2
              # invalid-value gray when its own source is stale/down,
              # exactly like the status bar's own lbl_status_temp_in/out
              # this mirrors (`draw_status_bar` updates all four labels
              # from the one already-computed t/tbuf, see that script).
              # x offsets widened (±70 -> ±115) to keep clear of each
              # other at font_ui_40 instead of the old font_ui_20.
              - label:
                  id: lbl_home_clock_temp_out
                  align: TOP_MID
                  x: -115
                  y: 220
                  text_font: font_ui_40
                  text: "OUT ---°C"
                  text_color: 0x555555
              - label:
                  id: lbl_home_clock_temp_in
                  align: TOP_MID
                  x: 115
                  y: 220
                  text_font: font_ui_40
                  text: "IN ---°C"
                  text_color: 0x555555

        # ---- Left half: one tile per switch (pages.md §6) ---------------
        # Fridge is reserved regardless of outcome (pages.md §6: "user is
        # still checking whether this vehicle wires the fridge to its own
        # controllable line ... render the tile in the invalid-value
        # style permanently rather than removing it, so the layout
        # doesn't shift later"). Alarmo is NOT included - pages.md §6
        # itself marks its entity_id as still TBD, and there's nothing
        # real to wire a PIN popup to yet.
        - button:
            id: btn_tile_12v
            align: TOP_LEFT
            x: 215 # bottom-left, per repo owner's requested order
            y: 527
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "POWER (12V)"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_12v
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_12v_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_12v"
                  value: !lambda 'return id(sw_12v_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_aux
            align: TOP_LEFT
            x: 215 # middle-left
            y: 357
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "AUX"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_aux
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_aux_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_aux"
                  value: !lambda 'return id(sw_aux_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_light
            align: TOP_LEFT
            x: 215 # top-left
            y: 187
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "LIGHT"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_light
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_light_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_light"
                  value: !lambda 'return id(sw_light_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_pump
            align: TOP_LEFT
            x: 455 # bottom-right
            y: 527
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "PUMP"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_pump
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_pump_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_pump"
                  value: !lambda 'return id(sw_pump_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_eisex
            align: TOP_LEFT
            x: 455 # top-right
            y: 187
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "ICEEX"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_eisex
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_eisex_mirror
              - script.execute:
                  id: send_link_command
                  key: "eisex_output"
                  value: !lambda 'return id(sw_eisex_mirror).state ? "1" : "0";'

        # Reserved slot - permanently invalid style, no on_click. See
        # header comment above.
        - button:
            id: btn_tile_fridge
            align: TOP_LEFT
            x: 455 # middle-right
            y: 357
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "FRIDGE"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_fridge
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555

        # ---- Alarmo - see this file's own header comment for why it's
        # placed here (below the clock) rather than in the 2x3 switch
        # grid above. Clock occupies x815-1135/y187-507 (see that
        # widget's own comment) - this sits in the strip below it, same
        # width as the clock (320), same height as one switch tile (150).
        #
        # y:527 (was 605), height still 150 (repo-owner, 2026-09-06:
        # "Alarmanlage unten bündig machen mit den untersten Schaltern
        # (POWER und PUMP). Höhe der Alarm Box gleich die der Switches") -
        # 12V/PUMP (the bottom switch row) span y:527-677; this tile now
        # shares that exact same y and height, so both bottoms land on
        # 677 together.
        - button:
            id: btn_tile_alarm
            align: TOP_LEFT
            x: 815
            y: 527
            width: 320
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "ALARMANLAGE"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_alarm
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - script.execute: show_alarm_popup

        # ---- Alarmo PIN popup (numeric keypad -> arm/disarm) ------------
        - button:
            id: obj_alarm_popup_backdrop
            align: TOP_LEFT
            x: 0
            y: 0
            width: ${screen_w}
            height: ${screen_h}
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            shadow_width: 0
            hidden: true
            on_click:
              - script.execute: close_alarm_popup

        - obj:
            id: obj_alarm_popup_panel
            align: CENTER
            # ---- 2026-09-06 relayout (repo-owner: "'schliessen' überlappt
            # 'arm home' und 'arm away'. Vorschlag: breiteres Popup und
            # die beiden 'arm xxx' auf die Seite verschieben - können dann
            # auch grösser werden") - exactly that: panel widened 460->700
            # and ARM HOME/ARM AWAY/DISARM moved off the row they used to
            # share under the keypad (where SCHLIESSEN, further down,
            # could crowd them) into their own column to the keypad's
            # right (see that column's own comment, below) - which also
            # means they're no longer competing with SCHLIESSEN for the
            # same vertical space at all, not just moved a few px apart.
            width: 700
            height: 580
            radius: 16
            bg_color: 0x1A1C1E
            bg_opa: COVER
            border_width: 2
            border_color: 0x4A9EFF
            hidden: true
            widgets:
              - label:
                  align: TOP_MID
                  y: 20
                  text: "ALARMANLAGE"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6
              - label:
                  id: lbl_alarm_pin_display
                  align: TOP_MID
                  y: 56
                  text: "----"
                  text_font: font_ui_28
                  text_color: 0xBDC1C6

              # ---- Keypad, 3 columns x 4 rows: 1-9 / CLR 0 (no OK key -
              # see the ARM HOME/ARM AWAY/DISARM column, further right,
              # instead). TOP_LEFT-anchored at x:40/170/300 (was TOP_MID,
              # x:-130/0/130) now that the panel is wider than the keypad
              # itself - centering the keypad alone would put it in the
              # middle of the WHOLE panel, overlapping the ARM/DISARM
              # column's own space to its right; left-anchoring keeps it
              # exactly where it was relative to the panel's own left
              # edge, still with a 40px margin. y offsets (110/198/286/
              # 374) and each key's own 110x80 size are unchanged.
              - button: &alarm_key
                  align: TOP_LEFT
                  x: 40
                  y: 110
                  width: 110
                  height: 80
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "1"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "1"}
              - button:
                  <<: *alarm_key
                  x: 170
                  widgets:
                    - label: {align: CENTER, text: "2", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "2"}
              - button:
                  <<: *alarm_key
                  x: 300
                  widgets:
                    - label: {align: CENTER, text: "3", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "3"}
              - button:
                  <<: *alarm_key
                  x: 40
                  y: 198
                  widgets:
                    - label: {align: CENTER, text: "4", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "4"}
              - button:
                  <<: *alarm_key
                  x: 170
                  y: 198
                  widgets:
                    - label: {align: CENTER, text: "5", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "5"}
              - button:
                  <<: *alarm_key
                  x: 300
                  y: 198
                  widgets:
                    - label: {align: CENTER, text: "6", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "6"}
              - button:
                  <<: *alarm_key
                  x: 40
                  y: 286
                  widgets:
                    - label: {align: CENTER, text: "7", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "7"}
              - button:
                  <<: *alarm_key
                  x: 170
                  y: 286
                  widgets:
                    - label: {align: CENTER, text: "8", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "8"}
              - button:
                  <<: *alarm_key
                  x: 300
                  y: 286
                  widgets:
                    - label: {align: CENTER, text: "9", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "9"}
              - button:
                  <<: *alarm_key
                  x: 40
                  y: 374
                  widgets:
                    - label: {align: CENTER, text: "CLR", text_font: font_ui_20, text_color: 0xF39C12}
                  on_click:
                    - script.execute: alarm_pin_clear
              - button:
                  <<: *alarm_key
                  x: 170
                  y: 374
                  widgets:
                    - label: {align: CENTER, text: "0", text_font: font_ui_24, text_color: 0xBDC1C6}
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "0"}
              # x:300,y:374 (bottom-right of the keypad) intentionally
              # empty - that's where the OK key used to be, replaced by
              # the ARM HOME/ARM AWAY/DISARM column (further right)
              # instead of a 12th keypad key.

              # ---- ARM HOME / ARM AWAY / DISARM - exactly the three
              # modes the repo owner actually uses ("ich nutze nur Armed
              # home, Armed away und Disarmed"), one fixed button/action
              # each rather than one generic "OK" (see
              # act_alarm_arm_home/_away/_disarm's own comment for why).
              # draw_alarm_popup_buttons shows only the pair that makes
              # sense for the CURRENT state - both ARM buttons hidden
              # while already armed, DISARM hidden while disarmed - so
              # only ARM HOME/ARM AWAY are ever visible together, never
              # alongside DISARM.
              #
              # Own column to the keypad's right (x:460-660, 40px margin
              # to the panel's own right edge - see this popup's header
              # comment), not a row underneath it any more: ARM HOME/ARM
              # AWAY stack top/bottom across the keypad's own y:110-454
              # span (344px total; 160px tall each + a 24px gap between
              # them, vs. the old 200x70 row) and DISARM (same column,
              # shown instead of the pair while armed) fills that whole
              # 344px span as one button - all three bigger than before,
              # per the repo-owner's own "können dann auch grösser
              # werden".
              - button:
                  id: btn_alarm_arm_home
                  align: TOP_LEFT
                  x: 460
                  y: 110
                  width: 200
                  height: 160
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "ARM HOME"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_alarm_arm_home
              - button:
                  id: btn_alarm_arm_away
                  align: TOP_LEFT
                  x: 460
                  y: 294
                  width: 200
                  height: 160
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "ARM AWAY"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_alarm_arm_away
              - button:
                  id: btn_alarm_disarm
                  align: TOP_LEFT
                  x: 460
                  y: 110
                  width: 200
                  height: 344
                  radius: 12
                  bg_color: 0x4F1414
                  border_width: 1
                  border_color: 0xE74C3C
                  hidden: true
                  widgets:
                    - label:
                        align: CENTER
                        text: "DISARM"
                        text_font: font_ui_24
                        text_color: 0xFFFFFF
                  on_click:
                    - script.execute: act_alarm_disarm

              - button:
                  id: btn_alarm_popup_close
                  align: BOTTOM_MID
                  y: -20
                  width: 200
                  height: 56
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "SCHLIESSEN"
                        text_font: font_ui_16
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: close_alarm_popup

