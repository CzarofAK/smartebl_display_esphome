# =============================================================================
#  smart_ebl_pages/page_home.yaml -- page: Home (Mainscreen)
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §6: SBB clock (right half) + 5 switch tiles in a 2x3
# grid (Fridge slot reserved, not wired yet - see that section's own
# table). The 5 switches here mirror smartebl's own relay groups over
# the RS232 link (docs/protocol.md groups 2/4), not Home Assistant -
# same reason page_electric's link-fed values don't need an api_ok guard
# either.
#
# ---- Alarmo (2026-09-06, repo-owner: "koennen wir noch irgendwo die
# Alarmanlage integrieren?") -------------------------------------------
# Exactly the design pages.md §6 already specified but never built: a
# home-page-only tile + PIN popup (numeric keypad) -> arm/disarm,
# deliberately NOT in the quick-switch popup or the status bar (a
# security action, own confirmation step - same reasoning as the
# Huebstuetzen EINFAHREN confirm on page_sensors_levelling.yaml). The
# 2x3 switch-tile grid was already full (pages.md §6's own diagram has
# no Alarmo slot in it) - placed instead below the clock, in the
# previously-empty x815-1135/y605-755 strip.
#
# Entity_id: alarm_control_panel.alarmo - NOT a blind guess like the
# Huebstuetzen placeholders on page_sensors_levelling.yaml: "Alarmo" is
# a specific HACS integration (not a generic term for "an alarm
# system"), and it exposes exactly one entity per instance, always
# named alarm_control_panel.alarmo by default - reused here on that
# strength, but still flag if this installation's instance was ever
# renamed away from the default.
# =============================================================================

text_sensor:
  - platform: homeassistant
    id: s_alarmo_state
    entity_id: alarm_control_panel.alarmo
    on_value:
      - script.execute: draw_alarm_tile

globals:
  # PIN entry buffer for the arm/disarm keypad popup below - cleared on
  # open, on CLR, and after every submit (success or failure) so a code
  # never lingers on screen or gets accidentally resubmitted.
  - id: g_alarm_pin
    type: std::string
    restore_value: false
    initial_value: '""'

switch:
  # Optimistic local mirrors of smartebl's switches - reflect the
  # tile's ON/OFF state only, no turn_on_action/turn_off_action.
  #
  # BUG FIXED (found on real hardware, see the commit this comment
  # landed in): these used to have turn_on_action/turn_off_action
  # calling send_link_command directly. ESPHome's switch component
  # unconditionally calls write_state() - which runs those actions -
  # in two situations this repo never wants to send a command for:
  #   1. At boot, to enact the (restored/default) initial state -
  #      this alone sent "everything OFF" to smartebl on every single
  #      display reboot, regardless of smartebl's actual state.
  #   2. Every time the link reader below reflects an incoming
  #      telemetry frame via turn_on()/turn_off() - since that ALSO
  #      unconditionally re-ran the action, every ~800ms telemetry
  #      cycle re-sent the same command back to smartebl, which would
  #      re-pulse the physical bistable relay coil over and over for
  #      as long as the link stayed up, not just on an actual change.
  # Fix: these switches now hold state only (publish_state() from the
  # reader, not turn_on()/turn_off()) and the tiles below call
  # send_link_command explicitly from on_click - the only place a
  # command is actually supposed to originate from.
  - platform: template
    id: sw_pump_mirror
    name: "Water Pump (via link)"
    icon: mdi:water-pump
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_light_mirror
    name: "Light Group (via link)"
    icon: mdi:lightbulb-group
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_12v_mirror
    name: "12V Group (via link)"
    icon: mdi:power-socket-eu
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_aux_mirror
    name: "AUX Group (via link)"
    icon: mdi:power
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_eisex_mirror
    name: "EisEx Heater (via link)"
    icon: mdi:heating-coil
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

script:
  # ---- Mainscreen (page_home) tiles -------------------------------------
  # design_rules.md §2's one-script-per-related-values pattern: all five
  # switch tiles are redrawn together rather than five separate lambdas
  # racing each other.
  - id: draw_home_tiles
    mode: restart
    then:
      - lambda: |-
          auto set_tile = [](lv_obj_t *lbl, bool on) {
            lv_label_set_text(lbl, on ? "ON" : "OFF");
            lv_obj_set_style_text_color(lbl,
                lv_color_hex(on ? 0x2ECC71 : 0xBDC1C6), 0);
          };
          set_tile(id(lbl_tile_12v), id(sw_12v_mirror).state);
          set_tile(id(lbl_tile_aux), id(sw_aux_mirror).state);
          set_tile(id(lbl_tile_light), id(sw_light_mirror).state);
          set_tile(id(lbl_tile_pump), id(sw_pump_mirror).state);
          set_tile(id(lbl_tile_eisex), id(sw_eisex_mirror).state);

  # ---- Alarmo tile - humanized state + color, same "one script redraws
  # everything this value drives" pattern as draw_home_tiles above.
  - id: draw_alarm_tile
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          if (!api_ok || !id(s_alarmo_state).has_state()) {
            lv_label_set_text(id(lbl_tile_alarm), "---");
            lv_obj_set_style_text_color(id(lbl_tile_alarm), lv_color_hex(0x555555), 0);
            return;
          }
          // Repo owner: "ich nutze nur Armed home, Armed away und
          // Disarmed" - those three get their own short tags; the
          // three Alarmo modes this installation doesn't use
          // (armed_night/armed_vacation/armed_custom_bypass) still get
          // a sane fallback rather than silently reading as "---".
          std::string s = id(s_alarmo_state).state;
          std::string text; uint32_t col;
          if (s == "disarmed") {
            text = "AUS"; col = 0x2ECC71;
          } else if (s == "triggered") {
            text = "ALARM"; col = 0xE74C3C;
          } else if (s == "pending" || s == "arming" || s == "disarming") {
            text = "..."; col = 0xF39C12;
          } else if (s == "armed_home") {
            text = "SCHARF H"; col = 0xE74C3C;
          } else if (s == "armed_away") {
            text = "SCHARF A"; col = 0xE74C3C;
          } else if (s.rfind("armed", 0) == 0) {
            text = "SCHARF"; col = 0xE74C3C;
          } else {
            text = "---"; col = 0x555555;
          }
          lv_label_set_text(id(lbl_tile_alarm), text.c_str());
          lv_obj_set_style_text_color(id(lbl_tile_alarm), lv_color_hex(col), 0);
      # Keeps the popup's ARM HOME/ARM AWAY/DISARM buttons correct even
      # if the state changes while the popup happens to already be
      # open - see draw_alarm_popup_buttons' own comment.
      - script.execute: draw_alarm_popup_buttons

  # ---- PIN popup (numeric keypad) - arm/disarm, see this file's own
  # header comment for why this lives here rather than in the
  # quick-switch popup or the status bar.
  - id: alarm_pin_add_digit
    parameters:
      digit: string
    then:
      - lambda: |-
          if (id(g_alarm_pin).size() < 8) {
            id(g_alarm_pin) += digit;
          }
          // Masked with 'X', not '*' - this file's shared glyph set
          // (smart-ebl-display.yaml's font: block) doesn't include '*',
          // same "tofu box" bug that block's own header comment already
          // fixed once for umlauts/arrows - reusing a glyph already in
          // that set avoids reintroducing it for one popup.
          std::string mask(id(g_alarm_pin).size(), 'X');
          lv_label_set_text(id(lbl_alarm_pin_display), mask.empty() ? "----" : mask.c_str());

  - id: alarm_pin_clear
    then:
      - lambda: |-
          id(g_alarm_pin).clear();
          lv_label_set_text(id(lbl_alarm_pin_display), "----");

  - id: show_alarm_popup
    then:
      - script.execute: alarm_pin_clear
      - script.execute: draw_alarm_popup_buttons
      - lvgl.widget.update: {id: obj_alarm_popup_backdrop, hidden: false}
      - lvgl.widget.update: {id: obj_alarm_popup_panel, hidden: false}

  - id: close_alarm_popup
    then:
      - script.execute: alarm_pin_clear
      - lvgl.widget.update: {id: obj_alarm_popup_backdrop, hidden: true}
      - lvgl.widget.update: {id: obj_alarm_popup_panel, hidden: true}

  # ---- Arm/disarm - THREE separate actions, not one generic "OK"
  # (repo-owner: "ich nutze nur Armed home, Armed away und Disarmed") -
  # a service call's own service: string isn't templatable in ESPHome
  # (same reason act_multiplus_set_mode/act_daynight_set_mode pick one
  # of several FIXED homeassistant.service: blocks via a button/option
  # rather than trying to template the service name itself), so each
  # mode gets its own button + its own fixed service call instead of
  # one action trying to infer which of three the tap meant.
  # draw_alarm_popup_buttons (below) shows only the buttons that make
  # sense for the CURRENT confirmed state - ARM HOME/ARM AWAY while
  # disarmed, DISARM while armed - so there's no way to tap the wrong
  # one for the state actually in effect.
  - id: act_alarm_arm_home
    then:
      - homeassistant.service:
          service: alarm_control_panel.alarm_arm_home
          data:
            entity_id: alarm_control_panel.alarmo
          data_template:
            code: "{{ code }}"
          variables:
            code: !lambda "return id(g_alarm_pin);"
      - script.execute: close_alarm_popup

  - id: act_alarm_arm_away
    then:
      - homeassistant.service:
          service: alarm_control_panel.alarm_arm_away
          data:
            entity_id: alarm_control_panel.alarmo
          data_template:
            code: "{{ code }}"
          variables:
            code: !lambda "return id(g_alarm_pin);"
      - script.execute: close_alarm_popup

  - id: act_alarm_disarm
    then:
      - homeassistant.service:
          service: alarm_control_panel.alarm_disarm
          data:
            entity_id: alarm_control_panel.alarmo
          data_template:
            code: "{{ code }}"
          variables:
            code: !lambda "return id(g_alarm_pin);"
      - script.execute: close_alarm_popup

  # ---- Popup button visibility - ARM HOME/ARM AWAY while disarmed
  # (or unknown), DISARM while any armed_* state. Called from
  # show_alarm_popup (so it's never stale when the popup opens) AND
  # from draw_alarm_tile (so it stays correct if the state changes
  # while the popup happens to be open already).
  - id: draw_alarm_popup_buttons
    then:
      - if:
          condition:
            lambda: |-
              #ifdef USE_API
              bool api_ok = api_is_connected();
              #else
              bool api_ok = true;
              #endif
              return api_ok && id(s_alarmo_state).has_state() &&
                  id(s_alarmo_state).state.rfind("armed", 0) == 0;
          then:
            - lvgl.widget.update: {id: btn_alarm_arm_home, hidden: true}
            - lvgl.widget.update: {id: btn_alarm_arm_away, hidden: true}
            - lvgl.widget.update: {id: btn_alarm_disarm, hidden: false}
          else:
            - lvgl.widget.update: {id: btn_alarm_arm_home, hidden: false}
            - lvgl.widget.update: {id: btn_alarm_arm_away, hidden: false}
            - lvgl.widget.update: {id: btn_alarm_disarm, hidden: true}

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_alarm_tile

lvgl:
  pages:
    # =========================================================================
    # Mainscreen (page_home) - pages.md §5/§6
    # =========================================================================
    - id: page_home
      # bg_color/bg_opa here, not just lvgl: bottom_layer: above - an
      # LVGL page has its own background that sits on top of
      # bottom_layer, and was NOT black by default on the real device
      # (reported by the repo owner) despite bottom_layer being black.
      # Every page below repeats this explicitly for the same reason.
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # ---- Right half: SBB clock --------------------------------------
        - sbb_clock:
            id: clock_face
            time_id: homeassistant_time
            # 450 -> 320 (2026-09-06, round 3, confirmed on real
            # hardware): even after corner_color (below) dropped this
            # canvas from ARGB8888 to plain RGB565 (810112 -> 405120
            # bytes), the boot log still showed it landing in PSRAM
            # (`alloc_canvas_buf()`'s own warning). The static linker
            # report this file's comments used to cite (~432KB free
            # internal RAM) is a compile-time bss/data budget, not the
            # ACTUAL free heap left over at runtime once Wi-Fi/esp_hosted/
            # LVGL's own (much larger) display buffer have all already
            # claimed their share by the time this widget's setup() runs
            # - that real number is smaller and wasn't knowable without
            # flashing real hardware. 320x320 (204800 bytes, exactly half
            # of the previous size) leaves enough headroom below whatever
            # that real ceiling turns out to be. No more "took a long
            # time" warnings for sbb_clock on the real device at this
            # size - see m5dial_clock_sbb's README for the full writeup.
            width: 320
            height: 320
            align: TOP_LEFT
            x: 815 # keeps the same center point as the old 450x450 at (750,200)
            y: 265
            # Round, not square (bug reported on real hardware): a
            # canvas is inherently rectangular, so without something
            # making the corners disappear it rendered as a plain filled
            # square. show_face draws the actual round dial; corner_color
            # (below) makes the square's own corners disappear into the
            # page's real background - together they're what makes it
            # read as a circle rather than a block.
            show_face: true
            # `corner_color`, not `transparent: true` (real bug fixed,
            # round 2 - see m5dial_clock_sbb's README "Fixed" section for
            # the full writeup): this page's background is always the
            # same fixed solid color, so true alpha transparency was
            # never actually needed for the square canvas's corners to
            # disappear into it - only matching that fixed color opaquely
            # was, which needs a plain RGB565 canvas instead of ARGB8888.
            corner_color: col_page_bg
            # Real SBB clock look (design_rules.md §6's documented
            # exception, m5dial_fram's clock page uses the same
            # colors): WHITE face, BLACK hands by day - background/
            # foreground here are the DAY baseline; set_night_mode()
            # (apply_daynight, below) swaps them at runtime for BLACK
            # face for BLACK, WHITE hands at night. Previously had
            # these backwards (white ink on a black square, no face) -
            # that's the other half of the original bug report.
            # corner_color above is DELIBERATELY not swapped by
            # night_mode - the page behind the clock stays the same
            # black regardless of day/night, so the corners have to
            # match that fixed color either way, not invert with the
            # face.
            background: col_clock_ink   # white face by day
            foreground: col_clock_bg    # black hands/ticks/text by day
            second_hand_color: col_clock_second
            # show_date: false (the default) - repo owner doesn't want
            # the date/day shown.
            #
            # render_interval left at the component's own 100ms default -
            # the whole point of the corner_color fix above is that this
            # canvas no longer has an unusual per-frame cost to work
            # around.

        # ---- Left half: one tile per switch (pages.md §6) ---------------
        # Fridge is reserved regardless of outcome (pages.md §6: "user is
        # still checking whether this vehicle wires the fridge to its own
        # controllable line ... render the tile in the invalid-value
        # style permanently rather than removing it, so the layout
        # doesn't shift later"). Alarmo is NOT included - pages.md §6
        # itself marks its entity_id as still TBD, and there's nothing
        # real to wire a PIN popup to yet.
        - button:
            id: btn_tile_12v
            align: TOP_LEFT
            x: 215 # bottom-left, per repo owner's requested order
            y: 527
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "POWER (12V)"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_12v
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_12v_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_12v"
                  value: !lambda 'return id(sw_12v_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_aux
            align: TOP_LEFT
            x: 215 # middle-left
            y: 357
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "AUX"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_aux
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_aux_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_aux"
                  value: !lambda 'return id(sw_aux_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_light
            align: TOP_LEFT
            x: 215 # top-left
            y: 187
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "LIGHT"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_light
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_light_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_light"
                  value: !lambda 'return id(sw_light_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_pump
            align: TOP_LEFT
            x: 455 # bottom-right
            y: 527
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "PUMP"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_pump
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_pump_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_pump"
                  value: !lambda 'return id(sw_pump_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_eisex
            align: TOP_LEFT
            x: 455 # top-right
            y: 187
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "ICEEX"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_eisex
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_eisex_mirror
              - script.execute:
                  id: send_link_command
                  key: "eisex_output"
                  value: !lambda 'return id(sw_eisex_mirror).state ? "1" : "0";'

        # Reserved slot - permanently invalid style, no on_click. See
        # header comment above.
        - button:
            id: btn_tile_fridge
            align: TOP_LEFT
            x: 455 # middle-right
            y: 357
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "FRIDGE"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_fridge
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555

        # ---- Alarmo - see this file's own header comment for why it's
        # placed here (below the clock) rather than in the 2x3 switch
        # grid above. Clock occupies x815-1135/y265-585 - this sits in
        # the previously-empty strip below it, same width as the clock,
        # centered the same way.
        - button:
            id: btn_tile_alarm
            align: TOP_LEFT
            x: 815
            y: 605
            width: 320
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "ALARMANLAGE"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_alarm
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - script.execute: show_alarm_popup

        # ---- Alarmo PIN popup (numeric keypad -> arm/disarm) ------------
        - button:
            id: obj_alarm_popup_backdrop
            align: TOP_LEFT
            x: 0
            y: 0
            width: ${screen_w}
            height: ${screen_h}
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            shadow_width: 0
            hidden: true
            on_click:
              - script.execute: close_alarm_popup

        - obj:
            id: obj_alarm_popup_panel
            align: CENTER
            width: 460
            height: 640
            radius: 16
            bg_color: 0x1A1C1E
            bg_opa: COVER
            border_width: 2
            border_color: 0x4A9EFF
            hidden: true
            widgets:
              - label:
                  align: TOP_MID
                  y: 20
                  text: "ALARMANLAGE"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6
              - label:
                  id: lbl_alarm_pin_display
                  align: TOP_MID
                  y: 56
                  text: "----"
                  text_font: font_ui_28
                  text_color: 0xBDC1C6

              # ---- Keypad, 3 columns x 4 rows: 1-9 / CLR 0 (no OK key -
              # see the ARM HOME/ARM AWAY/DISARM row below instead) -----
              - button: &alarm_key
                  align: TOP_MID
                  x: -130
                  y: 110
                  width: 110
                  height: 80
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "1"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: {id: alarm_pin_add_digit, digit: "1"}
              - button:
                  <<: *alarm_key
                  x: 0
                  widgets:
                    - label: {align: CENTER, text: "2", text_font: font_ui_24, text_color: 0xBDC1C6}
