# =============================================================================
#  smart_ebl_pages/page_sensors_flaps.yaml -- page: Sensors, sub-page 3 (Klappen)
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §5/§7: Sensors section's sub-page 3 (was sub-page 2 until
# Levelling moved ahead of both this page and page_sensors_windows.yaml,
# 2026-09-19 round 2 - see nav_show_sensors's own comment in the device
# file; only the nav ORDER changed, nothing in this file). Companion to
# page_sensors_windows.yaml (sub-page 2, Fenster/Türen) - see that file's
# own header for the full "why two pages instead of one" reasoning, the
# shared entity-naming convention, and the "last seen" caveat; both apply
# here unchanged, not repeated in full.
#
# 7 flap/hatch contacts, same entity shape as the windows page:
# binary_sensor.<name>_contact (device_class door/window ASSUMED) +
# sensor.<name>_battery (%) + sensor.<name>_voltage (V) +
# sensor.<name>_device_temperature (°C) + sensor.<name>_last_seen.
#
# Grid: 3 columns x 3 rows (9 cells, 7 used - trailing 2 cells in the
# last row simply not drawn, same precedent). Cells are TALLER than the
# windows page's (220px vs 168px) since there's more spare vertical room
# to give 7 items across 3 rows than 11 across 4 - same per-card content
# either way (cap+dot / state / battery+voltage+temp / last-seen), just
# more breathing room. Columns unchanged: 3x340px + 2x30px gaps = 1080px,
# centered in the 1150px content area -> 35px side margin -> x165/535/905.
# Rows: 3x220px + 2x20px gaps = 700px, centered in the 736px content
# height -> 18px top/bottom margin -> y82/322/562.
# =============================================================================

