script:
  # ---- draw_sensors_flaps (page_sensors_flaps) - identical shape to
  # page_sensors_windows.yaml's draw_sensors_windows (same set_contact()/
  # fmt_seen() logic, duplicated per-page rather than shared across a
  # packages: boundary - see design_rules.md §5's own anchor-scoping note,
  # same reasoning applies to a lambda-local helper as to a YAML anchor).
  - id: draw_sensors_flaps
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          uint32_t now = millis();

          auto fmt_seen = [&](uint32_t seen_ms) -> std::string {
            if (seen_ms == 0) return "--";
            uint32_t d = (now - seen_ms) / 1000;
            if (d < 60) return "vor <1 Min";
            uint32_t m = d / 60;
            if (m < 60) { char b[16]; snprintf(b, sizeof(b), "vor %u Min", m); return b; }
            uint32_t h = m / 60; m = m % 60;
            char b[24]; snprintf(b, sizeof(b), "vor %uh %um", h, m); return b;
          };

          auto set_contact = [&](lv_obj_t *dot, lv_obj_t *lbl_state, lv_obj_t *lbl_vals, lv_obj_t *lbl_seen,
                                  bool has_contact, bool open,
                                  bool has_batt, float batt,
                                  bool has_volt, float volt,
                                  bool has_temp, float temp,
                                  uint32_t seen_ms) {
            uint32_t col;
            if (!has_contact) {
              col = 0x555555;
              lv_label_set_text(lbl_state, "---");
            } else if (open) {
              col = 0xF39C12;
              lv_label_set_text(lbl_state, "OFFEN");
            } else {
              col = 0x2ECC71;
              lv_label_set_text(lbl_state, "GESCHLOSSEN");
            }
            lv_obj_set_style_text_color(lbl_state, lv_color_hex(col), 0);
            lv_obj_set_style_bg_color(dot, lv_color_hex(col), 0);

            char bbuf[8], vbuf[8], tbuf[8], vals[40];
            if (has_batt) snprintf(bbuf, sizeof(bbuf), "%.0f%%", batt); else snprintf(bbuf, sizeof(bbuf), "--%%");
            if (has_volt) snprintf(vbuf, sizeof(vbuf), "%.2fV", volt); else snprintf(vbuf, sizeof(vbuf), "--V");
            if (has_temp) snprintf(tbuf, sizeof(tbuf), "%.0f°C", temp); else snprintf(tbuf, sizeof(tbuf), "--°C");
            snprintf(vals, sizeof(vals), "%s / %s / %s", bbuf, vbuf, tbuf);
            lv_label_set_text(lbl_vals, vals);
            lv_obj_set_style_text_color(lbl_vals, lv_color_hex((has_batt || has_volt || has_temp) ? 0xBDC1C6 : 0x555555), 0);

            lv_label_set_text(lbl_seen, fmt_seen(seen_ms).c_str());
            lv_obj_set_style_text_color(lbl_seen, lv_color_hex(seen_ms == 0 ? 0x555555 : 0x707070), 0);
          };

          set_contact(id(dot_gasflaschenklappe), id(lbl_gasflaschenklappe_state), id(lbl_gasflaschenklappe_vals), id(lbl_gasflaschenklappe_seen),
              api_ok && id(s_gasflaschenklappe_contact).has_state(), id(s_gasflaschenklappe_contact).state,
              api_ok && id(s_gasflaschenklappe_battery).has_state(), id(s_gasflaschenklappe_battery).state,
              api_ok && id(s_gasflaschenklappe_voltage).has_state(), id(s_gasflaschenklappe_voltage).state,
              api_ok && id(s_gasflaschenklappe_device_temperature).has_state(), id(s_gasflaschenklappe_device_temperature).state,
              id(g_gasflaschenklappe_last_seen_ms));
          set_contact(id(dot_garagenklappe_hinten), id(lbl_garagenklappe_hinten_state), id(lbl_garagenklappe_hinten_vals), id(lbl_garagenklappe_hinten_seen),
              api_ok && id(s_garagenklappe_hinten_contact).has_state(), id(s_garagenklappe_hinten_contact).state,
              api_ok && id(s_garagenklappe_hinten_battery).has_state(), id(s_garagenklappe_hinten_battery).state,
              api_ok && id(s_garagenklappe_hinten_voltage).has_state(), id(s_garagenklappe_hinten_voltage).state,
              api_ok && id(s_garagenklappe_hinten_device_temperature).has_state(), id(s_garagenklappe_hinten_device_temperature).state,
              id(g_garagenklappe_hinten_last_seen_ms));
          set_contact(id(dot_garagenklappe_rechts), id(lbl_garagenklappe_rechts_state), id(lbl_garagenklappe_rechts_vals), id(lbl_garagenklappe_rechts_seen),
              api_ok && id(s_garagenklappe_rechts_contact).has_state(), id(s_garagenklappe_rechts_contact).state,
              api_ok && id(s_garagenklappe_rechts_battery).has_state(), id(s_garagenklappe_rechts_battery).state,
              api_ok && id(s_garagenklappe_rechts_voltage).has_state(), id(s_garagenklappe_rechts_voltage).state,
              api_ok && id(s_garagenklappe_rechts_device_temperature).has_state(), id(s_garagenklappe_rechts_device_temperature).state,
              id(g_garagenklappe_rechts_last_seen_ms));
          set_contact(id(dot_serviceklappe), id(lbl_serviceklappe_state), id(lbl_serviceklappe_vals), id(lbl_serviceklappe_seen),
              api_ok && id(s_serviceklappe_contact).has_state(), id(s_serviceklappe_contact).state,
              api_ok && id(s_serviceklappe_battery).has_state(), id(s_serviceklappe_battery).state,
              api_ok && id(s_serviceklappe_voltage).has_state(), id(s_serviceklappe_voltage).state,
              api_ok && id(s_serviceklappe_device_temperature).has_state(), id(s_serviceklappe_device_temperature).state,
              id(g_serviceklappe_last_seen_ms));
          set_contact(id(dot_schuhklappe), id(lbl_schuhklappe_state), id(lbl_schuhklappe_vals), id(lbl_schuhklappe_seen),
              api_ok && id(s_schuhklappe_contact).has_state(), id(s_schuhklappe_contact).state,
              api_ok && id(s_schuhklappe_battery).has_state(), id(s_schuhklappe_battery).state,
              api_ok && id(s_schuhklappe_voltage).has_state(), id(s_schuhklappe_voltage).state,
              api_ok && id(s_schuhklappe_device_temperature).has_state(), id(s_schuhklappe_device_temperature).state,
              id(g_schuhklappe_last_seen_ms));
          set_contact(id(dot_katzenkloklappe), id(lbl_katzenkloklappe_state), id(lbl_katzenkloklappe_vals), id(lbl_katzenkloklappe_seen),
              api_ok && id(s_katzenkloklappe_contact).has_state(), id(s_katzenkloklappe_contact).state,
              api_ok && id(s_katzenkloklappe_battery).has_state(), id(s_katzenkloklappe_battery).state,
              api_ok && id(s_katzenkloklappe_voltage).has_state(), id(s_katzenkloklappe_voltage).state,
              api_ok && id(s_katzenkloklappe_device_temperature).has_state(), id(s_katzenkloklappe_device_temperature).state,
              id(g_katzenkloklappe_last_seen_ms));
          set_contact(id(dot_wascheklappe), id(lbl_wascheklappe_state), id(lbl_wascheklappe_vals), id(lbl_wascheklappe_seen),
              api_ok && id(s_wascheklappe_contact).has_state(), id(s_wascheklappe_contact).state,
              api_ok && id(s_wascheklappe_battery).has_state(), id(s_wascheklappe_battery).state,
              api_ok && id(s_wascheklappe_voltage).has_state(), id(s_wascheklappe_voltage).state,
              api_ok && id(s_wascheklappe_device_temperature).has_state(), id(s_wascheklappe_device_temperature).state,
              id(g_wascheklappe_last_seen_ms));

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_sensors_flaps

