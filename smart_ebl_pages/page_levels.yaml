        # tank columns; now sits right under the status bar, above the
        # columns (which start at y:140), at a size that reads as a real
        # warning line rather than a small footnote.
        #
        # x:65 (repo-owner, 2026-09-06: "Warnmeldung horizontal auf der
        # rechten Anzeigefläche [Displaygrösse - Nav-Bereich] einmitten")
        # - this label's PARENT is the page itself, which is full-screen
        # (1280 wide) - the nav rail (0-130) is a top_layer overlay drawn
        # OVER it, not a sibling that shrinks this page's own content
        # box - so a plain TOP_MID centers on x:640 (the whole screen's
        # center), landing 65px left of where the visible content area
        # (x:130-1280, center x:705) actually centers. TOP_MID's own x
        # offset shifts the alignment point, so x:65 (=705-640) moves it
        # the exact difference between those two centers without having
        # to hand-place it as TOP_LEFT.
        - label:
            id: lbl_levels_status
            align: TOP_MID
            x: 65
            y: 76
            text: ""
            text_font: font_ui_28
            text_color: 0x555555

