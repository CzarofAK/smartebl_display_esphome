# =============================================================================
#  smart_ebl_pages/page_levels.yaml -- page: Levels
#  Smart EBL Display (ESP32-P4) - page package
# =============================================================================
# docs/pages.md §5's original 5-column catalog, exactly as specified:
# Fresh / Waste + Gas A / Gas I / Diesel, all five now Home Assistant-fed
# (smartebl's hardware has no dual-bottle gas or fuel-tank input of its
# own, so Gas/Diesel were always HA - same precedent as page_electric
# reusing m5dial_fram's real Victron entities).
#
# Fresh/Waste were originally smartebl's own tank1_level/tank2_level over
# the RS232 link - TEMPORARILY switched to Victron instead (HA
# `sensor.fresh_stand`/`sensor.waste_stand`), 2026-09-12, per explicit
# repo-owner request. The link-fed originals are commented out in the
# sensor: block below, not deleted - see that comment for how to revert.
# tank3_level is wired but not shown on this page (reserved, see the
# sensor: block's own comment).
# =============================================================================

sensor:
  # ---- FRESH / WASTE - TEMPORARY switch to Victron (HA), 2026-09-12 ----
  # Repo-owner request: pull Fresh/Waste from Victron instead of
  # smartebl's own link (`tank1_level`/`tank2_level`) - `sensor.fresh_stand`/
  # `sensor.waste_stand`, explicitly called out as a TEMPORARY fix, not a
  # decision to stop using the link's own tank sensing for good. Same HA
  # precedent this page already uses for Gas A/Gas I/Diesel (below) -
  # `homeassistant` platform, `on_value` -> `draw_levels`, `api_ok`-gated
  # in that script rather than the link's own `connected` check.
  #
  # s_tank1_level/s_tank2_level (the link-fed originals) are commented
  # out, NOT deleted, exactly per that request - reverting is: uncomment
  # these two, uncomment their two `else if` cases in the link reader
  # (smart-ebl-display.yaml's own `interval:` lambda, right next to
  # `tank3_level`'s), switch draw_levels' Fresh/Waste blocks back from
  # `s_fresh_stand`/`s_waste_stand` + `fresh_ok`/`waste_ok` to
  # `s_tank1_level`/`s_tank2_level` + the link's own `connected` check
  # (see that script's own git history for the exact prior shape).
  - platform: homeassistant
    id: s_fresh_stand
    entity_id: sensor.fresh_stand
    on_value:
      - script.execute: draw_levels

  - platform: homeassistant
    id: s_waste_stand
    entity_id: sensor.waste_stand
    on_value:
      - script.execute: draw_levels

  # - platform: template
  #   id: s_tank1_level
  #   name: "Freshwater Level (via link)"
  #   unit_of_measurement: "%"
  #   accuracy_decimals: 0
  #   on_value:
  #     - script.execute: draw_levels
  #
  # - platform: template
  #   id: s_tank2_level
  #   name: "Greywater Level (via link)"
  #   unit_of_measurement: "%"
  #   accuracy_decimals: 0
  #   on_value:
  #     - script.execute: draw_levels

  # tank1/tank2 were already wired here before page_levels existed
  # (README's earlier "reserved for that future page" note); tank3_level
  # is likewise real (smartebl's own smart-ebl.yaml already broadcasts
  # it, group 2's `T2;tank1_level=..;tank2_level=..;tank3_level=..;`) but
  # WHICH physical tank it is remains unconfirmed - smartebl's CLAUDE.md
  # documents exactly 3 generic tank-sensor inputs, compatible with any
  # of fresh/grey/LPG per that hardware's own datasheet, with no fixed
  # assignment. NOT shown on page_levels (repo-owner: keep that page's
  # original 5-column Fresh/Waste/Gas A/Gas I/Diesel catalog as
  # specified) - kept wired, reserved, in case a use for it turns up.
  - platform: template
    id: s_tank3_level
    name: "Tank 3 Level (via link)"
    unit_of_measurement: "%"
    accuracy_decimals: 0

  # ---- Levels page (page_levels) - Gas A (outside bottle, "in use")/
  # Gas I (inside bottle, "reserve") + Diesel (repo-owner-confirmed real
  # entities, not the link - smartebl's hardware has only 3 generic
  # tank-sensor inputs (CLAUDE.md), already spoken for by tank1/tank2/
  # tank3 above, no dual-bottle gas sensing or fuel-tank input of its
  # own). Gas A/Gas I are the same real HA entities m5dial_fram/
  # page_gas.yaml already reads for these two physical bottles (this
  # vehicle's actual gas monitoring is external to smartebl) - same
  # precedent as page_electric reusing m5dial_fram's real Victron
  # entities; "A"/"I" = außen (outside)/innen (inside), confirmed by the
  # repo owner. Diesel is `sensor.nw19939_fuel_level` (repo-owner-
  # supplied, an OBD/vehicle-telematics entity by the naming) -
  # ASSUMED already a 0-100% reading like the other four levels here;
  # flag if that's wrong (a raw liter value, say) so the bar/thresholds
  # can be fixed to match.
  - platform: homeassistant
    id: s_gas_a
    entity_id: sensor.gas_1_stand
    on_value:
      - script.execute: draw_levels

  - platform: homeassistant
    id: s_gas_i
    entity_id: sensor.gas_2_stand
    on_value:
      - script.execute: draw_levels

  - platform: homeassistant
    id: s_diesel_level
    entity_id: sensor.nw19939_fuel_level
    on_value:
      - script.execute: draw_levels

script:
  # ---- Levels (page_levels) - pages.md §5's original "Levels" row:
  # Fresh (HA `sensor.fresh_stand`) / Waste (HA `sensor.waste_stand`) -
  # TEMPORARY Victron swap, 2026-09-12, was `tank1_level`/`tank2_level`
  # over the link (see the sensor: block's own comment) / Gas A, außen/
  # "in use" (HA `sensor.gas_1_stand`) / Gas I, innen/"reserve" (HA
  # `sensor.gas_2_stand`) / Diesel (HA `sensor.nw19939_fuel_level`,
  # repo-owner-supplied) - see the sensor: block's own comment (above,
  # where s_fresh_stand/s_waste_stand/s_gas_a/s_gas_i/s_diesel_level are
  # declared) for the entity-level detail.
  - id: poll_levels
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.fresh_stand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.waste_stand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.gas_1_stand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.gas_2_stand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.nw19939_fuel_level

  - id: draw_levels
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          char buf[32];

          // ---- FRISCH (Victron, HA `sensor.fresh_stand`) - TEMPORARY
          // source swap, 2026-09-12 (see the sensor: block's own comment
          // above) - was tank1_level over the link, gated on the link's
          // own `connected`; now HA-fed like Gas A/Gas I/Diesel below, so
          // gated on `api_ok`/`has_state()` the same way those are, not
          // on link status any more. Same 10%/25% critical/warning
          // thresholds as m5dial_fram/page_water.yaml's fresh ring
          // either way (design_rules.md §2: must not disagree with the
          // M5Dial) - only the "normal" color is repo-owner's own call
          // now, see this column's own "normal" comment below.
          bool fresh_ok = api_ok && id(s_fresh_stand).has_state();
          float fresh = fresh_ok ? id(s_fresh_stand).state : 0.0f;
          // Normal-state color unified to blue (0x4A9EFF) across all
          // five columns, 2026-09-12, repo-owner request ("alle gleich
          // blau, nur nach Zustand ändern") - this column already used
          // it, only WASTE/DIESEL/GAS I actually changed (see their own
          // comments below). Critical (red)/warning (orange)/invalid
          // (grey) stay exactly as before, on every column - only the
          // "nothing wrong" bucket's color is what this request unifies.
          uint32_t fresh_col = !fresh_ok ? 0x555555 :
              (fresh < 10.0f ? 0xE74C3C : (fresh < 25.0f ? 0xF39C12 : 0x4A9EFF));
          lv_bar_set_value(id(bar_levels_fresh), fresh_ok ? (int) fresh : 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_levels_fresh), lv_color_hex(fresh_col), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_levels_fresh_cap), lv_color_hex(fresh_col), 0);
          lv_obj_set_style_text_color(id(lbl_levels_fresh_pct), lv_color_hex(fresh_ok ? 0xFFFFFF : 0x555555), 0);
          if (!fresh_ok) {
            lv_label_set_text(id(lbl_levels_fresh_pct), "---%");
            lv_label_set_text(id(lbl_levels_fresh_l), "--- L");
          } else {
            snprintf(buf, sizeof(buf), "%.0f%%", fresh);
            lv_label_set_text(id(lbl_levels_fresh_pct), buf);
            // 120 L - repo-owner-supplied capacity, 2026-09-12 (was
            // 180 L, m5dial_fram/page_water.yaml's own constant for
            // its link-fed tank1 reading of what may not even be the
            // same physical tank now that FRISCH reads Victron's own
            // sensor.fresh_stand instead - flag to the repo owner if
            // page_water.yaml's own 180 L should change too, or if
            // these are genuinely two different tanks).
            snprintf(buf, sizeof(buf), "%.0f L", fresh * 1.20f);
            lv_label_set_text(id(lbl_levels_fresh_l), buf);
          }

          // ---- WASTE (Victron, HA `sensor.waste_stand`) - same
          // TEMPORARY source swap as FRISCH above, same >=80%/>=95%
          // critical/warning thresholds as m5dial_fram/page_water.yaml's
          // grey ring.
          bool waste_ok = api_ok && id(s_waste_stand).has_state();
          float waste = waste_ok ? id(s_waste_stand).state : 0.0f;
          // Normal-state color: was 0x9AA0A6 (grey-blue), now 0x4A9EFF -
          // see FRISCH's own "normal-state color unified" comment above.
          uint32_t waste_col = !waste_ok ? 0x555555 :
              (waste >= 95.0f ? 0xE74C3C : (waste >= 80.0f ? 0xF39C12 : 0x4A9EFF));
          lv_bar_set_value(id(bar_levels_waste), waste_ok ? (int) waste : 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_levels_waste), lv_color_hex(waste_col), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_levels_waste_cap), lv_color_hex(waste_col), 0);
          lv_obj_set_style_text_color(id(lbl_levels_waste_pct), lv_color_hex(waste_ok ? 0xFFFFFF : 0x555555), 0);
          if (!waste_ok) {
            lv_label_set_text(id(lbl_levels_waste_pct), "---%");
            lv_label_set_text(id(lbl_levels_waste_l), "--- L");
          } else {
            snprintf(buf, sizeof(buf), "%.0f%%", waste);
            lv_label_set_text(id(lbl_levels_waste_pct), buf);
            // 80 L - repo-owner-supplied capacity, 2026-09-12 (was 90 L -
            // same possibly-different-physical-tank caveat as FRISCH's
            // own capacity comment above applies here too).
            snprintf(buf, sizeof(buf), "%.0f L", waste * 0.80f);
            lv_label_set_text(id(lbl_levels_waste_l), buf);
          }

          // ---- DIESEL (HA, sensor.nw19939_fuel_level) - ASSUMED
          // already a 0-100% reading like the other four (see sensor:
          // block's own comment - flag if that's wrong). Thresholds are
          // a generic low-fuel-warning guess (10%/25%, same shape as
          // Fresh's), not a value the repo owner gave - easy to retune
          // once confirmed against how this vehicle's own gauge reads.
          bool diesel_ok = api_ok && id(s_diesel_level).has_state();
          float diesel = diesel_ok ? id(s_diesel_level).state : 0.0f;
          // Normal-state color: was 0xBDC1C6 (light grey), now 0x4A9EFF -
          // see FRISCH's own "normal-state color unified" comment above.
          uint32_t diesel_col = !diesel_ok ? 0x555555 :
              (diesel < 10.0f ? 0xE74C3C : (diesel < 25.0f ? 0xF39C12 : 0x4A9EFF));
          lv_bar_set_value(id(bar_levels_diesel), diesel_ok ? (int) diesel : 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_levels_diesel), lv_color_hex(diesel_col), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_levels_diesel_cap), lv_color_hex(diesel_col), 0);
          lv_obj_set_style_text_color(id(lbl_levels_diesel_pct), lv_color_hex(diesel_ok ? 0xFFFFFF : 0x555555), 0);
          if (!diesel_ok) {
            lv_label_set_text(id(lbl_levels_diesel_pct), "---%");
            lv_label_set_text(id(lbl_levels_diesel_l), "--- L");
          } else {
            snprintf(buf, sizeof(buf), "%.0f%%", diesel);
            lv_label_set_text(id(lbl_levels_diesel_pct), buf);
            // 90 L - repo-owner-confirmed capacity for this tank,
            // unchanged by the 2026-09-12 Fresh/Waste capacity update
            // above (120L/80L) - same "%-of-capacity" shape either way.
            snprintf(buf, sizeof(buf), "%.0f L", diesel * 0.90f);
            lv_label_set_text(id(lbl_levels_diesel_l), buf);
          }

          // ---- GAS A / GAS I (HA, sensor.gas_1_stand/gas_2_stand) -
          // same 10%/25% thresholds as m5dial_fram/page_gas.yaml.
          // Normal-state color unified to blue for both (Gas I was
          // 0x9AA0A6 grey - see FRISCH's own comment above) - the
          // "in use"/"reserve" accent distinction that grey used to
          // carry is gone; both bottles now read identically when fine,
          // same as every other column, only the CAP label text ("GAS
          // A"/"GAS I") still tells them apart.
          bool gas_a_ok = api_ok && id(s_gas_a).has_state();
          bool gas_i_ok = api_ok && id(s_gas_i).has_state();
          float gas_a = gas_a_ok ? id(s_gas_a).state : 0.0f;
          float gas_i = gas_i_ok ? id(s_gas_i).state : 0.0f;
          uint32_t gas_a_col = !gas_a_ok ? 0x555555 :
              (gas_a < 10.0f ? 0xE74C3C : (gas_a < 25.0f ? 0xF39C12 : 0x4A9EFF));
          uint32_t gas_i_col = !gas_i_ok ? 0x555555 :
              (gas_i < 10.0f ? 0xE74C3C : (gas_i < 25.0f ? 0xF39C12 : 0x4A9EFF));
          lv_bar_set_value(id(bar_levels_gas_a), gas_a_ok ? (int) gas_a : 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_levels_gas_a), lv_color_hex(gas_a_col), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_levels_gas_a_cap), lv_color_hex(gas_a_col), 0);
          lv_obj_set_style_text_color(id(lbl_levels_gas_a_pct), lv_color_hex(gas_a_ok ? 0xFFFFFF : 0x555555), 0);
          lv_bar_set_value(id(bar_levels_gas_i), gas_i_ok ? (int) gas_i : 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_levels_gas_i), lv_color_hex(gas_i_col), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_levels_gas_i_cap), lv_color_hex(gas_i_col), 0);
          lv_obj_set_style_text_color(id(lbl_levels_gas_i_pct), lv_color_hex(gas_i_ok ? 0xFFFFFF : 0x555555), 0);
          if (!gas_a_ok) {
            lv_label_set_text(id(lbl_levels_gas_a_pct), "---%");
            lv_label_set_text(id(lbl_levels_gas_a_kg), "--- kg");
          } else {
            snprintf(buf, sizeof(buf), "%.0f%%", gas_a);
            lv_label_set_text(id(lbl_levels_gas_a_pct), buf);
            // 10.5 kg net bottle - same vehicle-fixed constant
            // m5dial_fram/page_gas.yaml uses for the same physical bottle.
            snprintf(buf, sizeof(buf), "%.1f kg", gas_a * 0.105f);
            lv_label_set_text(id(lbl_levels_gas_a_kg), buf);
          }
          if (!gas_i_ok) {
            lv_label_set_text(id(lbl_levels_gas_i_pct), "---%");
            lv_label_set_text(id(lbl_levels_gas_i_kg), "--- kg");
          } else {
            snprintf(buf, sizeof(buf), "%.0f%%", gas_i);
            lv_label_set_text(id(lbl_levels_gas_i_pct), buf);
            snprintf(buf, sizeof(buf), "%.1f kg", gas_i * 0.105f);
            lv_label_set_text(id(lbl_levels_gas_i_kg), buf);
          }

          // ---- Combined status line - page-local precedence only
          // (pages.md §7's cross-category alarm ranking across the WHOLE
          // display is still an open item, not solved here): damage
          // before inconvenience, within-category thresholds straight
          // from m5dial_fram/page_water.yaml + page_gas.yaml, same
          // wording those pages use. Diesel slotted in with fuel
          // (running dry) treated as an inconvenience, same tier as
          // fresh water, not a damage-tier item.
          //
          // "KEINE VERBINDUNG" (no *link* connection) renamed to
          // "KEINE DATEN" (no data) - with Fresh/Waste's TEMPORARY move
          // to HA (see the sensor: block's own comment), this whole page
          // is HA-fed now, so a wording that specifically named the
          // RS232 link stopped matching what the fallback actually means
          // here (every source on this page missing at once).
          std::string status;
          uint32_t status_col = 0x555555;
          if (!fresh_ok && !waste_ok && !(gas_a_ok && gas_i_ok) && !diesel_ok) {
            status = "KEINE DATEN";
          } else if (waste_ok && waste >= 95.0f) {
            status = "ABWASSER VOLL"; status_col = 0xE74C3C;
          } else if (fresh_ok && fresh < 10.0f) {
            status = "FRISCHWASSER LEER"; status_col = 0xE74C3C;
          } else if (gas_a_ok && gas_i_ok && gas_a < 10.0f && gas_i < 10.0f) {
            status = "GAS LEER"; status_col = 0xE74C3C;
          } else if (diesel_ok && diesel < 10.0f) {
            status = "DIESEL LEER"; status_col = 0xE74C3C;
          } else if (waste_ok && waste >= 80.0f) {
            status = "ABWASSER VOLL"; status_col = 0xF39C12;
          } else if (fresh_ok && fresh < 25.0f) {
            status = "FRISCHWASSER KNAPP"; status_col = 0xF39C12;
          } else if (gas_a_ok && gas_i_ok && gas_a < 25.0f && gas_i < 25.0f) {
            status = "GAS KNAPP"; status_col = 0xF39C12;
          } else if (diesel_ok && diesel < 25.0f) {
            status = "DIESEL KNAPP"; status_col = 0xF39C12;
          } else if (gas_a_ok && gas_a < 10.0f) {
            status = "GAS A LEER"; status_col = 0x707070;
          } else if (gas_i_ok && gas_i < 10.0f) {
            status = "GAS I LEER"; status_col = 0x707070;
          }
          lv_label_set_text(id(lbl_levels_status), status.c_str());
          lv_obj_set_style_text_color(id(lbl_levels_status), lv_color_hex(status_col), 0);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_levels

lvgl:
  pages:
    # =========================================================================
    # Levels (page_levels) - pages.md §5's original catalog, as specified:
    # Fresh/Waste (link) + Gas A/Gas I/Diesel (HA) - see poll_levels'/
    # draw_levels' own header comment (above, in the script: block) and
    # the sensor: block's own comment for exactly which entity backs
    # each column.
    #
    # 5 columns, each its own local coordinate container (same trick as
    # page_climate's obj_truma_room/obj_truma_water) at content-area-
    # centered x's: 5x160px columns + 4x27px gaps = 908px, centered in
    # the 1150px content area (nav rail ends x130, right edge x1280) ->
    # 121px side margin -> columns start x251/438/625/812/999. A
    # vertical LVGL `bar` (width < height) fills bottom-up by construction
    # (LVGL's own bar widget picks its fill axis from its own aspect
    # ratio) - the "Victron-style vertical tank column" from
    # smartebl_display/docs/design.md's original mockup, without hand-
    # rolling segmented-bar geometry LVGL already gives for free.
    - id: page_levels
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - script.execute: poll_levels
      widgets:
        # ---- FRISCH (tank1, link) ------------------------------------
        # scrollbar_mode: OFF on every column obj below (repo-owner,
        # 2026-09-06: "jetzt sind das 'scroll' balken bei jedem tank...
        # wieso das? geht das nicht ohne?") - an LVGL obj is scrollable
        # by default and shows a scrollbar the instant its content is
        # even 1px taller than its own box; these columns' own labels+bar
        # (32+340+~30+~30=~432 of this 460-tall box) sit right at that
        # edge, and the visual overflow is exactly why the indicator kept
        # appearing. It doesn't need to scroll at all - this page's
        # tank values are fixed layout, not a list - so the indicator is
        # just switched off outright rather than trimmed to fit exactly.
        - obj:
            id: obj_levels_fresh
            align: TOP_LEFT
            x: 251
            y: 140
            width: 160
            height: 600
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: lbl_levels_fresh_cap
                  align: TOP_MID
                  y: 0
                  text: "FRISCH"
                  text_font: font_ui_16
                  text_color: 0x555555
              # Width 64->130 and border dropped (repo-owner: "vertikal
              # Trennstriche weg und balken viel breiter") - each bar's
              # own 1px border used to read as a thin vertical dividing
              # line between the columns; removing it and filling most
              # of the 160px column width with the bar itself (130,
              # 15px margin each side) makes each tank read as one
              # solid block instead of a narrow bar boxed in lines.
              #
              # Height 340->480, column 460->600 (repo-owner, same
              # 2026-09-06 report as this column's own scrollbar-removal
              # comment above: "die bars dürften dann auch höher
              # werden") - the column used to end at y:600 on an
              # 800-tall screen with nothing below it, i.e. ~140px of
              # genuinely spare vertical room once the scrollbar wasn't
              # eating into the perceived space any more; that spare
              # room goes entirely into the bar (pct/L labels below it
              # keep their own original relative gap, just shifted down
              # by the same 140px).
              - bar:
                  id: bar_levels_fresh
                  align: TOP_MID
                  y: 32
                  width: 130
                  height: 480
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x1A1C1E
                  bg_opa: COVER
                  border_width: 0
                  radius: 10
                  indicator:
                    bg_color: 0x555555
                    radius: 9
              - label:
                  id: lbl_levels_fresh_pct
                  align: TOP_MID
                  y: 524
                  text: "---%"
                  text_font: font_ui_24
                  text_color: 0x555555
              - label:
                  id: lbl_levels_fresh_l
                  align: TOP_MID
                  y: 560
                  text: "--- L"
                  text_font: font_ui_16
                  text_color: 0xBDC1C6

        # ---- WASTE (tank2, link) ----------------------------------------
        # scrollbar_mode/height/bar-height/label-y - same fixes and same
        # reasoning as FRISCH, above.
        - obj:
            id: obj_levels_waste
            align: TOP_LEFT
            x: 438
            y: 140
            width: 160
            height: 600
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: lbl_levels_waste_cap
                  align: TOP_MID
                  y: 0
                  text: "WASTE"
                  text_font: font_ui_16
                  text_color: 0x555555
              - bar:
                  id: bar_levels_waste
                  align: TOP_MID
                  y: 32
                  width: 130
