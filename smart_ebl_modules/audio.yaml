# =============================================================================
# Audio - onboard ES8311 codec + NS4150B class-D amp (FRA-98, 2026-10-01)
# =============================================================================
# Not a page - a hardware module, hence its own folder next to
# smart_ebl_pages/. Pulled in via `packages:` in smart-ebl-display.yaml.
#
# Purpose (YouTrack FRA-98): local pre-alarm tone for Alarmo's `pending`
# state, played from WAVs embedded in the firmware so it does not depend
# on HA streaming audio. Step 1 = audio chain only; playback is
# triggered by the automatic pre-alarm overlay/loop in step 2.
#
# Wiring - read from Waveshare's own schematic
# (ESP32-P4-WIFI6-POE-ETH-Schematic.pdf, page 1, blocks "Codec" and
# "PA&SPEAKER&MIC"), NOT from a search summary - see docs/hardware.md:
#   ES8311 (U10) control I2C : ESP_I2C_SDA/SCL = GPIO7/GPIO8, i.e. the
#                              SAME bus as touch (`bus_touch`)
#   ES8311 address           : CE pin pulled to AGND via R53 10k -> 0x18
#   I2S MCLK / SCLK / LRCK   : GPIO13 / GPIO12 / GPIO10
#   I2S DSDIN (P4 -> codec)  : GPIO9   (speaker path)
#   I2S ASDOUT (codec -> P4) : GPIO11  (mic path, unused here)
#   NS4150B (U8) CTRL        : GPIO53 via R71 0R, R74 10k pull-DOWN ->
#                              amp is OFF unless the P4 drives it high
#   Speaker                  : J8 (PA_OUTL+/-), mono
#
# Amp handling: GPIO53 is only driven high while the media player is
# announcing, then dropped again on idle - avoids idle hiss/pop and keeps
# quiescent current down on the 12V house battery.
# =============================================================================

i2s_audio:
  - id: i2s_bus_audio
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

audio_dac:
  - platform: es8311
    id: dac_es8311
    i2c_id: bus_touch
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: spk_onboard
    i2s_audio_id: i2s_bus_audio
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: dac_es8311
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left  # ES8311 is a mono DAC reading the left slot - same as the esphome.io es8311 example
    buffer_duration: 100ms

switch:
  - platform: gpio
    id: sw_audio_amp
    name: "Audio Verstaerker"
    pin: GPIO53
    restore_mode: ALWAYS_OFF
    internal: true

media_player:
  - platform: speaker
    id: mp_onboard
    name: "Lautsprecher"
    announcement_pipeline:
      speaker: spk_onboard
      format: WAV
      sample_rate: 16000
      num_channels: 1
    # Pre-alarm must be audible regardless of whatever volume someone
    # last left the player at - step 2 sets the volume explicitly before
    # playing; these are only the bounds.
    volume_initial: 0.8
    volume_min: 0.3
    volume_max: 1.0
    files:
      - id: snd_voralarm
        file: sounds/voralarm.wav
      - id: snd_voralarm_final
        file: sounds/voralarm_final.wav
    on_announcement:
      - switch.turn_on: sw_audio_amp
    on_idle:
      - switch.turn_off: sw_audio_amp
