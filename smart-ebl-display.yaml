# =============================================================================
# Smart EBL Display (ESP32-P4) - ESPHome Configuration
# =============================================================================
# Waveshare ESP32-P4-WIFI6-POE-ETH + 10.1-DSI-TOUCH-A, replacing the
# Nextion display generation (github.com/CzarofAK/smartebl_display) with a
# larger DSI touchscreen, controlled over the same RS232 wiring the
# Nextion used - see docs/protocol.md for the link and docs/hardware.md
# for every pin used below, INCLUDING which ones are still placeholders.
#
# STATUS: first release - three real pages (Mainscreen/Home, Electric/
# Victron-style overview, Climate), per docs/pages.md's page catalog.
# See README.md "Status & Roadmap" before assuming this covers
# everything smartebl exposes - most of the catalog (Levels, Boiler,
# Fans, Light/Features, Sensors+Levelling) is still follow-up work, and
# the Electric page only has its overview sub-page, not the fuse grid.
# =============================================================================

substitutions:
  name: smart-ebl-display
  friendly_name: Smart EBL Display

  # ---- RS232 link to the Smart EBL main unit (docs/protocol.md) -------
  # Moved off GPIO37/GPIO38 (see docs/hardware.md's "Not confirmed"
  # section for why - real hardware showed those interleaved with the
  # console UART). Per the repo owner's own 2x20 header photo, GPIO37/38
  # are the board's silkscreen-labelled TXD/RXD pair (purple "UART" in
  # that photo's legend) - i.e. exactly the console/UART0 pins, not a
  # free pair at all, confirming the earlier suspicion outright.
  #
  # GPIO21/GPIO20 chosen instead: plain, unlabelled GPIOs (green in that
  # same photo) on the header, adjacent to each other for easy wiring,
  # and not claimed by anything else in this file (touch I2C is 7/8,
  # esp32_hosted SDIO is 14-19/54, Ethernet RMII is 28-31/34/35/49-52 -
  # none of those are even on this header per the photo, so they were
  # never really a collision risk; GPIO37/38 were the only two pins on
  # the header this repo had gotten wrong). Still not confirmed against
  # a schematic for anything OTHER than "not the console UART" - if
  # ESPHome logs a new strapping-pin warning for either on the next
  # flash, treat that the same way GPIO37/38's warning turned out to be
  # meaningful, not cosmetic.
  link_tx_pin: GPIO21
  link_rx_pin: GPIO20

  # ---- Rectangular layout grid (design_rules.md §4's open item) -------
  # `lvgl: rotation: 90` below turns the panel's native 800x1280
  # (portrait) into a 1280x800 landscape canvas - every page's widgets
  # are placed against those dimensions. First pass, established by
  # this release's three pages (page_home, page_electric, page_climate)
  # - refine once seen on the real device, per design_rules.md's own
  # "decided by looking at the actual device, not guessed in advance"
  # reasoning. Kept as substitutions (not just comments) so a future
  # page copies the same numbers instead of inventing a second,
  # possibly-drifting grid.
  screen_w: "1280"  # landscape canvas width after rotation: 90
  screen_h: "800"   # landscape canvas height after rotation: 90
  bar_h: "64"       # top status bar - full width, every page
  nav_w: "130"      # left nav rail - full remaining height, every page
  content_x: "130"  # = nav_w - x where every page's own content starts
  content_y: "64"   # = bar_h - y where every page's own content starts

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # design_rules.md §2's "one script per page, also called from
    # on_boot" pattern: draw whatever's in the link/HA buffers right
    # now (all "---"/"NO LINK" until the first frame/API push arrives)
    # instead of leaving LVGL's default placeholder text up until then.
    # Safe to call for a page that isn't the one currently shown - LVGL
    # builds every page's widgets at setup regardless of visibility.
    priority: -100
    then:
      - script.execute: draw_status_bar
      - script.execute: draw_nav
      - script.execute: draw_electric
      - script.execute: draw_climate
      - script.execute: draw_boiler
      # apply_daynight itself updates lbl_daynight_toggle's text now (see
      # that script) - draw_daynight_popup separately primes the popup's
      # own widgets (mode highlight, slider, % label) so they're never
      # stale the first time it's opened.
      - script.execute: apply_daynight
      - script.execute: draw_daynight_popup
      - globals.set: {id: g_last_touch_ms, value: !lambda "return millis();"}

esp32:
  variant: esp32p4
  # ESPHome's own board manifest for this exact board
  # (definitions/boards/waveshare_esp32_p4_wifi6_poe_eth) sets this -
  # current-production units apparently still ship engineering-sample
  # P4 silicon, which needs this flag for a few ESP-IDF workarounds.
  # Flip to false only once you've confirmed your specific unit has
  # production (non-ES) silicon.
  engineering_sample: true
  # 32MB NOR flash per Waveshare's listing (docs/hardware.md). Lower to
  # 16MB if your board revision differs or ESPHome rejects 32MB here.
  flash_size: 32MB
  framework:
    type: esp-idf
    version: recommended
    # ---- ACTUAL FIX for the boot crash chased through several prior
    # rounds of this file's own comments (psram: speed, LV_USE_ARC,
    # sdkconfig/partition diffing - none of it was the cause). Real root
    # cause, confirmed on real hardware: the ESP32-C6 co-processor's own
    # esp_hosted firmware (managed by Home Assistant's C6-firmware
    # update entity, below) can end up on a NEWER esp_hosted release
    # than the HOST-side esp_hosted library this file's esp32_hosted:
    # block compiles in - and per the component's own maintainer
    # (esphome Discord, confirmed against a real P4+C6 board): "if you
    # updated to 2.12.8 on the C6 its a bad idea to run an older version
    # on the P4 - you can run an older version on the C6 but they dont
    # guarantee the other way around". An unpinned host library (this
    # block, before this fix) just takes whatever ESPHome's own release
    # bundles, with no guarantee it's >= whatever HA already pushed onto
    # the C6 - that mismatch is what was crashing this board deep in
    # ESP-IDF's own early startup (before ESPHome's logger even printed
    # a line), not anything in this repo's own YAML content.
    #
    # Pinning BOTH ends to the same known release sidesteps the mismatch
    # rather than trying to detect it: 2.12.12 was the current stable
    # (non-3.x) release at the time this was fixed - keep this in sync
    # with whatever the C6-firmware update entity is actually running,
    # if that ever changes again.
    components:
      - espressif/esp_hosted==2.12.12
    # CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM/CONFIG_ESP_MAIN_TASK_STACK_SIZE
    # and advanced: loop_task_stack_size below all came from the same
    # fix, reported working on the same P4+C6-hosted board family - kept
    # together as one known-good set rather than trimmed to "the one
    # that mattered", since that wasn't isolated on real hardware.
    sdkconfig_options:
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
    advanced:
      # Required by esp32_hosted (WiFi 6/BLE via the ESP32-C6, below),
      # per the same board manifest - ESP-IDF's P4<->C6 co-processor
      # support is still marked experimental upstream.
      enable_idf_experimental_features: true
      loop_task_stack_size: 32768

# Per the same board manifest: this board's USB-C port is a UART0-based
# flashing/debug port (not the P4's native USB-Serial-JTAG), so logging
# needs to be pinned there explicitly - this board-specific field is
# why logger: lives here rather than in the shared .basics.yaml (see
# that file's own closing comment on why that's not just a style
# choice).
logger:
  level: DEBUG
  hardware_uart: UART0

# ESP32-P4 only supports hex-mode PSRAM (quad/octal aren't valid on this
# variant - ESPHome's own psram component enforces this).
#
# NOT the cause of the boot crash chased through several earlier rounds
# of this file's own comments (that crash - `assert failed:
# spi_flash_disable_interrupts_caches_and_other_cpu cache_utils.c:127
# (esp_task_stack_is_sane_cache_disabled())`, right after ESP-IDF's own
# "Disabling RNG early entropy source..." - was a C6-firmware/host-
# library esp_hosted version mismatch, fixed in the esp32: block above,
# not a PSRAM setting). `speed: 100MHz` was an earlier, wrong guess at
# the cause, kept here only because it's a safe, working value, not
# because 200MHz was ever confirmed unsafe - untested whether 200MHz
# would also be fine now that the real cause is fixed.
psram:
  mode: hex
  speed: 200MHz

# Include Wi-Fi/OTA/API/time/the restart watchdog - logger: lives above
# instead, not in .basics.yaml (see that file's closing comment on why).
# `packages:` rather than a plain `<<: !include` merge key: ESPHome
# deep-merges a package recursively (nested keys combine; this file's
# own values win on an actual collision) instead of the raw YAML merge
# key's "whole top-level key wins or loses" behavior - more robust if
# any future key ever needs contributions from both files at once.
packages:
  basics: !include .basics.yaml

# =============================================================================
# Ethernet - REMOVED per repo-owner decision (2026-09-06): "brauchen wir
# nicht" - the onboard PoE port was only ever an optional wired fallback
# (README.md's old "Networking" #2), never required now that Wi-Fi 6 via
# the ESP32-C6 is the active, always-on path (below). Dropping the
# `ethernet:` block entirely rather than leaving it configured-but-idle -
# one less component, one less thing that could fail `esphome config` if
# this board revision's PHY wiring ever turns out to differ. The pin
# table in docs/hardware.md is left in place as historical reference (in
# case a future board wants the wired port back), marked removed there
# too - see that file and README.md's "Networking" section, both updated
# to match.
# =============================================================================
# Wi-Fi 6 / BLE via the ESP32-C6 co-processor (esp32_hosted)
# =============================================================================
# ESPHome's own board manifest for this board configures this SDIO link
# and its firmware auto-updater as standard - not something this repo
# invented. The P4 itself has no radio, so this is the transport the
# active `wifi:` block (in .basics.yaml, per user decision - see
# README.md "Networking") actually rides on to reach Home Assistant;
# the `update:` entity below keeps the C6's own firmware current from
# Espressif/ESPHome's hosted firmware manifest, which matters because
# esphome/esphome#10956 reported SDIO packet drops and repeated Wi-Fi
# association failures on a sibling Waveshare ESP32-P4 + C6 board -
# untested here whether current firmware avoids that, so keep an eye on
# that issue if you see similar symptoms.

esp32_hosted:
  type: sdio
  variant: ESP32C6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

http_request:

update:
  - platform: esp32_hosted
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    name: "C6 Firmware"

# =============================================================================
# I2C - Touch controller only (the DSI panel itself is configured over
# its own DSI command channel, not I2C - see the display: block below)
# =============================================================================

i2c:
  - id: bus_touch
    sda: GPIO7
    scl: GPIO8
    scan: true

# =============================================================================
# LDO - powers the MIPI DSI PHY (required by display.mipi_dsi below)
# =============================================================================
# The ESP32-P4's DSI/CSI PHY draws its power from the chip's internal
# adjustable LDO, not directly from the 3.3V rail - `mipi_dsi` lists
# esp_ldo as a hard DEPENDENCIES entry and esphome config fails
# ("Component display.mipi_dsi requires component esp_ldo") without a
# block like this present somewhere in the config. Channel 3 at 2.5V is
# not a guess - it's exactly what ESPHome's own test fixture for this
# component uses (tests/components/mipi_dsi/test.esp32-p4-idf.yaml).
# Nothing else in this file references `ldo_id` - just having the block
# satisfies the dependency; ESPHome wires it to the DSI PHY internally.

esp_ldo:
  - id: ldo_dsi
    channel: 3
    voltage: 2.5V

# =============================================================================
# Display - 10.1-DSI-TOUCH-A (800x1280, JD9365 panel, 2 DSI lanes)
# =============================================================================
# WAVESHARE-10.1-DSI-TOUCH-A already exists as a built-in model in
# ESPHome's mipi_dsi component (>=2025.8.0) - it carries the panel's full
# init sequence and timing, so no custom init_sequence: is needed here.
#
# reset_pin/enable_pin (backlight) are both optional in the mipi_dsi
# schema and left out entirely rather than guessed - confirmed working
# without them on the real board (panel comes up over pure DSI init,
# no host-driven reset pulse needed; backlight is apparently either
# always-on or controlled some other way this config doesn't touch
# yet). If software backlight control is wanted later, that's a real
# GPIO to find on the POE-ETH schematic (docs/hardware.md), not a
# placeholder to fill in blind.

display:
  - platform: mipi_dsi
    id: disp_main
    model: WAVESHARE-10.1-DSI-TOUCH-A
#    reset_pin: GPIO_TODO_VERIFY_RESET_PIN       # see docs/hardware.md
#    enable_pin: GPIO_TODO_VERIFY_BACKLIGHT_PIN  # see docs/hardware.md

# =============================================================================
# Touchscreen - GT9271 (GT911-compatible), address 0x5D
# =============================================================================
# No interrupt_pin/reset_pin: on sibling Waveshare ESP32-P4 DSI boards
# the touch interrupt line isn't routed to the MCU at all, and reset is
# deliberately left unconfigured to avoid disturbing the controller's
# address-select strapping - same reasoning m5dial_fram's design_rules.md
# documents for its own ft5x06 touch controller ("With interrupt_pin, the
# first flash produced: touchscreen is marked FAILED"). The component
# polls fine without either pin. See docs/hardware.md for confidence.

touchscreen:
  - platform: gt911
    id: touch_main
    i2c_id: bus_touch
    address: 0x5D
    display: disp_main
    # Sleep mode's own activity timer (on_touch_activity/check_sleep_idle
    # below) - the base `touchscreen:` schema's on_touch fires for every
    # raw touch point regardless of which LVGL widget (if any) is under
    # it, which is exactly "was the panel touched at all", not "was a
    # specific button pressed" - the latter would miss e.g. a touch-and-
    # drag that never lands on a clickable widget.
    on_touch:
      - script.execute: on_touch_activity

# =============================================================================
# SBB clock widget (Mainscreen) - reused verbatim from m5dial_clock_sbb
# =============================================================================
# pages.md §6: "the widget scales by width/height alone ... no changes
# needed to reuse it here at a much larger size than the M5Dial's
# 240x240". Pulled as a git external_component, same as the user's
# other Smart EBL/FRAM devices that use it.

external_components:
  - source:
      type: git
      url: https://github.com/CzarofAK/m5dial_clock_sbb
      ref: main
    components: [sbb_clock]

sbb_clock: # marker key - without it ESPHome won't load the component

color:
  - id: col_clock_ink
    hex: FFFFFF
  - id: col_clock_bg
    hex: "000000"
  - id: col_clock_second
    hex: E74C3C
  # Every page's own bg_color (see the `pages:` block below) - a
  # SEPARATE id from col_clock_bg above even though it happens to be
  # the same hex, since the two mean different things (that one is the
  # clock's own "ink" color by day; this one is corner_color, the fixed
  # color the clock's square canvas corners disappear into - see that
  # widget property's own comment). Keeping them distinct means a future
  # change to one can never silently break the other by coincidence.
  - id: col_page_bg
    hex: "000000"

# =============================================================================
# UI fonts - custom glyph set, NOT ESPHome/LVGL's bare `montserrat_NN`
# built-ins
# =============================================================================
# Real bug fixed (repo-owner report): German umlauts (LÜFTER, etc.) and
# the Victron-flow arrows (→/↓ on page_electric) rendered as blank boxes
# ("tofu") on the real device. ESPHome's built-in `montserrat_NN` LVGL
# fonts only rasterize a plain-ASCII glyph subset - anything outside
# U+0020-U+007E (that includes ä/ö/ü/ß and any arrow) simply isn't in the
# generated bitmap font at all, so LVGL falls back to its "missing glyph"
# placeholder box. Fixed by declaring these as real `font:` entries
# instead (same Montserrat family/weight, fetched via `gfonts:` at
# compile time) with an explicit `glyphs:` list covering every character
# actually used anywhere in this file's labels - plain ASCII, the degree
# sign, the German umlauts/ß, and the two arrows - one font per size this
# file uses (16/20/24/40, replacing `montserrat_16/20/24/40` 1:1
# everywhere below). `glyphs:` is NOT additive on top of ESPHome's
# default ASCII set - leaving any of those characters out here would
# silently reintroduce the same tofu-box bug for that character, so this
# list has to stay a superset of every string literal (and lambda-built
# string) in this file, not just "whatever's missing today".
#
# Real bug fixed (round 2, repo-owner report): the tofu boxes were still
# showing up EVERYWHERE a plain space appears ("POWER (12V)", the status
# bar's "HH:MM:SS   DD.MM.YYYY", etc.) even after the fix above. Cause:
# this glyph list used to be a `|-` block scalar with the space meant to
# be its very first character, indented to line up with the block's own
# indentation marker - YAML's block-scalar rules strip exactly that much
# leading whitespace off every line as indentation, not content, so the
# one character this whole file's labels use more than any other was
# silently missing from the generated font. A quoted flow scalar with
# the space placed somewhere unambiguous (not first-and-only-thing-on-
# the-line) has no such stripping rule - used here instead.
font:
  - file: "gfonts://Montserrat"
    id: font_ui_16
    size: 16
    glyphs: &ui_glyphs "!\" %()+-./:0123456789<=>?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyzäöüÄÖÜß°→↓↑"
  - file: "gfonts://Montserrat"
    id: font_ui_20
    size: 20
    glyphs: *ui_glyphs
  - file: "gfonts://Montserrat"
    id: font_ui_24
    size: 24
    glyphs: *ui_glyphs
  # Electric page main-value row (repo-owner: "die Texte (alle) grösser,
  # primär der Hauptwert") - bigger than font_ui_24, but deliberately
  # short of Battery's own font_ui_40 "hero" size so Battery still
  # reads as the emphasized box, not just another box like the rest.
  - file: "gfonts://Montserrat"
    id: font_ui_32
    size: 32
    glyphs: *ui_glyphs
  - file: "gfonts://Montserrat"
    id: font_ui_40
    size: 40
    glyphs: *ui_glyphs

# ---- Day/night for the clock face (pages.md §4's brightness/day-night
# icon) - AUTO only for this release, driven by HA's sun.sun, same
# source m5dial_fram's clock page uses. The popup's manual DAY/NIGHT
# override and the brightness slider are both still open items (the
# slider is blocked on an unconfirmed backlight PWM pin, docs/hardware.md
# §7/pages.md §7) - not built here.
text_sensor:
  - platform: homeassistant
    id: s_sun
    entity_id: sun.sun
    on_value:
      - script.execute: apply_daynight

  # ---- Truma status/error - ONE shared Truma CP Plus unit behind both
  # Climate and Boiler (room + water are two sides of the same Combi 4),
  # so these have no room/water suffix in HA and are shown on BOTH
  # pages' footers (draw_climate/draw_boiler), not duplicated per page.
  # text_sensor, not sensor: these are status/mode/error STRINGS
  # ("Heizen", an error code, etc.), not numbers - a plain `sensor:`
  # would try to parse them as floats. Real entity_ids confirmed by the
  # repo owner (womolin_controller MQTT integration) - not a guess like
  # the rest of this section used to be.
  - platform: homeassistant
    id: s_truma_operating_status
    entity_id: sensor.womolin_controller_mqtt_operating_status
    on_value:
      - script.execute: draw_climate
      - script.execute: draw_boiler

  - platform: homeassistant
    id: s_truma_heating_mode
    entity_id: sensor.womolin_controller_mqtt_heating_mode
    on_value:
      - script.execute: draw_climate
      - script.execute: draw_boiler

  - platform: homeassistant
    id: s_truma_error_code
    entity_id: sensor.womolin_controller_mqtt_heater_error_code
    on_value:
      - script.execute: draw_climate
      - script.execute: draw_boiler

  # ---- Fan level (Lüfterstufe), room-heating side only. NOT a separate
  # select entity - repo owner confirmed climate.womolin_controller_
  # mqtt_truma_room carries its own `fan_mode` attribute (HA's standard
  # climate-domain concept), with fan_modes: off/low/medium/high (real
  # values, confirmed) - so this reads/writes that climate entity
  # directly (attribute: fan_mode / climate.set_fan_mode), same entity
  # s_climate_room_temp/s_climate_target already use, just a third
  # attribute off it.
  - platform: homeassistant
    id: s_climate_fan_mode
    entity_id: climate.womolin_controller_mqtt_truma_room
    attribute: fan_mode
    on_value:
      - script.execute: draw_climate

  # ---- Electric page (page_electric) - MultiPlus state/mode strings,
  # real entities from m5dial_fram/page_power_3.yaml.
  - platform: homeassistant
    id: s_multiplus_state
    entity_id: sensor.multiplus_zustand
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_multiplus_mode
    entity_id: select.multiplus
    # Same filter as m5dial_fram/page_power_3.yaml's s_power_3_mode -
    # options of select.multiplus: charger_only · inverter_only · on ·
    # off (confirmed real values, from that file's own comment).
    filters:
      - lambda: |-
          std::string s = x;
          if (s == "on") return std::string("ON");
          if (s == "charger_only") return std::string("CHG");
          if (s == "inverter_only") return std::string("INV");
          return std::string("OFF");
    on_value:
      - script.execute: draw_electric

  # ---- Solar (MPPT) status - shares the Charger box's "main value +
  # humanized state" pattern, see draw_electric.
  - platform: homeassistant
    id: s_mppt_zustand
    entity_id: sensor.mppt_190w_zustand
    on_value:
      - script.execute: draw_electric

  # ---- Truma climate/boiler current+target temperature - read as TEXT,
  # not `sensor: platform: homeassistant`, and parsed by hand below.
  #
  # Real bug fixed: the Truma's `current_temperature` attribute goes
  # HA-side `None` while the unit reports nothing usable (seen in the
  # field as `[W][homeassistant.sensor:014]: 'climate.womolin_
  # controller_mqtt_truma_water': Can't convert 'None' to number!` on
  # every single state push while that lasts). That warning is emitted
  # unconditionally, before any `filters:`/`on_value:` of ours ever
  # runs - a numeric `homeassistant` sensor has no way to suppress it,
  # short of not being a numeric sensor. A `text_sensor` reading the same
  # attribute never tries a float parse itself, so it never warns; the
  # lambdas below do that parse by hand and simply skip publishing to
  # the matching `sensor: platform: template` (s_climate_room_temp/
  # s_climate_target/s_boiler_temp/s_boiler_target above) when the text
  # is "None"/"unknown"/"unavailable" - same net effect as the old
  # numeric sensor's own behavior (which also silently kept the last
  # published value on an unparseable attribute, per ESPHome's own
  # `homeassistant` sensor source), just without the log spam.
  - platform: homeassistant
    id: s_climate_room_temp_raw
    entity_id: climate.womolin_controller_mqtt_truma_room
    attribute: current_temperature
    on_value:
      - lambda: |-
          char *end = nullptr;
          float v = strtof(x.c_str(), &end);
          if (end != x.c_str() && *end == '\0') id(s_climate_room_temp).publish_state(v);

  - platform: homeassistant
    id: s_climate_target_raw
    entity_id: climate.womolin_controller_mqtt_truma_room
    attribute: temperature
    on_value:
      - lambda: |-
          char *end = nullptr;
          float v = strtof(x.c_str(), &end);
          if (end != x.c_str() && *end == '\0') id(s_climate_target).publish_state(v);

  - platform: homeassistant
    id: s_boiler_temp_raw
    entity_id: climate.womolin_controller_mqtt_truma_water
    attribute: current_temperature
    on_value:
      - lambda: |-
          char *end = nullptr;
          float v = strtof(x.c_str(), &end);
          if (end != x.c_str() && *end == '\0') id(s_boiler_temp).publish_state(v);

  - platform: homeassistant
    id: s_boiler_target_raw
    entity_id: climate.womolin_controller_mqtt_truma_water
    attribute: temperature
    on_value:
      - lambda: |-
          char *end = nullptr;
          float v = strtof(x.c_str(), &end);
          if (end != x.c_str() && *end == '\0') id(s_boiler_target).publish_state(v);

# =============================================================================
# RS232 link to the Smart EBL main unit (docs/protocol.md)
# =============================================================================

uart:
  - id: link_uart
    tx_pin: ${link_tx_pin}
    rx_pin: ${link_rx_pin}
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1

globals:
  # Byte-accumulate buffer for the line reader below. Cleared on every
  # '\n' and on overflow (protocol.md §3's 480-byte cap) - never grows
  # without bound on a wiring fault or boot-time UART glitch.
  - id: link_rx_buffer
    type: std::string
    restore_value: false
    initial_value: '""'

  # millis() timestamp of the last successfully-checksummed telemetry
  # frame, any group. 0 = none received yet. Used by draw_status_bar's
  # invalid-value check (design_rules.md §2 / protocol.md §4) - one
  # global for the whole link, per protocol.md §7's own note that a
  # future multi-page build extending to more groups may want one per
  # group instead.
  - id: link_last_rx_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---- Navigation (nav rail, top_layer widgets below) -----------------
  # 0 = home, 1 = electric, 2 = climate, 3 = boiler. Drives draw_nav's
  # highlight.
  - id: g_current_page
    type: int
    restore_value: false
    initial_value: "0"

  # ---- Day/night manual override (see apply_daynight/act_daynight_set_mode) --
  # restore_value: true, same as m5dial_fram's own g_daynight - a manual
  # DAY/NIGHT pick should survive a reboot, not silently revert to AUTO.
  - id: g_daynight
    type: int
    restore_value: true
    initial_value: "0"

  # ---- Backlight (see apply_backlight) - persisted like g_daynight, even
  # though nothing drives real PWM from it yet (see that script's own
  # comment) - no reason to make the user re-pick it every boot once the
  # pin IS found.
  - id: g_backlight_pct
    type: int
    restore_value: true
    initial_value: "100"

  # ---- Sleep mode (see check_sleep_idle/enter_sleep/wake_from_sleep) ----
  - id: g_last_touch_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_sleep_active
    type: bool
    restore_value: false
    initial_value: "false"

  # ---- Electric page (page_electric) popup - shore/grid current limit
  # (number.multiplus_strombegrenzung) being locally edited, same
  # debounced-write pattern as m5dial_fram/page_power_2.yaml's own
  # g_power_2_assist_pending.
  - id: g_multiplus_limit_pending
    type: float
    restore_value: false
    initial_value: "0"

  # ---- Electric page (page_electric) - Solar Yield popup, same shape as
  # g_multiplus_limit_pending above.
  - id: g_mppt_limit_pending
    type: float
    restore_value: false
    initial_value: "0"

  # ---- Climate (page_climate) - HA-fed via womolin_controller, not the
  # link. Kept in this same globals: block rather than a second one
  # further down - see draw_climate/act_climate_* below for how these
  # are used.
  - id: g_climate_temp_pending
    type: float
    restore_value: false
    initial_value: "20"

  # Gates the "---" placeholder - g_climate_temp_pending can't be told
  # apart from "genuinely 20°C" on its own.
  - id: g_climate_temp_known
    type: bool
    restore_value: false
    initial_value: "false"

  # Optimistic HEIZ state shown instantly on tap, ahead of
  # s_climate_heater_on's own confirmation.
  - id: g_climate_heater_optimistic
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_climate_heater_optimistic_valid
    type: bool
    restore_value: false
    initial_value: "false"

  # ---- Boiler (page_boiler) - same womolin_controller integration as
  # Climate, water-heating side of the same Truma Combi 4. Three fixed
  # tiers (ECO 40°C / mid 60°C / BOOST 80°C), not continuous - see
  # act_boiler_temp_up/down below.
  - id: g_boiler_temp_pending
    type: float
    restore_value: false
    initial_value: "40"
  - id: g_boiler_temp_known
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_boiler_heater_optimistic
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_boiler_heater_optimistic_valid
    type: bool
    restore_value: false
    initial_value: "false"

# ---- Local mirrors of smartebl's entities (protocol.md §5, groups 2-4) ----
# Only the slice this release's three pages actually show - extend by
# adding both a sensor/switch here AND the matching `else if` in the
# reader lambda below, per protocol.md §5's "implemented vs planned"
# note. Group 1 (fuses) and group 6 (system) are broadcast by smartebl
# now (see that repo's smart-ebl.yaml) but not yet consumed here - no
# page in this release shows a fuse grid or system diagnostics.

sensor:
  # Tanks - not shown on any page in this release (no Levels page yet),
  # kept wired since smartebl already broadcasts them and the parser
  # needs somewhere to publish to; reserved for that future page.
  - platform: template
    id: s_tank1_level
    name: "Freshwater Level (via link)"
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    id: s_tank2_level
    name: "Greywater Level (via link)"
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    id: s_leisure_battery_voltage
    name: "Leisure Battery Voltage (via link)"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    on_value:
      - script.execute: draw_electric

  - platform: template
    id: s_starter_battery_voltage
    name: "Starter Battery Voltage (via link)"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    on_value:
      - script.execute: draw_electric

  - platform: template
    id: s_ac_charger_voltage
    name: "AC Charger Voltage (via link)"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    on_value:
      - script.execute: draw_electric

  # ---- Electric page (page_electric) - real Victron entities, HA-fed,
  # NOT the link. Exact same entities m5dial_fram's page_power_1/2/3.yaml
  # already use for this installation's SmartShunt (battery monitor) and
  # MultiPlus (inverter/charger) - real entity_ids, not a guess.
  - platform: homeassistant
    id: s_battery_soc
    entity_id: sensor.smartshunt_ladestand
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_battery_dc_v
    entity_id: sensor.smartshunt_dc_bus_spannung
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_battery_dc_a
    entity_id: sensor.smartshunt_dc_bus_stromstarke
    on_value:
      - script.execute: draw_electric

  # ---- Shore - main = input power, sub-left/right = voltage/frequency
  # (repo-owner spec) - input current (the old sub-value here) dropped,
  # not shown anywhere on this box any more.
  - platform: homeassistant
    id: s_multiplus_in_w
    entity_id: sensor.multiplus_eingangsleistung_l1
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_multiplus_in_v
    entity_id: sensor.multiplus_eingangsspannung_l1
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_multiplus_in_hz
    entity_id: sensor.multiplus_eingangsfrequenz_l1
    on_value:
      - script.execute: draw_electric

  # ---- AC Loads - main = output power, sub-left/right = voltage/
  # frequency (repo-owner spec) - replaces the old %-of-1600W-nominal
  # figure (sensor.multiplus_0_wr_leistung) with the per-phase output
  # power entity directly.
  - platform: homeassistant
    id: s_multiplus_out_w
    entity_id: sensor.multiplus_ausgangsleistung_l1
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_multiplus_out_v
    entity_id: sensor.multiplus_ausgangsspannung_l1
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_multiplus_out_hz
    entity_id: sensor.multiplus_ausgangsfrequenz_l1
    on_value:
      - script.execute: draw_electric

  # ---- Solar Yield - real MPPT charge controller, confirmed by the
  # repo owner (a "MPPT 190W" unit). Main = PV yield power; sub-left/
  # right = the MPPT's own DC battery-bus voltage/current (repo-owner
  # spec) - distinct from the SmartShunt's own DC bus V/A in the Battery
  # box below (same physical bus, two different monitors' own readings
  # of it).
  - platform: homeassistant
    id: s_mppt_pv_yield
    entity_id: sensor.mppt_190w_leistung_pv_ertrag
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_mppt_batt_v
    entity_id: sensor.mppt_190w_dc_batterie_bus_spannung
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_mppt_batt_a
    entity_id: sensor.mppt_190w_dc_batterie_bus_stromstarke
    on_value:
      - script.execute: draw_electric

  # ---- Battery - SmartShunt's own remaining-time-to-empty and net
  # power, alongside the SOC/V/A this box already showed.
  - platform: homeassistant
    id: s_battery_remaining_time
    entity_id: sensor.smartshunt_verbleibende_zeit
    on_value:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_battery_power
    entity_id: sensor.smartshunt_leistung
    on_value:
      - script.execute: draw_electric

  # ---- DC Loads - real GX device aggregate DC consumption figure,
  # confirmed by the repo owner - this is what smartebl's own hardware
  # could never provide (no current-sense on smartebl's own fuses),
  # not the SmartShunt's net current already shown in the Battery box.
  - platform: homeassistant
    id: s_dc_loads
    entity_id: sensor.gx_device_dc_verbrauch
    on_value:
      - script.execute: draw_electric

  # number domain, not sensor - ESPHome's homeassistant sensor platform
  # reads whatever numeric state HA reports regardless of domain, same
  # as m5dial_fram/page_power_2.yaml's own s_power_2_limit.
  - platform: homeassistant
    id: s_multiplus_limit
    entity_id: number.multiplus_strombegrenzung
    on_value:
      - lambda: |-
          // Resync the locally-edited pending value from HA's confirmed
          // one, same "don't fight an active edit" pattern as
          // g_climate_temp_pending - but this popup has no separate
          // armed/disarmed state, so only resync while the popup is
          // closed (hidden) - nobody can be mid-edit if it's not open.
          if (lv_obj_has_flag(id(obj_electric_popup_panel), LV_OBJ_FLAG_HIDDEN)) {
            id(g_multiplus_limit_pending) = id(s_multiplus_limit).state;
          }
      - script.execute: draw_electric

  # ---- Solar Yield popup - charge-current limit (number.mppt_190w_
  # stromstarke), same resync-while-closed pattern as s_multiplus_limit
  # above. ⚠ No documented safe ceiling for this specific MPPT 190W unit
  # in this session (unlike the Charger popup's 16A, which is this
  # installation's actual shore-cable rating) - act_mppt_limit_up/down's
  # 20A clamp below is a conservative guess at "bigger than this panel
  # could ever actually push", not a confirmed wiring limit. Tighten it
  # once the charger's own datasheet/real max is known.
  - platform: homeassistant
    id: s_mppt_limit
    entity_id: number.mppt_190w_stromstarke
    on_value:
      - lambda: |-
          if (lv_obj_has_flag(id(obj_solar_popup_panel), LV_OBJ_FLAG_HIDDEN)) {
            id(g_mppt_limit_pending) = id(s_mppt_limit).state;
          }
      - script.execute: draw_electric

  # ---- Climate (page_climate) - HA-fed via womolin_controller, not the
  # link. Same entities m5dial_fram/page_climate.yaml already uses.
  # Also feeds the status bar's "inside" temperature (draw_status_bar) -
  # reusing this rather than a second HA entity, since the Truma room
  # sensor already *is* the cabin's inside temperature.
  #
  # `platform: template`, published from s_climate_room_temp_raw's
  # text_sensor below rather than read directly as `platform:
  # homeassistant` - see that text_sensor's own comment for why (fixes
  # the 'Can't convert 'None' to number!' warning this attribute used to
  # spam whenever the Truma reports no current temperature).
  - platform: template
    id: s_climate_room_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      - script.execute: draw_climate
      - script.execute: draw_status_bar

  # ---- Status bar "outside" temperature - LOCAL sensor, not HA --------
  # This is the two-wire resistive (NTC thermistor) sender already
  # wired to the old Nextion panel - repo owner is moving it to this
  # board directly, so it's read locally over ADC, not via Home
  # Assistant like everything else in this section.
  #
  # GPIO22 (ADC1 channel 6) - confirmed against ESP-IDF's own
  # esp32p4/include/soc/adc_channel.h (ADC1 = GPIO16-23, ADC2 =
  # GPIO49-54; see docs/hardware.md's ADC section for the full table
  # and which of those are already claimed by esp32_hosted/Ethernet/
  # this link), not the placeholder-GPIO4 guess this line originally
  # had - GPIO4 isn't an ADC pin on this chip at all. GPIO22 is both
  # ADC-capable and free on this board's header per the repo owner's
  # own photo.
  #
  # ⚠ STILL UNVERIFIED - the pin is now confirmed, the sensor's own
  # numbers are not, flagged explicitly rather than silently showing a
  # plausible-looking but wrong temperature:
  #   - 10kOhm reference/divider resistor and B=3950 are the single
  #     most common spec for a generic automotive/consumer NTC probe,
  #     NOT read off this specific sender's datasheet (none available
  #     in this session). If the reading looks off once flashed:
  #     measure the sender's actual resistance at a known room
  #     temperature with a multimeter and tell me both numbers - two
  #     such measurements (or one plus a trusted B-constant) are enough
  #     to calibrate this properly instead of guessing.
  #   - `configuration: DOWNSTREAM` assumes the sender sits between the
  #     ADC pin and GND, with a fixed resistor between 3.3V and that
  #     same pin (add that resistor if the old panel's circuit doesn't
  #     already have one in-line) - swap to UPSTREAM if it's wired the
  #     other way around.
  - platform: adc
    id: adc_temp_outside
    pin: GPIO22
    attenuation: 12db
    update_interval: 30s

  - platform: resistance
    id: r_temp_outside
    sensor: adc_temp_outside
    configuration: DOWNSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V

  - platform: ntc
    id: s_temp_outside
    sensor: r_temp_outside
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: "Outside Temperature"
    on_value:
      - script.execute: draw_status_bar

  # `platform: template`, published from s_climate_target_raw below - same
  # "avoid the None-to-number warning" reason as s_climate_room_temp above.
  # The target temperature is much less likely to ever go None than the
  # current one (it's a setpoint, not a live reading), but there's no
  # reason to leave it on the warning-prone path either.
  - platform: template
    id: s_climate_target
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    on_value:
      - lambda: |-
          id(g_climate_temp_pending) = x;
          id(g_climate_temp_known) = true;
      - script.execute: draw_climate

  # ---- Boiler (page_boiler) - HA-fed via womolin_controller, water-
  # heating side of the same Truma Combi 4 as Climate. Both template
  # sensors below, published from the text_sensor:'s raw attribute
  # readers - see s_climate_room_temp's comment for why.
  - platform: template
    id: s_boiler_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      - script.execute: draw_boiler

  - platform: template
    id: s_boiler_target
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    on_value:
      - lambda: |-
          id(g_boiler_temp_pending) = x;
          id(g_boiler_temp_known) = true;
      - script.execute: draw_boiler

binary_sensor:
  - platform: template
    id: s_shore_power_connected
    name: "Shore Power Connected (via link)"
    device_class: plug
    on_state:
      - script.execute: draw_electric

  # ---- Electric page (page_electric) popups - MPPT on/off and the
  # `fram_parkmodus` switch, mirrored read-only the same way as the
  # Truma switches below (see act_mppt_toggle/act_park_toggle for the
  # write side - homeassistant.service: switch.toggle, not a native
  # `switch: platform: homeassistant`, to match this file's own existing
  # convention rather than mixing in a second way to do the same thing).
  - platform: homeassistant
    id: s_mppt_on
    entity_id: switch.mppt_190w
    on_state:
      - script.execute: draw_electric

  - platform: homeassistant
    id: s_fram_parkmodus_on
    entity_id: switch.fram_parkmodus
    on_state:
      - script.execute: draw_electric

  # ---- Climate (page_climate) - HA-fed via womolin_controller ---------
  - platform: homeassistant
    id: s_climate_heater_on
    entity_id: switch.womolin_controller_mqtt_activate_room_heater
    on_state:
      # Real state just arrived - stop trusting the optimistic guess.
      - globals.set:
          id: g_climate_heater_optimistic_valid
          value: "false"
      - script.execute: draw_climate

  # ---- Boiler (page_boiler) - HA-fed via womolin_controller ------------
  - platform: homeassistant
    id: s_boiler_heater_on
    entity_id: switch.womolin_controller_mqtt_activate_water_heater
    on_state:
      - globals.set:
          id: g_boiler_heater_optimistic_valid
          value: "false"
      - script.execute: draw_boiler

  # ---- "Actually heating" vs. "activated" - the activate switch above
  # is the on/off gate the HEIZ/BOILER button toggles; these reflect
  # whether the Truma is actually running right now, which can lag the
  # gate (ignition, water already at temp, etc.) - shown as a small
  # secondary indicator, not instead of the button's own state.
  - platform: homeassistant
    id: s_climate_heater_active
    entity_id: binary_sensor.womolin_controller_mqtt_room_heater_active
    on_state:
      - script.execute: draw_climate

  - platform: homeassistant
    id: s_boiler_heater_active
    entity_id: binary_sensor.womolin_controller_mqtt_water_heater_active
    on_state:
      - script.execute: draw_boiler

  # ---- Truma status/error, shared by both pages - see the sensor:
  # block above for why there's no room/water split here.
  - platform: homeassistant
    id: s_truma_has_error
    entity_id: binary_sensor.womolin_controller_mqtt_heater_has_error
    on_state:
      - script.execute: draw_climate
      - script.execute: draw_boiler

  - platform: homeassistant
    id: s_truma_cp_plus_alive
    entity_id: binary_sensor.womolin_controller_mqtt_cp_plus_alive
    on_state:
      - script.execute: draw_climate
      - script.execute: draw_boiler

switch:
  # Optimistic local mirrors of smartebl's switches - reflect the
  # tile's ON/OFF state only, no turn_on_action/turn_off_action.
  #
  # BUG FIXED (found on real hardware, see the commit this comment
  # landed in): these used to have turn_on_action/turn_off_action
  # calling send_link_command directly. ESPHome's switch component
  # unconditionally calls write_state() - which runs those actions -
  # in two situations this repo never wants to send a command for:
  #   1. At boot, to enact the (restored/default) initial state -
  #      this alone sent "everything OFF" to smartebl on every single
  #      display reboot, regardless of smartebl's actual state.
  #   2. Every time the link reader below reflects an incoming
  #      telemetry frame via turn_on()/turn_off() - since that ALSO
  #      unconditionally re-ran the action, every ~800ms telemetry
  #      cycle re-sent the same command back to smartebl, which would
  #      re-pulse the physical bistable relay coil over and over for
  #      as long as the link stayed up, not just on an actual change.
  # Fix: these switches now hold state only (publish_state() from the
  # reader, not turn_on()/turn_off()) and the tiles below call
  # send_link_command explicitly from on_click - the only place a
  # command is actually supposed to originate from.
  - platform: template
    id: sw_pump_mirror
    name: "Water Pump (via link)"
    icon: mdi:water-pump
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_light_mirror
    name: "Light Group (via link)"
    icon: mdi:lightbulb-group
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_12v_mirror
    name: "12V Group (via link)"
    icon: mdi:power-socket-eu
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_aux_mirror
    name: "AUX Group (via link)"
    icon: mdi:power
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

  - platform: template
    id: sw_eisex_mirror
    name: "EisEx Heater (via link)"
    icon: mdi:heating-coil
    optimistic: true
    on_turn_on:
      - script.execute: draw_home_tiles
    on_turn_off:
      - script.execute: draw_home_tiles

# =============================================================================
# Link reader - parses protocol.md §3 telemetry frames off link_uart
# =============================================================================
# Plain byte-accumulate-until-'\n' lambda, no custom component (protocol.md
# §1's reasoning: keep both ends implementable in ordinary ESPHome yaml).
# Extend to a new key by adding one more `else if key == "..."` below AND
# a matching sensor/switch above - same shape every time.
#
# Connectivity itself (link_last_rx_ms -> "LINK OK"/"NO LINK") is re-
# evaluated on its own 1s timer below, not here - staleness is defined by
# the ABSENCE of a frame, which this block alone can never detect.

interval:
  - interval: 20ms
    then:
      - lambda: |-
          uint8_t c;
          while (id(link_uart)->available()) {
            id(link_uart)->read_byte(&c);
            if (c == '\n') {
              std::string &line = id(link_rx_buffer);
              size_t star = line.rfind('*');
              if (!line.empty() && line[0] == 'T' && star != std::string::npos &&
                  star + 2 < line.size()) {
                uint8_t chk = 0;
                for (size_t i = 0; i < star; i++) {
                  chk ^= (uint8_t) line[i];
                }
                uint8_t got = (uint8_t) strtol(line.substr(star + 1, 2).c_str(), nullptr, 16);
                if (chk == got) {
                  // Skip "T<group>;" (3 chars: T, one digit, ';') and
                  // walk key=value pairs up to the checksum marker.
                  size_t pos = 3;
                  while (pos < star) {
                    size_t semi = line.find(';', pos);
                    if (semi == std::string::npos || semi > star) semi = star;
                    std::string kv = line.substr(pos, semi - pos);
                    size_t eq = kv.find('=');
                    if (eq != std::string::npos) {
                      std::string key = kv.substr(0, eq);
                      std::string val = kv.substr(eq + 1);
                      float f = atof(val.c_str());
                      bool on = val == "1";
                      if (key == "tank1_level") {
                        id(s_tank1_level).publish_state(f);
                      } else if (key == "tank2_level") {
                        id(s_tank2_level).publish_state(f);
                      } else if (key == "leisure_battery_voltage") {
                        id(s_leisure_battery_voltage).publish_state(f);
                      } else if (key == "starter_battery_voltage") {
                        id(s_starter_battery_voltage).publish_state(f);
                      } else if (key == "ac_charger_voltage") {
                        id(s_ac_charger_voltage).publish_state(f);
                      } else if (key == "shore_power_connected") {
                        id(s_shore_power_connected).publish_state(on);
                      } else if (key == "switch_pump") {
                        // publish_state(), not turn_on()/turn_off():
                        // reflects smartebl's actual state without
                        // re-running an action - see switch: block's
                        // header comment for why that distinction is
                        // load-bearing here (it used to re-send a
                        // command on every single telemetry frame).
                        id(sw_pump_mirror).publish_state(on);
                      } else if (key == "switch_light") {
                        id(sw_light_mirror).publish_state(on);
                      } else if (key == "switch_12v") {
                        id(sw_12v_mirror).publish_state(on);
                      } else if (key == "switch_aux") {
                        id(sw_aux_mirror).publish_state(on);
                      } else if (key == "eisex_output") {
                        id(sw_eisex_mirror).publish_state(on);
                      }
                      // Unknown keys (fuses, tank3, system) ignored on
                      // purpose - protocol.md §3's forward-compatibility
                      // rule; nothing in this release's pages shows them.
                    }
                    pos = semi + 1;
                  }
                  id(link_last_rx_ms) = millis();
                }
              }
              line.clear();
            } else if (c != '\r') {
              if (id(link_rx_buffer).size() < 480) {
                id(link_rx_buffer).push_back((char) c);
              } else {
                // Overflow guard (protocol.md §3) - drop and resync.
                id(link_rx_buffer).clear();
              }
            }
          }

  # Re-evaluate link staleness once a second regardless of whether a
  # new frame arrived - see this block's own header comment above.
  - interval: 1s
    then:
      - script.execute: draw_status_bar
      - script.execute: draw_electric

  # Sleep mode - "no touch for 10 minutes" is only ever detectable by
  # polling (see check_sleep_idle's own comment); 5s is plenty fine-
  # grained against a 10-minute threshold.
  - interval: 5s
    then:
      - script.execute: check_sleep_idle

# =============================================================================
# Link writer - composes protocol.md §7 command frames
# =============================================================================

script:
  - id: send_link_command
    parameters:
      key: string
      value: string
    then:
      - lambda: |-
          std::string payload = "C;" + key + "=" + value + ";";
          uint8_t chk = 0;
          for (char ch : payload) {
            chk ^= (uint8_t) ch;
          }
          char hex[3];
          snprintf(hex, sizeof(hex), "%02X", chk);
          id(link_uart)->write_str((payload + "*" + std::string(hex) + "\n").c_str());

  # ---- Day/night + brightness popup (see the sbb_clock section above) --
  # g_daynight: 0 AUTO (follows s_sun, HA's own source - same one
  # m5dial_fram's clock page reads via is_below_horizon()) / 1 DAY /
  # 2 NIGHT, manual override. pages.md §4's popup ("a brightness slider +
  # an AUTO/DAY/NIGHT selector") is now built (obj_daynight_popup_panel,
  # top_layer) - tapping the status bar's small AUTO/DAY/NIGHT button
  # opens it instead of cycling in place.
  - id: apply_daynight
    then:
      - lambda: |-
          bool night;
          int m = id(g_daynight);
          if (m == 1) {
            night = false;
          } else if (m == 2) {
            night = true;
          } else {
            night = id(s_sun).has_state() && id(s_sun).state != "above_horizon";
          }
          id(clock_face).set_night_mode(night);
      - lambda: |-
          const char *labels[3] = {"AUTO", "DAY", "NIGHT"};
          lv_label_set_text(id(lbl_daynight_toggle), labels[id(g_daynight)]);

  - id: act_daynight_set_mode
    parameters:
      mode: int
    then:
      - globals.set: {id: g_daynight, value: !lambda "return mode;"}
      - script.execute: apply_daynight
      - script.execute: draw_daynight_popup

  # ---- Brightness - SOFTWARE dimming, not a real backlight PWM ---------
  # Confirmed (repo owner, against Waveshare's own wiki page for this
  # exact panel): there is no backlight GPIO on this board at all to
  # drive - not just unconfirmed, genuinely absent. A real hardware
  # dimmer was never going to happen here, so this fakes the same
  # result instead: obj_brightness_dim_overlay (top_layer, drawn over
  # every page's content but BELOW obj_sleep_overlay and non-clickable,
  # so it dims what's on screen without ever blocking a touch) is a
  # plain black rectangle whose opacity this drives - more opaque =
  # darker screen. Capped well short of fully opaque (200/255 at the
  # slider's own 10% floor) so the UI stays legible at minimum, unlike
  # sleep mode's own full-black overlay, which is a deliberately
  # different, total-blackout state.
  - id: apply_backlight
    then:
      - lambda: |-
          int pct = id(g_backlight_pct);
          char buf[8];
          snprintf(buf, sizeof(buf), "%d%%", pct);
          lv_label_set_text(id(lbl_backlight_pct), buf);
          float dim = (100 - pct) / 90.0f;  // slider range is 10-100
          if (dim < 0.0f) dim = 0.0f;
          if (dim > 1.0f) dim = 1.0f;
          lv_obj_set_style_bg_opa(id(obj_brightness_dim_overlay), (lv_opa_t) (dim * 200), 0);

  - id: act_backlight_set
    parameters:
      pct: int
    then:
      - globals.set: {id: g_backlight_pct, value: !lambda "return pct;"}
      - script.execute: apply_backlight

  - id: show_daynight_popup
    then:
      - script.execute: draw_daynight_popup
      - lvgl.widget.update: {id: obj_daynight_popup_backdrop, hidden: false}
      - lvgl.widget.update: {id: obj_daynight_popup_panel, hidden: false}

  - id: close_daynight_popup
    then:
      - lvgl.widget.update: {id: obj_daynight_popup_backdrop, hidden: true}
      - lvgl.widget.update: {id: obj_daynight_popup_panel, hidden: true}

  - id: draw_daynight_popup
    then:
      - lambda: |-
          int m = id(g_daynight);
          auto mode_btn = [&](lv_obj_t *btn, int tag, uint32_t on_bg, uint32_t on_border) {
            bool active = (m == tag);
            lv_obj_set_style_bg_color(btn, lv_color_hex(active ? on_bg : 0x202124), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(active ? on_border : 0x3C4043), 0);
          };
          mode_btn(id(btn_daynight_mode_auto), 0, 0x14324F, 0x4A9EFF);
          mode_btn(id(btn_daynight_mode_day), 1, 0x4F3814, 0xF39C12);
          mode_btn(id(btn_daynight_mode_night), 2, 0x1B5E3A, 0x2ECC71);
      - lvgl.slider.update:
          id: sld_backlight
          value: !lambda "return id(g_backlight_pct);"
      - script.execute: apply_backlight

  # ---- Sleep mode (pages.md's own display-power open item) -------------
  # Auto: between 22:00 and 08:00, blank after 10 minutes with no touch;
  # any touch anywhere wakes it (obj_sleep_overlay, top_layer, drawn last
  # so it's on top of every popup too, catches the waking tap itself so
  # it never also reaches whatever's underneath). Manual: the small moon
  # button next to the day/night one blanks immediately, any time, no
  # need to wait for the window/timer (e.g. before parking up for the
  # night). Same "blank overlay, not real backlight off" caveat as the
  # brightness slider above - there's no confirmed backlight GPIO to
  # power down, so this simulates sleep by covering the UI in solid
  # black rather than actually cutting the panel's backlight.
  - id: on_touch_activity
    then:
      - globals.set: {id: g_last_touch_ms, value: !lambda "return millis();"}
      - script.execute: wake_from_sleep

  - id: enter_sleep
    then:
      - if:
          condition:
            lambda: "return !id(g_sleep_active);"
          then:
            - globals.set: {id: g_sleep_active, value: "true"}
            - lvgl.widget.update: {id: obj_sleep_overlay, hidden: false}

  - id: wake_from_sleep
    then:
      - if:
          condition:
            lambda: "return id(g_sleep_active);"
          then:
            - globals.set: {id: g_sleep_active, value: "false"}
            - lvgl.widget.update: {id: obj_sleep_overlay, hidden: true}

  - id: toggle_sleep_manual
    then:
      - if:
          condition:
            lambda: "return id(g_sleep_active);"
          then:
            - script.execute: wake_from_sleep
          else:
            - script.execute: enter_sleep

  # Runs once a second regardless of touch activity - "no touch for 10
  # minutes" is defined by the ABSENCE of an on_touch_activity call,
  # which that script alone can never detect (same reasoning as
  # draw_status_bar's own link-staleness timer above).
  - id: check_sleep_idle
    then:
      - lambda: |-
          auto t = id(homeassistant_time).now();
          if (!t.is_valid()) return;
          bool in_night_window = t.hour >= 22 || t.hour < 8;
          bool idle_10min = (millis() - id(g_last_touch_ms)) >= (10UL * 60UL * 1000UL);
          if (in_night_window && idle_10min) {
            id(enter_sleep).execute();
          }

  # ---- Nav rail (top_layer, persists on every page) --------------------
  - id: nav_show_home
    then:
      - globals.set: {id: g_current_page, value: "0"}
      - lvgl.page.show: page_home
      - script.execute: draw_nav
      - script.execute: draw_home_tiles

  - id: nav_show_electric
    then:
      - globals.set: {id: g_current_page, value: "1"}
      - lvgl.page.show: page_electric
      - script.execute: draw_nav
      - script.execute: draw_electric

  # Room heating (Climate) and water heating (Boiler) are now one page
  # (page_climate widens to hold both, page_boiler removed) - repo
  # owner's own Truma unit, one nav entry ("TRUMA"), left half
  # Heizung/room, right half Boiler/water. draw_climate/draw_boiler
  # (the two halves' drawing scripts) and every id/global under those
  # names are otherwise unchanged - only the LVGL widget layout and nav
  # wiring merged.
  - id: nav_show_climate
    then:
      - globals.set: {id: g_current_page, value: "2"}
      - lvgl.page.show: page_climate
      - script.execute: draw_nav

  - id: draw_nav
    then:
      - lambda: |-
          int cur = id(g_current_page);
          lv_obj_set_style_text_color(id(lbl_nav_home),
              lv_color_hex(cur == 0 ? 0x2ECC71 : 0xBDC1C6), 0);
          lv_obj_set_style_text_color(id(lbl_nav_electric),
              lv_color_hex(cur == 1 ? 0x2ECC71 : 0xBDC1C6), 0);
          lv_obj_set_style_text_color(id(lbl_nav_climate),
              lv_color_hex(cur == 2 ? 0x2ECC71 : 0xBDC1C6), 0);

  # ---- Status bar (top_layer, persists on every page) -------------------
  # The only script this release runs on a timer rather than purely
  # on_value, because "no frame arrived" isn't a value change to hook,
  # and the clock needs a once-a-second tick regardless of the link.
  # Cross-category alarm ranking (pages.md §4/§7) is NOT implemented
  # yet - deliberately left as that document's own open item; this bar
  # only ever shows time/date + link status for this release.
  - id: draw_status_bar
    mode: restart
    then:
      - lambda: |-
          bool connected = id(link_last_rx_ms) != 0 &&
              (millis() - id(link_last_rx_ms)) < 3000;
          if (connected) {
            lv_label_set_text(id(lbl_status_link), "LINK OK");
            lv_obj_set_style_text_color(id(lbl_status_link), lv_color_hex(0x2ECC71), 0);
          } else {
            lv_label_set_text(id(lbl_status_link), "NO LINK");
            lv_obj_set_style_text_color(id(lbl_status_link), lv_color_hex(0x555555), 0);
          }
          // Time and date are two separate labels/widgets now, not one
          // combined string - real bug fixed (repo-owner: "das Datum
          // schiebt bei jedem Sekundenwechsel hin und her"): Montserrat's
          // digits aren't fixed-width (no tabular-figures rasterized
          // here), so the TIME portion's rendered pixel width wobbled by
          // a few px every second as its digits changed - and since the
          // date used to sit in the same string right after it, that
          // wobble visibly shifted the date left/right too, every
          // second, even though the date's own digits hadn't changed.
          // Two independently-positioned labels means each one's own
          // fixed x is unaffected by how wide the OTHER one renders.
          auto t = id(homeassistant_time).now();
          if (t.is_valid()) {
            lv_label_set_text(id(lbl_status_time), t.strftime("%H:%M:%S").c_str());
            lv_label_set_text(id(lbl_status_date), t.strftime("%d.%m.%Y").c_str());
          } else {
            lv_label_set_text(id(lbl_status_time), "--:--:--");
            lv_label_set_text(id(lbl_status_date), "--.--.----");
          }

          // ---- Inside temperature - HA-fed (Truma room sensor via
          // page_climate's own s_climate_room_temp), so it DOES need
          // api_is_connected() like every other HA value in this file.
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          char tbuf[16];
          if (api_ok && id(s_climate_room_temp).has_state()) {
            snprintf(tbuf, sizeof(tbuf), "IN %.0f°C", id(s_climate_room_temp).state);
            lv_label_set_text(id(lbl_status_temp_in), tbuf);
            lv_obj_set_style_text_color(id(lbl_status_temp_in), lv_color_hex(0xBDC1C6), 0);
          } else {
            lv_label_set_text(id(lbl_status_temp_in), "IN ---°C");
            lv_obj_set_style_text_color(id(lbl_status_temp_in), lv_color_hex(0x555555), 0);
          }

          // ---- Outside temperature - LOCAL NTC sensor (adc_temp_outside/
          // r_temp_outside/s_temp_outside above), NOT HA-fed - works
          // over the RS232 link's own local hardware regardless of
          // Wi-Fi/API state, same reasoning as the link-fed values on
          // page_home/page_electric. No api_ok guard on purpose.
          if (id(s_temp_outside).has_state()) {
            snprintf(tbuf, sizeof(tbuf), "OUT %.0f°C", id(s_temp_outside).state);
            lv_label_set_text(id(lbl_status_temp_out), tbuf);
            lv_obj_set_style_text_color(id(lbl_status_temp_out), lv_color_hex(0xBDC1C6), 0);
          } else {
            lv_label_set_text(id(lbl_status_temp_out), "OUT ---°C");
            lv_obj_set_style_text_color(id(lbl_status_temp_out), lv_color_hex(0x555555), 0);
          }

  # ---- Mainscreen (page_home) tiles -------------------------------------
  # design_rules.md §2's one-script-per-related-values pattern: all five
  # switch tiles are redrawn together rather than five separate lambdas
  # racing each other.
  - id: draw_home_tiles
    mode: restart
    then:
      - lambda: |-
          auto set_tile = [](lv_obj_t *lbl, bool on) {
            lv_label_set_text(lbl, on ? "ON" : "OFF");
            lv_obj_set_style_text_color(lbl,
                lv_color_hex(on ? 0x2ECC71 : 0xBDC1C6), 0);
          };
          set_tile(id(lbl_tile_12v), id(sw_12v_mirror).state);
          set_tile(id(lbl_tile_aux), id(sw_aux_mirror).state);
          set_tile(id(lbl_tile_light), id(sw_light_mirror).state);
          set_tile(id(lbl_tile_pump), id(sw_pump_mirror).state);
          set_tile(id(lbl_tile_eisex), id(sw_eisex_mirror).state);

  # ---- Electric / Victron-style overview (page_electric) ----------------
  # pages.md §5: "Victron-style power flow ... reuse [smartebl_display's
  # mockup] directly, don't redesign". Now wired to the REAL Victron
  # gear this installation has - a SmartShunt (battery monitor), a
  # MultiPlus (inverter/charger), and an MPPT solar charge controller -
  # via real HA entities confirmed by the repo owner (SmartShunt/
  # MultiPlus are the exact same ones m5dial_fram's page_power_1/2/3.yaml
  # already use; the MPPT and the GX device's DC-consumption figure are
  # new to this repo). Shore connected/disconnected still comes from
  # smartebl's own link (that detection is real, cheap, and already
  # wired) - every value box on this page now has a real source; none
  # of it is this repo's own smartebl-side guess anymore.
  - id: draw_electric
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_API
          bool api_ok = api_is_connected();
          #else
          bool api_ok = true;
          #endif
          bool connected = id(link_last_rx_ms) != 0 &&
              (millis() - id(link_last_rx_ms)) < 3000;
          char buf[32];

          // ---- Shore - connected/disconnected (small status line) still
          // comes from smartebl's own link; main/sub values come from
          // the MultiPlus (HA) any time THEY have state, independent of
          // link status - the AC meter is real regardless of whether
          // smartebl's own shore-detection circuit happens to be linked
          // right now. Main = input power, sub-left/right = input
          // voltage/frequency (repo-owner spec, replacing the old
          // W+A sub-line).
          if (!connected) {
            lv_label_set_text(id(lbl_electric_shore_status), "---");
            lv_obj_set_style_text_color(id(lbl_electric_shore_status), lv_color_hex(0x555555), 0);
          } else if (id(s_shore_power_connected).state) {
            lv_label_set_text(id(lbl_electric_shore_status), "CONNECTED");
            lv_obj_set_style_text_color(id(lbl_electric_shore_status), lv_color_hex(0x2ECC71), 0);
          } else {
            lv_label_set_text(id(lbl_electric_shore_status), "DISCONNECTED");
            lv_obj_set_style_text_color(id(lbl_electric_shore_status), lv_color_hex(0xBDC1C6), 0);
          }
          if (!api_ok || !id(s_multiplus_in_w).has_state()) {
            lv_label_set_text(id(lbl_electric_shore), "--- W");
            lv_obj_set_style_text_color(id(lbl_electric_shore), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "%.0fW", id(s_multiplus_in_w).state);
            lv_label_set_text(id(lbl_electric_shore), buf);
            lv_obj_set_style_text_color(id(lbl_electric_shore), lv_color_hex(0xFFFFFF), 0);
          }
          if (!api_ok || !id(s_multiplus_in_v).has_state()) {
            lv_label_set_text(id(lbl_electric_shore_sub_l), "---V");
          } else {
            snprintf(buf, sizeof(buf), "%.0fV", id(s_multiplus_in_v).state);
            lv_label_set_text(id(lbl_electric_shore_sub_l), buf);
          }
          if (!api_ok || !id(s_multiplus_in_hz).has_state()) {
            lv_label_set_text(id(lbl_electric_shore_sub_r), "---Hz");
          } else {
            snprintf(buf, sizeof(buf), "%.1fHz", id(s_multiplus_in_hz).state);
            lv_label_set_text(id(lbl_electric_shore_sub_r), buf);
          }

          // ---- Inverter/Charger (now a button - tap opens the mode/
          // limit popup, see show_charger_popup) - MultiPlus mode +
          // state, same colors/humanizing as
          // m5dial_fram/page_power_3.yaml's identical logic.
          if (!api_ok || !id(s_multiplus_mode).has_state()) {
            lv_label_set_text(id(lbl_electric_charger), "---");
            lv_obj_set_style_text_color(id(lbl_electric_charger), lv_color_hex(0x555555), 0);
          } else {
            std::string m = id(s_multiplus_mode).state;
            lv_label_set_text(id(lbl_electric_charger), m.c_str());
            uint32_t col = 0xBDC1C6;
            if (m == "ON") col = 0x2ECC71;
            else if (m == "CHG") col = 0x4A9EFF;
            else if (m == "INV") col = 0xF39C12;
            lv_obj_set_style_text_color(id(lbl_electric_charger), lv_color_hex(col), 0);
          }
          if (!api_ok || !id(s_multiplus_state).has_state()) {
            lv_label_set_text(id(lbl_electric_charger_sub), "---");
            lv_obj_set_style_text_color(id(lbl_electric_charger_sub), lv_color_hex(0x555555), 0);
          } else {
            std::string s = id(s_multiplus_state).state;
            for (auto &c : s) { if (c == '_') c = ' '; else c = ::toupper(c); }
            lv_label_set_text(id(lbl_electric_charger_sub), s.c_str());
            if (id(s_multiplus_state).state == "fault") {
              lv_obj_set_style_text_color(id(lbl_electric_charger_sub), lv_color_hex(0xE74C3C), 0);
            } else {
              lv_obj_set_style_text_color(id(lbl_electric_charger_sub), lv_color_hex(0x707070), 0);
            }
          }

          // ---- Inverter load bar - see the widget's own comment for
          // what this is a best-effort answer to. Same 1600W-nominal %
          // as AC Loads' own coloring below, computed once here since
          // both need it.
          {
            float load_pct = 0.0f;
            if (api_ok && id(s_multiplus_out_w).has_state()) {
              load_pct = id(s_multiplus_out_w).state / 1600.0f * 100.0f;
              if (load_pct < 0.0f) load_pct = 0.0f;
              if (load_pct > 100.0f) load_pct = 100.0f;
            }
            lv_bar_set_value(id(bar_electric_charger_load), (int) load_pct, LV_ANIM_OFF);
          }

          // ---- AC Loads - main = output power, sub-left/right = output
          // voltage/frequency (repo-owner spec, replacing the old %-of-
          // 1600W-nominal figure - that derived number is gone, this is
          // the MultiPlus's own real output power now). Coloring keeps
          // the same 80%/95%-of-1600W-nominal warning thresholds as
          // before (Multiplus 12/1600, same caveat m5dial_fram/
          // page_power_3.yaml's own comment carries: not exact, thermal
          // derating isn't tracked here) - just against the new sensor.
          // No state-line write here any more (repo-owner: the %-of-
          // 1600W figure duplicated what the Inverter/Charger box's own
          // load bar already shows) - `p` is still computed, only to
          // pick this label's own warning color at 80%/95% of nominal.
          if (!api_ok || !id(s_multiplus_out_w).has_state()) {
            lv_label_set_text(id(lbl_electric_ac_loads), "--- W");
            lv_obj_set_style_text_color(id(lbl_electric_ac_loads), lv_color_hex(0x555555), 0);
          } else {
            float w = id(s_multiplus_out_w).state;
            snprintf(buf, sizeof(buf), "%.0fW", w);
            lv_label_set_text(id(lbl_electric_ac_loads), buf);
            float p = w / 1600.0f * 100.0f;
            uint32_t col = 0xFFFFFF;
            if (p >= 95.0f) col = 0xE74C3C;
            else if (p >= 80.0f) col = 0xF39C12;
            lv_obj_set_style_text_color(id(lbl_electric_ac_loads), lv_color_hex(col), 0);
          }
          if (!api_ok || !id(s_multiplus_out_v).has_state()) {
            lv_label_set_text(id(lbl_electric_ac_loads_sub_l), "---V");
          } else {
            snprintf(buf, sizeof(buf), "%.0fV", id(s_multiplus_out_v).state);
            lv_label_set_text(id(lbl_electric_ac_loads_sub_l), buf);
          }
          if (!api_ok || !id(s_multiplus_out_hz).has_state()) {
            lv_label_set_text(id(lbl_electric_ac_loads_sub_r), "---Hz");
          } else {
            snprintf(buf, sizeof(buf), "%.1fHz", id(s_multiplus_out_hz).state);
            lv_label_set_text(id(lbl_electric_ac_loads_sub_r), buf);
          }

          // ---- Solar Yield (now a button - tap opens the mode/limit
          // popup, see show_solar_popup) - real MPPT charge controller.
          // Main = PV yield power, state line = humanized zustand
          // (restored - see lbl_electric_solar_state's own comment),
          // sub-left/right = the MPPT's own DC battery-bus voltage/
          // current (repo-owner spec).
          if (!api_ok || !id(s_mppt_pv_yield).has_state()) {
            lv_label_set_text(id(lbl_electric_solar), "--- W");
            lv_obj_set_style_text_color(id(lbl_electric_solar), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "%.0fW", id(s_mppt_pv_yield).state);
            lv_label_set_text(id(lbl_electric_solar), buf);
            lv_obj_set_style_text_color(id(lbl_electric_solar), lv_color_hex(0xFFFFFF), 0);
          }
          if (!api_ok || !id(s_mppt_zustand).has_state()) {
            lv_label_set_text(id(lbl_electric_solar_state), "---");
          } else {
            std::string s = id(s_mppt_zustand).state;
            for (auto &c : s) { if (c == '_') c = ' '; else c = ::toupper(c); }
            lv_label_set_text(id(lbl_electric_solar_state), s.c_str());
          }
          if (!api_ok || !id(s_mppt_batt_v).has_state()) {
            lv_label_set_text(id(lbl_electric_solar_sub_l), "---V");
          } else {
            snprintf(buf, sizeof(buf), "%.1fV", id(s_mppt_batt_v).state);
            lv_label_set_text(id(lbl_electric_solar_sub_l), buf);
          }
          if (!api_ok || !id(s_mppt_batt_a).has_state()) {
            lv_label_set_text(id(lbl_electric_solar_sub_r), "---A");
          } else {
            snprintf(buf, sizeof(buf), "%+.1fA", id(s_mppt_batt_a).state);
            lv_label_set_text(id(lbl_electric_solar_sub_r), buf);
          }

          // ---- Solar Yield popup - ON/OFF (switch.mppt_190w) + charge-
          // current limit, same shape as the Charger popup's mode/limit
          // pair below.
          bool mppt_known = api_ok && id(s_mppt_on).has_state();
          bool mppt_on = mppt_known && id(s_mppt_on).state;
          lv_obj_set_style_bg_color(id(btn_mppt_mode_on),
              lv_color_hex(mppt_on ? 0x1B5E3A : 0x202124), 0);
          lv_obj_set_style_border_color(id(btn_mppt_mode_on),
              lv_color_hex(mppt_on ? 0x2ECC71 : 0x3C4043), 0);
          lv_obj_set_style_bg_color(id(btn_mppt_mode_off),
              lv_color_hex(mppt_known && !mppt_on ? 0x4F3814 : 0x202124), 0);
          lv_obj_set_style_border_color(id(btn_mppt_mode_off),
              lv_color_hex(mppt_known && !mppt_on ? 0xF39C12 : 0x3C4043), 0);
          if (!api_ok || !id(s_mppt_limit).has_state()) {
            lv_label_set_text(id(lbl_mppt_limit), "LIMIT --A");
            lv_obj_set_style_text_color(id(lbl_mppt_limit), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "LIMIT %.0fA", id(g_mppt_limit_pending));
            lv_label_set_text(id(lbl_mppt_limit), buf);
            lv_obj_set_style_text_color(id(lbl_mppt_limit), lv_color_hex(0xBDC1C6), 0);
          }

          // ---- Battery popup - switch.fram_parkmodus, simple on/off.
          bool park_on = api_ok && id(s_fram_parkmodus_on).has_state() && id(s_fram_parkmodus_on).state;
          lv_label_set_text(id(lbl_park_state), park_on ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(lbl_park_state), lv_color_hex(park_on ? 0x2ECC71 : 0xBDC1C6), 0);
          lv_obj_set_style_bg_color(id(btn_park_toggle),
              lv_color_hex(park_on ? 0x1B5E3A : 0x202124), 0);
          lv_obj_set_style_border_color(id(btn_park_toggle),
              lv_color_hex(park_on ? 0x2ECC71 : 0x3C4043), 0);

          // ---- DC Loads - real GX device aggregate DC consumption
          // figure (see sensor: block's header comment) - not the
          // SmartShunt's net current already shown in the Battery box.
          if (!api_ok || !id(s_dc_loads).has_state()) {
            lv_label_set_text(id(lbl_electric_dc_loads), "--- W");
            lv_obj_set_style_text_color(id(lbl_electric_dc_loads), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "%.0fW", id(s_dc_loads).state);
            lv_label_set_text(id(lbl_electric_dc_loads), buf);
            lv_obj_set_style_text_color(id(lbl_electric_dc_loads), lv_color_hex(0xFFFFFF), 0);
          }

          // ---- Battery (emphasized box) - SmartShunt SOC, same
          // thresholds as m5dial_fram/page_power_1.yaml's identical
          // logic (20%/40% SOC).
          if (!api_ok || !id(s_battery_soc).has_state()) {
            lv_label_set_text(id(lbl_electric_batt_main), "---%");
            lv_obj_set_style_text_color(id(lbl_electric_batt_main), lv_color_hex(0x555555), 0);
          } else {
            float soc = id(s_battery_soc).state;
            snprintf(buf, sizeof(buf), "%.0f%%", soc);
            lv_label_set_text(id(lbl_electric_batt_main), buf);
            uint32_t col = 0xFFFFFF;
            if (soc < 20.0f) col = 0xE74C3C;
            else if (soc < 40.0f) col = 0xF39C12;
            lv_obj_set_style_text_color(id(lbl_electric_batt_main), lv_color_hex(col), 0);
          }

          // ---- IDLE/CHARGING/DISCHARGING - interpreted from the
          // SmartShunt's own net DC current (repo-owner spec): positive
          // charges the battery, negative discharges it, anything
          // inside the shunt's own noise floor (+-0.5A) counts as IDLE.
          std::string batt_state = "---";
          uint32_t batt_state_col = 0x555555;
          bool discharging = false;
          if (api_ok && id(s_battery_dc_a).has_state()) {
            float a = id(s_battery_dc_a).state;
            if (a > 0.5f) {
              batt_state = "CHARGING";
              batt_state_col = 0x2ECC71;
            } else if (a < -0.5f) {
              batt_state = "DISCHARGING";
              batt_state_col = 0xF39C12;
              discharging = true;
            } else {
              batt_state = "IDLE";
              batt_state_col = 0xBDC1C6;
            }
          }
          lv_label_set_text(id(lbl_electric_batt_state), batt_state.c_str());
          lv_obj_set_style_text_color(id(lbl_electric_batt_state), lv_color_hex(batt_state_col), 0);

          // Remaining time only means anything while discharging -
          // Victron's own "time to go" sensor is huge/undefined while
          // charging, so it's blanked rather than showing a
          // meaningless number the rest of the time.
          if (discharging && api_ok && id(s_battery_remaining_time).has_state()) {
            int mins = (int) id(s_battery_remaining_time).state;
            snprintf(buf, sizeof(buf), "NOCH %dh%02dm", mins / 60, mins % 60);
            lv_label_set_text(id(lbl_electric_batt_time), buf);
            lv_obj_set_style_text_color(id(lbl_electric_batt_time), lv_color_hex(0xBDC1C6), 0);
          } else {
            lv_label_set_text(id(lbl_electric_batt_time), "");
          }

          // ---- Bottom row: DC bus V / A / W (repo-owner spec: left /
          // middle / right, one value each - replaces the old combined
          // "V  A" mid-line).
          if (!api_ok || !id(s_battery_dc_v).has_state()) {
            lv_label_set_text(id(lbl_electric_batt_v), "---V");
            lv_obj_set_style_text_color(id(lbl_electric_batt_v), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "%.1fV", id(s_battery_dc_v).state);
            lv_label_set_text(id(lbl_electric_batt_v), buf);
            lv_obj_set_style_text_color(id(lbl_electric_batt_v), lv_color_hex(0xBDC1C6), 0);
          }
          if (!api_ok || !id(s_battery_dc_a).has_state()) {
            lv_label_set_text(id(lbl_electric_batt_a), "---A");
            lv_obj_set_style_text_color(id(lbl_electric_batt_a), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "%+.0fA", id(s_battery_dc_a).state);
            lv_label_set_text(id(lbl_electric_batt_a), buf);
            lv_obj_set_style_text_color(id(lbl_electric_batt_a), lv_color_hex(0xBDC1C6), 0);
          }
          if (!api_ok || !id(s_battery_power).has_state()) {
            lv_label_set_text(id(lbl_electric_batt_w), "---W");
            lv_obj_set_style_text_color(id(lbl_electric_batt_w), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "%+.0fW", id(s_battery_power).state);
            lv_label_set_text(id(lbl_electric_batt_w), buf);
            lv_obj_set_style_text_color(id(lbl_electric_batt_w), lv_color_hex(0xBDC1C6), 0);
          }

          // Starter battery voltage stays smartebl's own link reading (a
          // separate real sensor smartebl has - the SmartShunt only
          // monitors the leisure battery) at the very bottom of the box.
          if (!connected) {
            lv_label_set_text(id(lbl_electric_batt_sub), "START ---V");
            lv_obj_set_style_text_color(id(lbl_electric_batt_sub), lv_color_hex(0x555555), 0);
          } else {
            float start_v = id(s_starter_battery_voltage).state;
            snprintf(buf, sizeof(buf), "START %.2fV", start_v);
            lv_label_set_text(id(lbl_electric_batt_sub), buf);
            uint32_t col = 0xBDC1C6;
            if (start_v < 12.0f) col = 0xE74C3C;
            else if (start_v < 12.4f) col = 0xF39C12;
            lv_obj_set_style_text_color(id(lbl_electric_batt_sub), lv_color_hex(col), 0);
          }

          // ---- Flow-direction arrows - replaces the old 300ms-
          // interval walking animation (repo-owner: "braucht das viel
          // Leistung?" - and even if it doesn't, a real power-flow
          // topology only has 3 meaningful states per connection: `→`
          // this direction, `←` the other, or `-` nothing flowing).
          // Updated here, once per draw_electric call (i.e. only when
          // the underlying HA values actually change), not on a timer -
          // a real redraw-cost saving, not just a simpler readout.
          //
          // Four of these five connections are physically one-
          // directional in this topology - mains, the inverter's own
          // AC output, solar, and DC loads are all a pure source or a
          // pure sink, never both - so they only ever need forward/dash,
          // not a reverse arrow. Small threshold (5W) rather than >0 so
          // sensor noise at true idle doesn't flicker the arrow.
          auto set_flow = [&](lv_obj_t *arrow, bool has_state, float watts) {
            lv_label_set_text(arrow, (has_state && watts > 5.0f) ? "→" : "-");
          };
          set_flow(id(arrow_shore_charger), api_ok && id(s_multiplus_in_w).has_state(),
              api_ok && id(s_multiplus_in_w).has_state() ? id(s_multiplus_in_w).state : 0.0f);
          set_flow(id(arrow_charger_acloads), api_ok && id(s_multiplus_out_w).has_state(),
              api_ok && id(s_multiplus_out_w).has_state() ? id(s_multiplus_out_w).state : 0.0f);
          set_flow(id(arrow_solar_battery), api_ok && id(s_mppt_pv_yield).has_state(),
              api_ok && id(s_mppt_pv_yield).has_state() ? id(s_mppt_pv_yield).state : 0.0f);
          set_flow(id(arrow_battery_dcloads), api_ok && id(s_dc_loads).has_state(),
              api_ok && id(s_dc_loads).has_state() ? id(s_dc_loads).state : 0.0f);

          // The Charger<->Battery link is the one connection that
          // really reverses: charging pulls energy DOWN from the
          // charger/solar side into the battery, discharging pushes it
          // back UP through the inverter to the AC loads. Reuses the
          // exact same IDLE/CHARGING/DISCHARGING classification as the
          // Battery box itself (computed above) rather than a second,
          // possibly-disagreeing threshold on the same current sensor.
          if (batt_state == "CHARGING") {
            lv_label_set_text(id(arrow_row_down), "↓");
          } else if (batt_state == "DISCHARGING") {
            lv_label_set_text(id(arrow_row_down), "↑");
          } else {
            lv_label_set_text(id(arrow_row_down), "-");
          }

          // ---- Charger/Inverter popup (hidden unless open, see
          // show_charger_popup/close_charger_popup) - mode buttons'
          // highlight + shore-limit value, redrawn here too so opening
          // the popup never shows stale content.
          std::string cur_mode = api_ok && id(s_multiplus_mode).has_state() ? id(s_multiplus_mode).state : "";
          auto mode_btn = [&](lv_obj_t *btn, const char *tag, uint32_t on_bg, uint32_t on_border) {
            bool active = (cur_mode == tag);
            lv_obj_set_style_bg_color(btn, lv_color_hex(active ? on_bg : 0x202124), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(active ? on_border : 0x3C4043), 0);
          };
          mode_btn(id(btn_multiplus_mode_on), "ON", 0x1B5E3A, 0x2ECC71);
          mode_btn(id(btn_multiplus_mode_chg), "CHG", 0x14324F, 0x4A9EFF);
          mode_btn(id(btn_multiplus_mode_inv), "INV", 0x4F3814, 0xF39C12);
          // Real bug fixed: this used to pass the SAME colors as the
          // "inactive" style (0x202124/0x3C4043) for OFF's own "active"
          // case, so the OFF button never visibly highlighted when it
          // was in fact the current mode.
          mode_btn(id(btn_multiplus_mode_off), "OFF", 0x3C4043, 0xBDC1C6);

          if (!api_ok || !id(s_multiplus_limit).has_state()) {
            lv_label_set_text(id(lbl_multiplus_limit), "LIMIT --A");
            lv_obj_set_style_text_color(id(lbl_multiplus_limit), lv_color_hex(0x555555), 0);
          } else {
            snprintf(buf, sizeof(buf), "LIMIT %.0fA", id(g_multiplus_limit_pending));
            lv_label_set_text(id(lbl_multiplus_limit), buf);
            lv_obj_set_style_text_color(id(lbl_multiplus_limit), lv_color_hex(0xBDC1C6), 0);
          }

  # ---- Electric page (page_electric) - MultiPlus mode/shore-limit popup
  # Triggered from the Inverter/Charger box (btn_electric_charger).
  - id: poll_electric
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_ladestand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_dc_bus_spannung
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_dc_bus_stromstarke
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_verbleibende_zeit
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_leistung
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_eingangsleistung_l1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_eingangsspannung_l1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_eingangsfrequenz_l1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_ausgangsleistung_l1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_ausgangsspannung_l1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_ausgangsfrequenz_l1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.multiplus_zustand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: select.multiplus
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: number.multiplus_strombegrenzung
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mppt_190w_leistung_pv_ertrag
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mppt_190w_zustand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mppt_190w_dc_batterie_bus_spannung
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mppt_190w_dc_batterie_bus_stromstarke
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: number.mppt_190w_stromstarke
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.mppt_190w
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.gx_device_dc_verbrauch
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.fram_parkmodus

  - id: show_charger_popup
    then:
      - lambda: |-
          id(g_multiplus_limit_pending) = id(s_multiplus_limit).has_state()
              ? id(s_multiplus_limit).state : 0.0f;
      - script.execute: draw_electric
      - lvgl.widget.update:
          id: obj_electric_popup_backdrop
          hidden: false
      - lvgl.widget.update:
          id: obj_electric_popup_panel
          hidden: false

  - id: close_charger_popup
    then:
      - lvgl.widget.update:
          id: obj_electric_popup_backdrop
          hidden: true
      - lvgl.widget.update:
          id: obj_electric_popup_panel
          hidden: true

  # Direct-set, not a cycle (unlike m5dial_fram/page_power_3.yaml's
  # single ON->CHG->INV->OFF button - this popup has room for four
  # separate buttons, one per real option of select.multiplus, so
  # picking any mode is one tap instead of up to three).
  - id: act_multiplus_set_mode
    parameters:
      option: string
    then:
      - homeassistant.service:
          service: select.select_option
          data:
            entity_id: select.multiplus
          data_template:
            option: "{{ opt }}"
          variables:
            opt: !lambda "return option;"

  # 1A step, clamped 0-16A - same real-world wiring ceiling
  # m5dial_fram/page_power_2.yaml's identical control uses for this
  # installation's 2.5mm² shore cable (not number.multiplus_
  # strombegrenzung's own 0-63A range).
  - id: act_multiplus_limit_up
    then:
      - lambda: |-
          float v = id(g_multiplus_limit_pending) + 1.0f;
          if (v > 16.0f) v = 16.0f;
          id(g_multiplus_limit_pending) = v;
      - script.execute: draw_electric
      - script.execute: multiplus_limit_write_debounced

  - id: act_multiplus_limit_down
    then:
      - lambda: |-
          float v = id(g_multiplus_limit_pending) - 1.0f;
          if (v < 0.0f) v = 0.0f;
          id(g_multiplus_limit_pending) = v;
      - script.execute: draw_electric
      - script.execute: multiplus_limit_write_debounced

  - id: multiplus_limit_write_now
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.multiplus_strombegrenzung
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_multiplus_limit_pending));"

  - id: multiplus_limit_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: multiplus_limit_write_now

  # ---- Solar Yield popup (obj_solar_popup_panel) - ON/OFF (switch.
  # mppt_190w) + charge-current limit (number.mppt_190w_stromstarke),
  # same backdrop/panel/debounced-write shapes as the Charger popup
  # above, just with 2 mode buttons instead of 4.
  - id: show_solar_popup
    then:
      - lambda: |-
          id(g_mppt_limit_pending) = id(s_mppt_limit).has_state()
              ? id(s_mppt_limit).state : 0.0f;
      - script.execute: draw_electric
      - lvgl.widget.update: {id: obj_solar_popup_backdrop, hidden: false}
      - lvgl.widget.update: {id: obj_solar_popup_panel, hidden: false}

  - id: close_solar_popup
    then:
      - lvgl.widget.update: {id: obj_solar_popup_backdrop, hidden: true}
      - lvgl.widget.update: {id: obj_solar_popup_panel, hidden: true}

  - id: act_mppt_toggle
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.mppt_190w

  - id: act_mppt_limit_up
    then:
      - lambda: |-
          float v = id(g_mppt_limit_pending) + 1.0f;
          if (v > 20.0f) v = 20.0f;  // see s_mppt_limit's own comment
          id(g_mppt_limit_pending) = v;
      - script.execute: draw_electric
      - script.execute: mppt_limit_write_debounced

  - id: act_mppt_limit_down
    then:
      - lambda: |-
          float v = id(g_mppt_limit_pending) - 1.0f;
          if (v < 0.0f) v = 0.0f;
          id(g_mppt_limit_pending) = v;
      - script.execute: draw_electric
      - script.execute: mppt_limit_write_debounced

  - id: mppt_limit_write_now
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.mppt_190w_stromstarke
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_mppt_limit_pending));"

  - id: mppt_limit_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: mppt_limit_write_now

  # ---- Battery popup (obj_battery_popup_panel) - switch.fram_parkmodus
  # only, a single toggle rather than a mode picker - simple on/off.
  - id: show_battery_popup
    then:
      - script.execute: draw_electric
      - lvgl.widget.update: {id: obj_battery_popup_backdrop, hidden: false}
      - lvgl.widget.update: {id: obj_battery_popup_panel, hidden: false}

  - id: close_battery_popup
    then:
      - lvgl.widget.update: {id: obj_battery_popup_backdrop, hidden: true}
      - lvgl.widget.update: {id: obj_battery_popup_panel, hidden: true}

  - id: act_park_toggle
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.fram_parkmodus

  # ---- Climate (page_climate) --------------------------------------------
  # pages.md §5: Truma Combi 4 room-heating side, via the
  # womolin_controller MQTT integration - "same entities
  # m5dial_fram/page_climate.yaml already uses". Data source is HA over
  # Wi-Fi (api:), NOT the RS232 link - unlike page_home/page_electric.
  #
  # Adapted from that page for a touchscreen rather than a rotary
  # encoder: no arm/disarm "SET then turn the knob" step (there's no
  # knob to fight over with page navigation on this device) - the +/-
  # buttons write directly, debounced the same way. That's the only
  # real difference; the optimistic-heater-toggle and invalid-value
  # handling are carried over unchanged.
  - id: poll_climate
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: climate.womolin_controller_mqtt_truma_room
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.womolin_controller_mqtt_activate_room_heater
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.womolin_controller_mqtt_room_heater_active
      - script.execute: poll_truma_status

  # Shared Truma status/error - see sensor: block's header comment.
  # Called from both poll_climate and poll_boiler; the extra calls are
  # cheap and this way neither page depends on the other having loaded
  # first (m5dial_fram/design_rules.md §9's own reasoning for polling
  # unconditionally rather than guessing what's "probably already
  # fresh").
  - id: poll_truma_status
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.womolin_controller_mqtt_heater_has_error
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.womolin_controller_mqtt_cp_plus_alive
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.womolin_controller_mqtt_operating_status

  - id: act_climate_heater
    then:
      - lambda: |-
          bool cur = id(g_climate_heater_optimistic_valid)
              ? id(g_climate_heater_optimistic)
              : (id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state);
          id(g_climate_heater_optimistic) = !cur;
          id(g_climate_heater_optimistic_valid) = true;
      - script.execute: draw_climate
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.womolin_controller_mqtt_activate_room_heater

  # 1°C step, clamped 5-30 - confirmed real (climate.womolin_controller_
  # mqtt_truma_room's own min_temp/max_temp/target_temp_step attributes,
  # not a guess anymore).
  - id: act_climate_temp_up
    then:
      - lambda: |-
          float v = id(g_climate_temp_pending) + 1.0f;
          if (v > 30.0f) v = 30.0f;
          id(g_climate_temp_pending) = v;
          id(g_climate_temp_known) = true;
      - script.execute: draw_climate
      - script.execute: climate_temp_write_debounced

  - id: act_climate_temp_down
    then:
      - lambda: |-
          float v = id(g_climate_temp_pending) - 1.0f;
          if (v < 5.0f) v = 5.0f;
          id(g_climate_temp_pending) = v;
          id(g_climate_temp_known) = true;
      - script.execute: draw_climate
      - script.execute: climate_temp_write_debounced

  - id: climate_temp_write_now
    then:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.womolin_controller_mqtt_truma_room
          data_template:
            temperature: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_climate_temp_pending));"

  - id: climate_temp_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: climate_temp_write_now

  # ---- Fan level (Lüfterstufe) - tap-to-cycle through the confirmed
  # real fan_modes (off/low/medium/high), same single-button-cycle
  # shape as m5dial_fram/page_power_3.yaml's MODE button (ON->CHG->INV
  # ->OFF) rather than a 4-button popup - four fan speeds fit fine in
  # one tap-through button, and there's less room on this half of the
  # page than the Electric popup has to spare.
  - id: act_climate_fan_cycle
    then:
      - homeassistant.service:
          service: climate.set_fan_mode
          data:
            entity_id: climate.womolin_controller_mqtt_truma_room
          data_template:
            fan_mode: "{{ mode }}"
          variables:
            mode: !lambda |-
              std::string m = id(s_climate_fan_mode).has_state() ? id(s_climate_fan_mode).state : "off";
              if (m == "off") return std::string("low");
              if (m == "low") return std::string("medium");
              if (m == "medium") return std::string("high");
              return std::string("off");

  - id: draw_climate
    mode: restart
    then:
      # ---- Arc: room temp as % of a 5-30°C range - same "arc is always
      # a percentage of a sensible range" rule m5dial_fram/design_rules.md
      # §8 uses (there's no natural 0-100% for a temperature otherwise).
      # 5/30 matches act_climate_temp_up/down's own existing clamp, so
      # the arc and the +/- buttons agree on what "full range" means.
      - lvgl.arc.update:
          id: arc_climate_temp
          value: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return 0.0f;
            #endif
            if (!id(s_climate_room_temp).has_state()) return 0.0f;
            float p = (id(s_climate_room_temp).state - 5.0f) / (30.0f - 5.0f) * 100.0f;
            if (p > 100.0f) p = 100.0f;
            if (p < 0.0f) p = 0.0f;
            return p;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_climate_room_temp).has_state()) return lv_color_hex(0x555555);
              return lv_color_hex(0x4A9EFF);

      - lvgl.label.update:
          id: lbl_climate_temp
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---°C");
            #endif
            if (!id(s_climate_room_temp).has_state()) return std::string("---°C");
            return str_sprintf("%.0f°C", id(s_climate_room_temp).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_climate_room_temp).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);

      - lvgl.label.update:
          id: lbl_climate_target
          # Two lines ("SOLL" / "nn°C", see the widget's own comment) -
          # both branches below keep that same two-line shape so the
          # label's height never jumps between states.
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("SOLL\n---°C");
            #endif
            if (!id(g_climate_temp_known)) return std::string("SOLL\n---°C");
            return str_sprintf("SOLL\n%.0f°C", id(g_climate_temp_pending));
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(g_climate_temp_known)) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      - lvgl.label.update:
          id: lbl_climate_heater
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("HEIZ ---");
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? std::string("HEIZ EIN") : std::string("HEIZ AUS");
            }
            if (!id(s_climate_heater_on).has_state()) return std::string("HEIZ ---");
            return id(s_climate_heater_on).state ? std::string("HEIZ EIN")
                                          : std::string("HEIZ AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xBDC1C6);
            }
            if (!id(s_climate_heater_on).has_state()) return lv_color_hex(0x555555);
            return id(s_climate_heater_on).state ? lv_color_hex(0x2ECC71)
                                          : lv_color_hex(0xBDC1C6);

      - lvgl.widget.update:
          id: btn_climate_heater
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? lv_color_hex(0x1B5E3A) : lv_color_hex(0x202124);
            }
            if (!id(s_climate_heater_on).has_state()) return lv_color_hex(0x202124);
            return id(s_climate_heater_on).state ? lv_color_hex(0x1B5E3A)
                                          : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0x3C4043);
            }
            if (!id(s_climate_heater_on).has_state()) return lv_color_hex(0x3C4043);
            return id(s_climate_heater_on).state ? lv_color_hex(0x2ECC71)
                                          : lv_color_hex(0x3C4043);

      # ---- "Actually heating" indicator - distinct from the button
      # above, which reflects the on/off gate, not whether the Truma
      # is really running right now.
      - lambda: |-
          #ifdef USE_API
          if (!api_is_connected()) {
            lv_label_set_text(id(lbl_climate_active), "AKTIV ---");
            lv_obj_set_style_text_color(id(lbl_climate_active), lv_color_hex(0x555555), 0);
          } else
          #endif
          if (!id(s_climate_heater_active).has_state()) {
            lv_label_set_text(id(lbl_climate_active), "AKTIV ---");
            lv_obj_set_style_text_color(id(lbl_climate_active), lv_color_hex(0x555555), 0);
          } else if (id(s_climate_heater_active).state) {
            lv_label_set_text(id(lbl_climate_active), "AKTIV JA");
            lv_obj_set_style_text_color(id(lbl_climate_active), lv_color_hex(0x2ECC71), 0);
          } else {
            lv_label_set_text(id(lbl_climate_active), "AKTIV NEIN");
            lv_obj_set_style_text_color(id(lbl_climate_active), lv_color_hex(0x707070), 0);
          }

      # ---- Fan level (Lüfterstufe) - tap-to-cycle, see
      # act_climate_fan_cycle's own comment.
      - lambda: |-
          #ifdef USE_API
          if (!api_is_connected()) {
            lv_label_set_text(id(lbl_climate_fan_mode), "LÜFTER ---");
            lv_obj_set_style_text_color(id(lbl_climate_fan_mode), lv_color_hex(0x555555), 0);
          } else
          #endif
          if (!id(s_climate_fan_mode).has_state()) {
            lv_label_set_text(id(lbl_climate_fan_mode), "LÜFTER ---");
            lv_obj_set_style_text_color(id(lbl_climate_fan_mode), lv_color_hex(0x555555), 0);
          } else {
            std::string m = id(s_climate_fan_mode).state;
            std::string disp = m;
            for (auto &c : disp) c = ::toupper(c);
            lv_label_set_text(id(lbl_climate_fan_mode), ("LÜFTER " + disp).c_str());
            lv_obj_set_style_text_color(id(lbl_climate_fan_mode),
                lv_color_hex(m == "off" ? 0xBDC1C6 : 0x4A9EFF), 0);
          }

      # ---- Truma status/error footer - shared unit, see sensor: block's
      # header comment. Priority: error > CP Plus not connected >
      # operating status/heating mode > empty.
      - lambda: |-
          #ifdef USE_API
          if (!api_is_connected()) {
            lv_label_set_text(id(lbl_truma_status), "KEINE VERBINDUNG");
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0x555555), 0);
            return;
          }
          #endif
          if (id(s_truma_has_error).has_state() && id(s_truma_has_error).state) {
            std::string code = id(s_truma_error_code).has_state() ? id(s_truma_error_code).state : "?";
            lv_label_set_text(id(lbl_truma_status), ("FEHLER " + code).c_str());
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0xE74C3C), 0);
          } else if (id(s_truma_cp_plus_alive).has_state() && !id(s_truma_cp_plus_alive).state) {
            lv_label_set_text(id(lbl_truma_status), "TRUMA NICHT VERBUNDEN");
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0xF39C12), 0);
          } else if (id(s_truma_operating_status).has_state()) {
            std::string txt = id(s_truma_operating_status).state;
            if (id(s_truma_heating_mode).has_state()) txt += " / " + id(s_truma_heating_mode).state;
            lv_label_set_text(id(lbl_truma_status), txt.c_str());
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0x707070), 0);
          } else {
            lv_label_set_text(id(lbl_truma_status), "");
          }

  # ---- Boiler (page_boiler) ----------------------------------------------
  # Water-heating side of the same Truma Combi 4 as Climate, same
  # womolin_controller integration, same touch-adapted +/- shape - but
  # NOT continuously adjustable: this Truma boiler only actually has
  # three fixed levels, ECO (40°C) / an unnamed middle one (60°C, name
  # TBD - ask before labelling it, don't guess) / BOOST (80°C), same as
  # m5dial_fram/page_boiler.yaml's own act_boiler_temp_up/down - copied
  # verbatim rather than re-derived.
  - id: poll_boiler
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: climate.womolin_controller_mqtt_truma_water
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.womolin_controller_mqtt_activate_water_heater
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.womolin_controller_mqtt_water_heater_active
      - script.execute: poll_truma_status

  - id: act_boiler_heater
    then:
      - lambda: |-
          bool cur = id(g_boiler_heater_optimistic_valid)
              ? id(g_boiler_heater_optimistic)
              : (id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state);
          id(g_boiler_heater_optimistic) = !cur;
          id(g_boiler_heater_optimistic_valid) = true;
      - script.execute: draw_boiler
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.womolin_controller_mqtt_activate_water_heater

  # Steps between exactly 40/60/80, never in between - sending a value
  # off this Truma's three real levels would either get silently
  # clamped or just not correspond to anything the physical panel can
  # select.
  - id: act_boiler_temp_up
    then:
      - lambda: |-
          float v = id(g_boiler_temp_pending);
          if (v < 60.0f) v = 60.0f;
          else v = 80.0f;
          id(g_boiler_temp_pending) = v;
          id(g_boiler_temp_known) = true;
      - script.execute: draw_boiler
      - script.execute: boiler_temp_write_debounced

  - id: act_boiler_temp_down
    then:
      - lambda: |-
          float v = id(g_boiler_temp_pending);
          if (v > 60.0f) v = 60.0f;
          else v = 40.0f;
          id(g_boiler_temp_pending) = v;
          id(g_boiler_temp_known) = true;
      - script.execute: draw_boiler
      - script.execute: boiler_temp_write_debounced

  - id: boiler_temp_write_now
    then:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.womolin_controller_mqtt_truma_water
          data_template:
            temperature: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_boiler_temp_pending));"

  - id: boiler_temp_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: boiler_temp_write_now

  - id: draw_boiler
    mode: restart
    then:
      # ---- Arc: water temp as % of the 40-80°C range this Truma
      # boiler's three fixed tiers span - same reasoning as
      # arc_climate_temp above.
      - lvgl.arc.update:
          id: arc_boiler_temp
          value: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return 0.0f;
            #endif
            if (!id(s_boiler_temp).has_state()) return 0.0f;
            float p = (id(s_boiler_temp).state - 40.0f) / (80.0f - 40.0f) * 100.0f;
            if (p > 100.0f) p = 100.0f;
            if (p < 0.0f) p = 0.0f;
            return p;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_boiler_temp).has_state()) return lv_color_hex(0x555555);
              return lv_color_hex(0x4A9EFF);

      - lvgl.label.update:
          id: lbl_boiler_temp
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---°C");
            #endif
            if (!id(s_boiler_temp).has_state()) return std::string("---°C");
            return str_sprintf("%.0f°C", id(s_boiler_temp).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_boiler_temp).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);

      - lvgl.label.update:
          id: lbl_boiler_target
          # Same two-line "SOLL" / "nn°C" shape as lbl_climate_target - the
          # ECO/BOOST tag (this Truma boiler's fixed tiers, see
          # act_boiler_temp_up/down) gets its own third line rather than
          # being crammed onto the value line, which doesn't fit "80°C
          # BOOST" in the 100px gap between the +/- buttons.
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("SOLL\n---°C");
            #endif
            if (!id(g_boiler_temp_known)) return std::string("SOLL\n---°C");
            float v = id(g_boiler_temp_pending);
            std::string tag = (v <= 40.0f) ? "\nECO" : (v >= 80.0f) ? "\nBOOST" : "";
            return str_sprintf("SOLL\n%.0f°C", v) + tag;
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(g_boiler_temp_known)) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      - lvgl.label.update:
          id: lbl_boiler_heater
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("BOILER ---");
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? std::string("BOILER EIN") : std::string("BOILER AUS");
            }
            if (!id(s_boiler_heater_on).has_state()) return std::string("BOILER ---");
            return id(s_boiler_heater_on).state ? std::string("BOILER EIN")
                                         : std::string("BOILER AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xBDC1C6);
            }
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x555555);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x2ECC71)
                                         : lv_color_hex(0xBDC1C6);

      - lvgl.widget.update:
          id: btn_boiler_heater
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? lv_color_hex(0x1B5E3A) : lv_color_hex(0x202124);
            }
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x202124);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x1B5E3A)
                                         : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0x3C4043);
            }
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x3C4043);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x2ECC71)
                                         : lv_color_hex(0x3C4043);

      # ---- "Actually heating" indicator - see draw_climate's identical
      # block for why this is separate from the button's own state.
      - lambda: |-
          #ifdef USE_API
          if (!api_is_connected()) {
            lv_label_set_text(id(lbl_boiler_active), "AKTIV ---");
            lv_obj_set_style_text_color(id(lbl_boiler_active), lv_color_hex(0x555555), 0);
          } else
          #endif
          if (!id(s_boiler_heater_active).has_state()) {
            lv_label_set_text(id(lbl_boiler_active), "AKTIV ---");
            lv_obj_set_style_text_color(id(lbl_boiler_active), lv_color_hex(0x555555), 0);
          } else if (id(s_boiler_heater_active).state) {
            lv_label_set_text(id(lbl_boiler_active), "AKTIV JA");
            lv_obj_set_style_text_color(id(lbl_boiler_active), lv_color_hex(0x2ECC71), 0);
          } else {
            lv_label_set_text(id(lbl_boiler_active), "AKTIV NEIN");
            lv_obj_set_style_text_color(id(lbl_boiler_active), lv_color_hex(0x707070), 0);
          }

      # ---- Truma status/error footer - same shared unit/logic as
      # draw_climate's identical block (see sensor: block's header
      # comment for why there's no room/water split here).
      - lambda: |-
          #ifdef USE_API
          if (!api_is_connected()) {
            lv_label_set_text(id(lbl_truma_status), "KEINE VERBINDUNG");
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0x555555), 0);
            return;
          }
          #endif
          if (id(s_truma_has_error).has_state() && id(s_truma_has_error).state) {
            std::string code = id(s_truma_error_code).has_state() ? id(s_truma_error_code).state : "?";
            lv_label_set_text(id(lbl_truma_status), ("FEHLER " + code).c_str());
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0xE74C3C), 0);
          } else if (id(s_truma_cp_plus_alive).has_state() && !id(s_truma_cp_plus_alive).state) {
            lv_label_set_text(id(lbl_truma_status), "TRUMA NICHT VERBUNDEN");
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0xF39C12), 0);
          } else if (id(s_truma_operating_status).has_state()) {
            std::string txt = id(s_truma_operating_status).state;
            if (id(s_truma_heating_mode).has_state()) txt += " / " + id(s_truma_heating_mode).state;
            lv_label_set_text(id(lbl_truma_status), txt.c_str());
            lv_obj_set_style_text_color(id(lbl_truma_status), lv_color_hex(0x707070), 0);
          } else {
            lv_label_set_text(id(lbl_truma_status), "");
          }

# =============================================================================
# LVGL - Mainscreen, Electric (Victron-style), Climate, Boiler
# =============================================================================
# rotation: 90 - mounting orientation decided (landscape), resolving
# design_rules.md §4's first open item. Canvas is 1280x800 - see the
# layout-grid substitutions at the top of this file.
#
# top_layer carries the status bar and left nav rail: both are
# persistent on every page per pages.md §2/§4, and LVGL's top_layer is
# exactly ESPHome's mechanism for "drawn once, shown on top of whatever
# page is active" (the same mechanism m5dial_fram uses for its
# overlays). The quick-switch popup (pages.md §3) is NOT built yet -
# this release's switch tiles live directly on the Mainscreen instead
# (pages.md §6), which covers the same controls without the popup
# infrastructure; add the popup when a page without room for it exists.

lvgl:
  id: lvgl_main
  displays:
    - disp_main
  touchscreens:
    - touch_main
  rotation: 90
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
  top_layer:
    widgets:
      # ---- Status bar (y 0-64, full width) ----
      - label:
          id: lbl_status_time
          align: TOP_LEFT
          x: 20
          y: 20
          text_font: font_ui_24
          text: "--:--:--"
          text_color: 0xBDC1C6
      # Own fixed x (independent of the time label's own width) - see
      # draw_status_bar's comment for the jitter this fixes. 200: clear
      # of "--:--:--"/any real time's widest rendering at font_ui_24
      # (well under 150px) with margin, well before lbl_status_temp_in
      # (~x470, TOP_MID x=-170 on a 1280px-wide bar).
      - label:
          id: lbl_status_date
          align: TOP_LEFT
          x: 200
          y: 20
          text_font: font_ui_24
          text: "--.--.----"
          text_color: 0xBDC1C6
      - label:
          id: lbl_status_temp_in
          align: TOP_MID
          x: -170
          y: 22
          text_font: font_ui_16
          text: "IN ---°C"
          text_color: 0x555555
      - label:
          id: lbl_status_temp_out
          align: TOP_MID
          x: -30
          y: 22
          text_font: font_ui_16
          text: "OUT ---°C"
          text_color: 0x555555
      - button:
          id: btn_daynight_toggle
          align: TOP_RIGHT
          x: -220
          y: 14
          width: 90
          height: 36
          radius: 8
          bg_color: 0x202124
          border_width: 1
          border_color: 0x3C4043
          shadow_width: 0
          widgets:
            - label:
                id: lbl_daynight_toggle
                align: CENTER
                text: "AUTO"
                text_font: font_ui_16
                text_color: 0xBDC1C6
          on_click:
            # Used to cycle AUTO->DAY->NIGHT in place - now opens the
            # brightness/day-night popup pages.md §4 always wanted
            # (see show_daynight_popup/draw_daynight_popup above).
            - script.execute: show_daynight_popup
      - button:
          id: btn_sleep_now
          align: TOP_RIGHT
          x: -320
          y: 14
          width: 90
          height: 36
          radius: 8
          bg_color: 0x202124
          border_width: 1
          border_color: 0x3C4043
          shadow_width: 0
          widgets:
            - label:
                align: CENTER
                text: "SLEEP"
                text_font: font_ui_16
                text_color: 0xBDC1C6
          on_click:
            - script.execute: toggle_sleep_manual
      - label:
          id: lbl_status_link
          align: TOP_RIGHT
          x: -20
          y: 24
          text_font: font_ui_16
          text: "NO LINK"
          text_color: 0x555555
      - obj:
          id: obj_statusbar_rule
          align: TOP_LEFT
          x: 0
          y: 63 # = bar_h - 1
          width: ${screen_w}
          height: 1
          bg_color: 0x3C4043
          bg_opa: COVER
          border_width: 0
          radius: 0
          clickable: false

      # ---- Left nav rail (x 0-nav_w, y bar_h-screen_h) ----
      # Real bug fixed (repo-owner report): this used to run the full
      # remaining screen height (bar_h..screen_h), which only looks right
      # once every nav entry in pages.md's catalog exists. With just 3 of
      # ~8 planned entries built so far, the rail's own buttons stop at
      # y=424 (3*120 below bar_h) but this divider kept going all the way
      # to y=800 - a thin grey line hanging in otherwise-empty black
      # space below the last button (TRUMA), with nothing to visually
      # anchor it, reads exactly like a stray leftover element even
      # though it's the same intentional nav/content separator that's
      # perfectly at home *behind* the buttons above it. Fix: stop it at
      # the bottom of the last real button instead of the screen edge.
      # ⚠ Extend `height:` (and move this comment) every time a new nav
      # entry is added - height = 120 * <number of nav buttons>.
      - obj:
          id: obj_nav_rule
          align: TOP_LEFT
          x: 129 # = nav_w - 1
          y: ${bar_h}
          width: 1
          height: 360 # = 120px per nav button * 3 buttons (Home/Electric/Truma)
          bg_color: 0x3C4043
          bg_opa: COVER
          border_width: 0
          radius: 0
          clickable: false
      - button:
          id: btn_nav_home
          align: TOP_LEFT
          x: 0
          y: ${bar_h}
          width: ${nav_w}
          height: 120
          radius: 0
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          shadow_width: 0
          widgets:
            - label:
                id: lbl_nav_home
                align: CENTER
                text: "HOME"
                text_font: font_ui_16
                text_color: 0x2ECC71
          on_click:
            - script.execute: nav_show_home
      - button:
          id: btn_nav_electric
          align: TOP_LEFT
          x: 0
          y: 184 # = bar_h + 120
          width: ${nav_w}
          height: 120
          radius: 0
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          shadow_width: 0
          widgets:
            - label:
                id: lbl_nav_electric
                align: CENTER
                text: "ELECTRIC"
                text_font: font_ui_16
                text_color: 0xBDC1C6
          on_click:
            - script.execute: nav_show_electric
      - button:
          id: btn_nav_climate
          align: TOP_LEFT
          x: 0
          y: 304 # = bar_h + 2*120
          width: ${nav_w}
          height: 120
          radius: 0
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          shadow_width: 0
          widgets:
            - label:
                id: lbl_nav_climate
                align: CENTER
                text: "TRUMA"
                text_font: font_ui_16
                text_color: 0xBDC1C6
          on_click:
            - script.execute: nav_show_climate

      # ---- Day/night + brightness popup (pages.md §4) - reachable from
      # every page via btn_daynight_toggle above, same backdrop-plus-
      # panel shape as the Electric page's Charger popup.
      - button:
          id: obj_daynight_popup_backdrop
          align: TOP_LEFT
          x: 0
          y: 0
          width: ${screen_w}
          height: ${screen_h}
          bg_color: 0x000000
          bg_opa: 70%
          border_width: 0
          radius: 0
          shadow_width: 0
          hidden: true
          on_click:
            - script.execute: close_daynight_popup

      - obj:
          id: obj_daynight_popup_panel
          align: CENTER
          width: 520
          height: 360
          radius: 16
          bg_color: 0x1A1C1E
          bg_opa: COVER
          border_width: 2
          border_color: 0x4A9EFF
          hidden: true
          widgets:
            - label:
                align: TOP_MID
                y: 20
                text: "DISPLAY"
                text_font: font_ui_20
                text_color: 0xBDC1C6

            - label:
                align: TOP_MID
                y: 62
                text: "TAG / NACHT"
                text_font: font_ui_16
                text_color: 0x707070

            - button:
                id: btn_daynight_mode_auto
                align: TOP_MID
                x: -165
                y: 90
                width: 100
                height: 56
                radius: 12
                bg_color: 0x202124
                border_width: 1
                border_color: 0x3C4043
                widgets:
                  - label:
                      align: CENTER
                      text: "AUTO"
                      text_font: font_ui_16
                      text_color: 0xBDC1C6
                on_click:
                  - script.execute: {id: act_daynight_set_mode, mode: 0}

            - button:
                id: btn_daynight_mode_day
                align: TOP_MID
                x: 0
                y: 90
                width: 100
                height: 56
                radius: 12
                bg_color: 0x202124
                border_width: 1
                border_color: 0x3C4043
                widgets:
                  - label:
                      align: CENTER
                      text: "DAY"
                      text_font: font_ui_16
                      text_color: 0xBDC1C6
                on_click:
                  - script.execute: {id: act_daynight_set_mode, mode: 1}

            - button:
                id: btn_daynight_mode_night
                align: TOP_MID
                x: 165
                y: 90
                width: 100
                height: 56
                radius: 12
                bg_color: 0x202124
                border_width: 1
                border_color: 0x3C4043
                widgets:
                  - label:
                      align: CENTER
                      text: "NIGHT"
                      text_font: font_ui_16
                      text_color: 0xBDC1C6
                on_click:
                  - script.execute: {id: act_daynight_set_mode, mode: 2}

            - label:
                align: TOP_MID
                y: 172
                text: "HINTERGRUNDBELEUCHTUNG"
                text_font: font_ui_16
                text_color: 0x707070

            # No PWM-capable backlight GPIO confirmed yet (see
            # apply_backlight's own comment) - the slider still works
            # and persists (g_backlight_pct), it just has nothing real
            # to dim until that pin is found.
            - slider:
                id: sld_backlight
                align: TOP_MID
                y: 210
                width: 420
                height: 24
                min_value: 10
                max_value: 100
                value: 100
                bg_color: 0x202124
                indicator:
                  bg_color: 0x4A9EFF
                knob:
                  bg_color: 0xBDC1C6
                on_value:
                  - script.execute:
                      id: act_backlight_set
                      pct: !lambda "return (int) x;"

            - label:
                id: lbl_backlight_pct
                align: TOP_MID
                y: 246
                text: "100%"
                text_font: font_ui_16
                text_color: 0xBDC1C6

            - button:
                id: btn_daynight_popup_close
                align: BOTTOM_MID
                y: -20
                width: 200
                height: 56
                radius: 12
                bg_color: 0x202124
                border_width: 1
                border_color: 0x3C4043
                widgets:
                  - label:
                      align: CENTER
                      text: "SCHLIESSEN"
                      text_font: font_ui_16
                      text_color: 0xBDC1C6
                on_click:
                  - script.execute: close_daynight_popup

      # ---- Brightness dim overlay (see apply_backlight) - an `obj:`,
      # not a `button:`, but that alone does NOT make it non-clickable:
      # stock LVGL sets LV_OBJ_FLAG_CLICKABLE on every object created by
      # lv_obj_create(), `button:` widgets are not special-cased, they
      # just default that same flag on too. Confirmed as a real bug on
      # real hardware (2026-09-06): this being full-screen, always
      # present (only bg_opa changes) and drawn AFTER the status bar/nav
      # rail in this same top_layer list meant it sat on top of and
      # silently swallowed every touch across the whole UI, on every
      # page - matching "touch stops working entirely" exactly.
      # `clickable: false` (the same flat boolean-flag pattern already
      # used for `hidden:` throughout this file, mapping to
      # LV_OBJ_FLAG_CLICKABLE) makes it change how dark the content
      # LOOKS without ever intercepting a tap meant for whatever's
      # underneath. Starts fully transparent (bg_opa 0); apply_backlight
      # (called from on_boot and every slider move) drives the real
      # value.
      - obj:
          id: obj_brightness_dim_overlay
          align: TOP_LEFT
          x: 0
          y: 0
          width: ${screen_w}
          height: ${screen_h}
          bg_color: 0x000000
          bg_opa: TRANSP
          border_width: 0
          radius: 0
          clickable: false

      # ---- Sleep overlay (pages.md's display-power open item) - LAST in
      # this widget list on purpose: LVGL draws top_layer widgets in list
      # order, so this has to come after the popup above (and everything
      # else here) to actually sit on top of it and catch the waking tap
      # itself, rather than the tap falling through to the popup or
      # whatever page is underneath.
      - button:
          id: obj_sleep_overlay
          align: TOP_LEFT
          x: 0
          y: 0
          width: ${screen_w}
          height: ${screen_h}
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          shadow_width: 0
          hidden: true
          on_click:
            - script.execute: wake_from_sleep

  pages:
    # =========================================================================
    # Mainscreen (page_home) - pages.md §5/§6
    # =========================================================================
    - id: page_home
      # bg_color/bg_opa here, not just lvgl: bottom_layer: above - an
      # LVGL page has its own background that sits on top of
      # bottom_layer, and was NOT black by default on the real device
      # (reported by the repo owner) despite bottom_layer being black.
      # Every page below repeats this explicitly for the same reason.
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # ---- Right half: SBB clock --------------------------------------
        - sbb_clock:
            id: clock_face
            time_id: homeassistant_time
            # 450 -> 320 (2026-09-06, round 3, confirmed on real
            # hardware): even after corner_color (below) dropped this
            # canvas from ARGB8888 to plain RGB565 (810112 -> 405120
            # bytes), the boot log still showed it landing in PSRAM
            # (`alloc_canvas_buf()`'s own warning). The static linker
            # report this file's comments used to cite (~432KB free
            # internal RAM) is a compile-time bss/data budget, not the
            # ACTUAL free heap left over at runtime once Wi-Fi/esp_hosted/
            # LVGL's own (much larger) display buffer have all already
            # claimed their share by the time this widget's setup() runs
            # - that real number is smaller and wasn't knowable without
            # flashing real hardware. 320x320 (204800 bytes, exactly half
            # of the previous size) leaves enough headroom below whatever
            # that real ceiling turns out to be. No more "took a long
            # time" warnings for sbb_clock on the real device at this
            # size - see m5dial_clock_sbb's README for the full writeup.
            width: 320
            height: 320
            align: TOP_LEFT
            x: 815 # keeps the same center point as the old 450x450 at (750,200)
            y: 265
            # Round, not square (bug reported on real hardware): a
            # canvas is inherently rectangular, so without something
            # making the corners disappear it rendered as a plain filled
            # square. show_face draws the actual round dial; corner_color
            # (below) makes the square's own corners disappear into the
            # page's real background - together they're what makes it
            # read as a circle rather than a block.
            show_face: true
            # `corner_color`, not `transparent: true` (real bug fixed,
            # round 2 - see m5dial_clock_sbb's README "Fixed" section for
            # the full writeup): this page's background is always the
            # same fixed solid color, so true alpha transparency was
            # never actually needed for the square canvas's corners to
            # disappear into it - only matching that fixed color opaquely
            # was, which needs a plain RGB565 canvas instead of ARGB8888.
            corner_color: col_page_bg
            # Real SBB clock look (design_rules.md §6's documented
            # exception, m5dial_fram's clock page uses the same
            # colors): WHITE face, BLACK hands by day - background/
            # foreground here are the DAY baseline; set_night_mode()
            # (apply_daynight, below) swaps them at runtime for BLACK
            # face for BLACK, WHITE hands at night. Previously had
            # these backwards (white ink on a black square, no face) -
            # that's the other half of the original bug report.
            # corner_color above is DELIBERATELY not swapped by
            # night_mode - the page behind the clock stays the same
            # black regardless of day/night, so the corners have to
            # match that fixed color either way, not invert with the
            # face.
            background: col_clock_ink   # white face by day
            foreground: col_clock_bg    # black hands/ticks/text by day
            second_hand_color: col_clock_second
            # show_date: false (the default) - repo owner doesn't want
            # the date/day shown.
            #
            # render_interval left at the component's own 100ms default -
            # the whole point of the corner_color fix above is that this
            # canvas no longer has an unusual per-frame cost to work
            # around.

        # ---- Left half: one tile per switch (pages.md §6) ---------------
        # Fridge is reserved regardless of outcome (pages.md §6: "user is
        # still checking whether this vehicle wires the fridge to its own
        # controllable line ... render the tile in the invalid-value
        # style permanently rather than removing it, so the layout
        # doesn't shift later"). Alarmo is NOT included - pages.md §6
        # itself marks its entity_id as still TBD, and there's nothing
        # real to wire a PIN popup to yet.
        - button:
            id: btn_tile_12v
            align: TOP_LEFT
            x: 215 # bottom-left, per repo owner's requested order
            y: 527
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "POWER (12V)"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_12v
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_12v_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_12v"
                  value: !lambda 'return id(sw_12v_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_aux
            align: TOP_LEFT
            x: 215 # middle-left
            y: 357
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "AUX"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_aux
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_aux_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_aux"
                  value: !lambda 'return id(sw_aux_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_light
            align: TOP_LEFT
            x: 215 # top-left
            y: 187
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "LIGHT"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_light
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_light_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_light"
                  value: !lambda 'return id(sw_light_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_pump
            align: TOP_LEFT
            x: 455 # bottom-right
            y: 527
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "PUMP"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_pump
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_pump_mirror
              - script.execute:
                  id: send_link_command
                  key: "switch_pump"
                  value: !lambda 'return id(sw_pump_mirror).state ? "1" : "0";'

        - button:
            id: btn_tile_eisex
            align: TOP_LEFT
            x: 455 # top-right
            y: 187
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "ICEEX"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_eisex
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555
            on_click:
              - switch.toggle: sw_eisex_mirror
              - script.execute:
                  id: send_link_command
                  key: "eisex_output"
                  value: !lambda 'return id(sw_eisex_mirror).state ? "1" : "0";'

        # Reserved slot - permanently invalid style, no on_click. See
        # header comment above.
        - button:
            id: btn_tile_fridge
            align: TOP_LEFT
            x: 455 # middle-right
            y: 357
            width: 210
            height: 150
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            shadow_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text: "FRIDGE"
                  text_font: font_ui_16
                  text_color: 0x707070
              - label:
                  id: lbl_tile_fridge
                  align: CENTER
                  y: 8
                  text: "---"
                  text_font: font_ui_24
                  text_color: 0x555555

    # =========================================================================
    # Electric - Victron-style overview (page_electric) - pages.md §5
    # =========================================================================
    - id: page_electric
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - script.execute: poll_electric
      widgets:
        # ---- 3x2 grid, all six boxes the SAME size (repo-owner: "mache
        # alle rechtecke gleich gross") - 300x290 each, gap_x=40,
        # gap_y=40. Horizontally: 3x300 + 2x40 = 980px, centered in the
        # 1150px content area (nav rail ends x130, right edge x1280) ->
        # 85px side margin -> columns start x215/555/895. Vertically:
        # 2x290 + 40 gap = 620px, centered in the 736px content height
        # (bar_h=64 to screen_h=800) -> 58px top/bottom margin -> rows
        # start y122/452. Every box below reuses these same six
        # coordinates (x215/555/895, y122/452) rather than a bespoke
        # size - a box with less content just has more breathing room
        # inside it, which is the normal look for an equal-size grid.
        - obj: &box_frame
            id: obj_electric_shore
            align: TOP_LEFT
            x: 215
            y: 122
            width: 300
            height: 290
            radius: 12
            bg_color: 0x202124
            bg_opa: COVER
            border_width: 1
            border_color: 0x3C4043
            # Real, LVGL-default cause of repo-owner's "die Abstände sind
            # immer noch unterschiedlich", even though every box already
            # used the identical y-values (12/74/108/-14) for each row:
            # `button:` widgets (Charger/Solar/Battery, below) carry
            # LVGL's default theme padding, `obj:` widgets (this one)
            # don't - so `align: TOP_MID, y: 12` lands at a DIFFERENT
            # absolute position depending on which widget type a box
            # happens to be built from, since LVGL aligns children
            # against the parent's padded content box, not its outer
            # border. Zeroing it here, once, and letting every box merge
            # this frame in (see `<<: *box_frame` below) removes the
            # discrepancy at its root instead of hand-tuning each
            # button-box's numbers to compensate.
            pad_all: 0
            widgets:
              # ---- Row templates (repo-owner: "leg für die Boxen ein
              # Template an, und nimm für jede Box DASSELBE Template") -
              # these are YAML anchors (`&name`), not just matching
              # numbers typed six times over: every other box below
              # merges them in with `<<: *row_main` etc. (the same
              # merge-key mechanism `glyphs: *ui_glyphs` already uses in
              # the font: block above), overriding only what's actually
              # box-specific (id, text, an accent color where one box
              # deliberately differs). Change a row's y/font/color here
              # and every box picks it up - they cannot drift apart
              # again the way hand-copied numbers did. Sizes bumped a
              # step up all round per repo-owner ("Texte grösser,
              # primär der Hauptwert und die unteren") - font_ui_16->20
              # for label/state/bottom rows, font_ui_24->32 for the main
              # value (Battery's own font_ui_40 "hero" stays biggest -
              # see its own widgets further down).
              - label: &row_title
                  align: TOP_MID
                  y: 16
                  text: "SHORE"
                  text_font: font_ui_20
                  text_color: 0x707070
              - label: &row_main
                  id: lbl_electric_shore
                  align: TOP_MID
                  y: 54
                  text: "--- W"
                  text_font: font_ui_32
                  text_color: 0x555555
              # Connected/disconnected - smartebl's own link reading
              # (see draw_electric). Shared state/secondary-line slot
              # every box on this page uses except AC Loads (its former
              # duplicate %-of-1600W line was removed outright, not
              # reflowed - see that box's own comment).
              - label: &row_state
                  id: lbl_electric_shore_status
                  align: TOP_MID
                  y: 112
                  text: "---"
                  text_font: font_ui_20
                  text_color: 0x555555
              - label: &row_bottom_l
                  id: lbl_electric_shore_sub_l
                  align: BOTTOM_LEFT
                  x: 14
                  y: -16
                  text: "---V"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6
              - label: &row_bottom_r
                  id: lbl_electric_shore_sub_r
                  align: BOTTOM_RIGHT
                  x: -14
                  y: -16
                  text: "---Hz"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6
        # ---- Flow arrows - static, 3-state (repo-owner: a walking
        # animation "braucht Leistung" for what it conveyed; a real
        # power-flow topology needs at most forward/reverse/none per
        # connection anyway). Text is set in draw_electric, not on a
        # timer - see that script's own "Flow-direction arrows" comment
        # for why each one only needs the states it actually has.
        - label:
            id: arrow_shore_charger
            align: TOP_LEFT
            x: 525
            y: 252
            text_font: font_ui_24
            text: "-"
            text_color: 0x707070

        # Inverter/Charger is now a BUTTON - tap opens the mode/shore-
        # limit popup at the bottom of this page's widget list. Already
        # "almost perfect" per repo-owner feedback - only the popup
        # itself changed (mode button order, limit centering), not this
        # box's own content.
        - button:
            <<: *box_frame
            id: btn_electric_charger
            x: 555
            shadow_width: 0
            widgets:
              - label:
                  <<: *row_title
                  text: "INVERTER / CHARGER"
              - label:
                  <<: *row_main
                  id: lbl_electric_charger
                  text: "---"
              # Shared state/secondary-line slot - see row_state's own
              # comment (on the Shore box, above).
              - label:
                  <<: *row_state
                  id: lbl_electric_charger_sub
                  text: "---"
              # Inverter load bar - repo owner asked what Victron
              # GUIv2's own vertical bar here represents; best answer
              # from this session (still unconfirmed against a real GX
              # device): AC output power as a % of the MultiPlus's own
              # max rated output, NOT input/throughput. Reuses AC Loads'
              # own entity (sensor.multiplus_ausgangsleistung_l1,
              # s_multiplus_out_w) and its 1600W-nominal assumption
              # (same Multiplus 12/1600 caveat as that box) rather than
              # inventing a second calculation for the same underlying
              # number - see draw_electric for the actual %.
              # RIGHT_MID (not TOP_RIGHT + a manually-computed y/height
              # half-split) so it's vertically centered in the box by
              # construction - repo-owner: "die vertikale bar vertikal
              # einmitten" - and stays centered automatically if this
              # box's height ever changes again, no math to redo.
              - bar:
                  id: bar_electric_charger_load
                  align: RIGHT_MID
                  x: -16
                  width: 14
                  height: 250
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x1A1C1E
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x3C4043
                  radius: 4
                  indicator:
                    bg_color: 0x4A9EFF
                    radius: 3
            on_click:
              - script.execute: show_charger_popup
        - label:
            id: arrow_charger_acloads
            align: TOP_LEFT
            x: 865
            y: 252
            text_font: font_ui_24
            text: "-"
            text_color: 0x707070
        - obj:
            <<: *box_frame
            id: obj_electric_ac_loads
            x: 895
            widgets:
              - label:
                  <<: *row_title
                  text: "AC LOADS"
              - label:
                  <<: *row_main
                  id: lbl_electric_ac_loads
                  text: "--- W"
              # State/secondary-line slot deliberately left empty here
              # (repo-owner: the %-of-1600W figure that used to live in
              # that slot is already shown by the Inverter/Charger box's
              # own load bar - same underlying number, no need to say it
              # twice). No lbl_electric_ac_loads_state widget any more;
              # draw_electric no longer writes one either.
              - label:
                  <<: *row_bottom_l
                  id: lbl_electric_ac_loads_sub_l
                  text: "---V"
              - label:
                  <<: *row_bottom_r
                  id: lbl_electric_ac_loads_sub_r
                  text: "---Hz"

        # The one connection that genuinely reverses in this topology:
        # charging pulls energy DOWN from the Inverter/Charger into the
        # Battery, discharging pushes it back UP through the inverter to
        # power AC loads - unlike the four horizontal arrows (mains,
        # inverter output, solar, DC loads are all one-directional
        # sources/sinks, see draw_electric's own comment), so this one
        # needs all three states: ↓/↑/-, not just one arrow direction
        # and a dash.
        - label:
            id: arrow_row_down
            align: TOP_LEFT
            x: 695
            y: 420
            text_font: font_ui_24
            text: "-"
            text_color: 0x707070

        # ---- Row 2 (y=452, h=290): Solar -> Battery (emphasized) -> DC
        # Loads - same 300x290 grid as row 1 (see the top-of-page
        # comment); column x is identical to row 1's (215/555/895) too,
        # since every box is now the same width.
        # Solar Yield is now a BUTTON too - tap opens its own ON/OFF +
        # charge-limit popup (show_solar_popup), same shape as the
        # Charger box above.
        - button:
            <<: *box_frame
            id: btn_electric_solar
            x: 215
            y: 452
            shadow_width: 0
            widgets:
              - label:
                  <<: *row_title
                  text: "SOLAR YIELD"
              - label:
                  <<: *row_main
                  id: lbl_electric_solar
                  text: "--- W"
              # Shared state/secondary-line slot - see row_state's own
              # comment (on the Shore box, above). Humanized MPPT
              # zustand - had been dropped when the subs below became
              # V/A instead, restored here rather than left out, since
              # the sensor (s_mppt_zustand) is still real.
              - label:
                  <<: *row_state
                  id: lbl_electric_solar_state
                  text: "---"
              - label:
                  <<: *row_bottom_l
                  id: lbl_electric_solar_sub_l
                  text: "---V"
              - label:
                  <<: *row_bottom_r
                  id: lbl_electric_solar_sub_r
                  text: "---A"
                  text_font: font_ui_16
                  text_color: 0x707070
            on_click:
              - script.execute: show_solar_popup
        - label:
            id: arrow_solar_battery
            align: TOP_LEFT
            x: 505
            y: 582
            text_font: font_ui_24
            text: "-"
            text_color: 0x707070

        # Battery - now a BUTTON (opens the park-mode popup below, see
        # show_battery_popup), and the same 300x290 grid cell as every
        # other box (was a wider 340px special case - narrowed by 40px,
        # see the V/A/W row's own comment for how that row was
        # rebalanced to fit).
        - button:
            <<: *box_frame
            id: btn_electric_battery
            x: 555
            y: 452
            # The one box that deliberately does NOT take box_frame's
            # radius/bg_color/border as-is - repo-owner's "emphasized"
            # accent styling for the hero box. Still inherits width,
            # height and (crucially, see box_frame's own comment)
            # pad_all: 0 from the shared frame - only the look, not the
            # geometry, is special-cased here.
            radius: 16
            bg_color: 0x14324F
            border_width: 2
            border_color: 0x4A9EFF
            shadow_width: 0
            widgets:
              - label:
                  <<: *row_title
                  text: "BATTERY"
                  text_color: 0xBDC1C6
              # Battery keeps its own bigger font_ui_40 "hero" value
              # rather than row_main's font_ui_32 - see the font: block's
              # own comment. y44 (was 34): shifted down to clear the
              # title's own taller font_ui_20 (was font_ui_16) below it;
              # still ends at the same y~96 row_state (below) starts
              # from in every other box, so no other row needed to move.
              - label:
                  id: lbl_electric_batt_main
                  align: TOP_MID
                  y: 44
                  text: "---%"
                  text_font: font_ui_40
                  text_color: 0x555555
              # Shared state/secondary-line slot - see row_state's own
              # comment (on the Shore box, above; this is the box the
              # pattern was named after). Remaining time below is EXTRA,
              # not part of that shared slot - Battery is the one box
              # with a second line of its own between the state line and
              # the bottom row.
              - label:
                  <<: *row_state
                  id: lbl_electric_batt_state
                  text: "---"
              - label:
                  id: lbl_electric_batt_time
                  align: TOP_MID
                  y: 142
                  text: ""
                  text_font: font_ui_20
                  text_color: 0xBDC1C6
              # DC bus V / A / W, left / middle / right. width 84 (was
              # 100, tuned for the old 340px-wide box) so the three
              # columns still fit with a clean 10px gap now that this
              # box is 300px wide like every other one: 14px side
              # padding + 3x84 + 2x10 gap = 272px, i.e. 300 - 2x14.
              - label:
                  id: lbl_electric_batt_v
                  align: TOP_LEFT
                  x: 14
                  y: 188
                  width: 84
                  text_align: CENTER
                  text: "---V"
                  text_font: font_ui_20
                  text_color: 0x555555
              - label:
                  id: lbl_electric_batt_a
                  align: TOP_MID
                  y: 188
                  width: 84
                  text_align: CENTER
                  text: "---A"
                  text_font: font_ui_20
                  text_color: 0x555555
              - label:
                  id: lbl_electric_batt_w
                  align: TOP_RIGHT
                  x: -14
                  y: 188
                  width: 84
                  text_align: CENTER
                  text: "---W"
                  text_font: font_ui_20
                  text_color: 0x555555
              # Starter battery voltage - smartebl's own link reading
              # (see draw_electric), always at the very bottom.
              - label:
                  id: lbl_electric_batt_sub
                  align: BOTTOM_MID
                  y: -16
                  text: "START ---V"
                  text_font: font_ui_20
                  text_color: 0x555555
            on_click:
              - script.execute: show_battery_popup
        - label:
            id: arrow_battery_dcloads
            align: TOP_LEFT
            x: 885
            y: 582
            text_font: font_ui_24
            text: "-"
            text_color: 0x707070
        - obj:
            <<: *box_frame
            id: obj_electric_dc_loads
            x: 895
            y: 452
            widgets:
              - label:
                  <<: *row_title
                  text: "DC LOADS"
              - label:
                  <<: *row_main
                  id: lbl_electric_dc_loads
                  text: "--- W"
              # Reserved, matching every other box's layout even though
              # there's no real source for any of it yet (repo owner:
              # "tbd") - keeps this box the same shape as its neighbors
              # rather than looking unfinished, and means nothing shifts
              # around once a real entity is picked. Own ids (rather than
              # none, as before) so a future draw_electric addition has
              # something to target directly - each row's `<<:` anchor
              # already carries an id (Shore's own), which would
              # otherwise collide as a duplicate once merged in here.
              - label:
                  <<: *row_state
                  id: lbl_electric_dc_loads_state
              - label:
                  <<: *row_bottom_l
                  id: lbl_electric_dc_loads_sub_l
              - label:
                  <<: *row_bottom_r
                  id: lbl_electric_dc_loads_sub_r

        # ---- Charger/Inverter popup: mode (select.multiplus) + shore
        # current limit (number.multiplus_strombegrenzung). Hidden by
        # default; shown/hidden by show_charger_popup/close_charger_popup.
        # button:, not obj: - on_click only reliably registers on a
        # button widget in this file's own established convention (see
        # page_home's tile buttons - a plain obj: with on_click was the
        # earlier bug there too).
        - button:
            id: obj_electric_popup_backdrop
            align: TOP_LEFT
            x: 0
            y: 0
            width: ${screen_w}
            height: ${screen_h}
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            shadow_width: 0
            hidden: true
            on_click:
              - script.execute: close_charger_popup

        - obj:
            id: obj_electric_popup_panel
            align: CENTER
            width: 640
            height: 420
            radius: 16
            bg_color: 0x1A1C1E
            bg_opa: COVER
            border_width: 2
            border_color: 0x4A9EFF
            hidden: true
            widgets:
              - label:
                  align: TOP_MID
                  y: 20
                  text: "INVERTER / CHARGER"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6

              - label:
                  align: TOP_MID
                  y: 60
                  text: "MODUS"
                  text_font: font_ui_16
                  text_color: 0x707070

              # Left-to-right order per repo-owner spec: OFF, CHARGER,
              # INVERTER, ON (used to be ON/CHG/INV/OFF) - only the x
              # positions moved, ids/on_click options unchanged.
              - button:
                  id: btn_multiplus_mode_off
                  align: TOP_MID
                  x: -225
                  y: 90
                  width: 130
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "OFF"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: {id: act_multiplus_set_mode, option: "off"}

              - button:
                  id: btn_multiplus_mode_chg
                  align: TOP_MID
                  x: -75
                  y: 90
                  width: 130
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "CHG"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: {id: act_multiplus_set_mode, option: "charger_only"}

              - button:
                  id: btn_multiplus_mode_inv
                  align: TOP_MID
                  x: 75
                  y: 90
                  width: 130
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "INV"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: {id: act_multiplus_set_mode, option: "inverter_only"}

              - button:
                  id: btn_multiplus_mode_on
                  align: TOP_MID
                  x: 225
                  y: 90
                  width: 130
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "ON"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: {id: act_multiplus_set_mode, option: "on"}

              - label:
                  align: TOP_MID
                  y: 190
                  text: "LANDSTROM-LIMIT"
                  text_font: font_ui_16
                  text_color: 0x707070

              - button:
                  id: btn_multiplus_limit_down
                  align: TOP_MID
                  x: -140
                  y: 220
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "-"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_multiplus_limit_down

              # Real bug fixed: no `text_align:` meant LVGL left-aligned
              # this text inside its own 200px box, so it visibly drifted
              # off-center as the digit count changed ("LIMIT 4A" vs
              # "LIMIT 16A") instead of staying centered between the -/+
              # buttons either way.
              - label:
                  id: lbl_multiplus_limit
                  align: TOP_MID
                  y: 236
                  width: 190
                  text_align: CENTER
                  text_font: font_ui_24
                  text: "LIMIT --A"
                  text_color: 0x555555

              - button:
                  id: btn_multiplus_limit_up
                  align: TOP_MID
                  x: 140
                  y: 220
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "+"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_multiplus_limit_up

              - button:
                  id: btn_electric_popup_close
                  align: BOTTOM_MID
                  y: -20
                  width: 200
                  height: 56
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "SCHLIESSEN"
                        text_font: font_ui_16
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: close_charger_popup

        # ---- Solar Yield popup: ON/OFF (switch.mppt_190w) + charge-
        # current limit (number.mppt_190w_stromstarke) - same backdrop/
        # panel shape as the Charger popup above, 2 mode buttons instead
        # of 4.
        - button:
            id: obj_solar_popup_backdrop
            align: TOP_LEFT
            x: 0
            y: 0
            width: ${screen_w}
            height: ${screen_h}
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            shadow_width: 0
            hidden: true
            on_click:
              - script.execute: close_solar_popup

        - obj:
            id: obj_solar_popup_panel
            align: CENTER
            width: 640
            height: 420
            radius: 16
            bg_color: 0x1A1C1E
            bg_opa: COVER
            border_width: 2
            border_color: 0x4A9EFF
            hidden: true
            widgets:
              - label:
                  align: TOP_MID
                  y: 20
                  text: "SOLAR YIELD"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6

              - label:
                  align: TOP_MID
                  y: 60
                  text: "MODUS"
                  text_font: font_ui_16
                  text_color: 0x707070

              - button:
                  id: btn_mppt_mode_off
                  align: TOP_MID
                  x: -75
                  y: 90
                  width: 130
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "OFF"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_mppt_toggle

              - button:
                  id: btn_mppt_mode_on
                  align: TOP_MID
                  x: 75
                  y: 90
                  width: 130
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "ON"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_mppt_toggle

              - label:
                  align: TOP_MID
                  y: 190
                  text: "LADESTROM-LIMIT"
                  text_font: font_ui_16
                  text_color: 0x707070

              - button:
                  id: btn_mppt_limit_down
                  align: TOP_MID
                  x: -140
                  y: 220
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "-"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_mppt_limit_down

              - label:
                  id: lbl_mppt_limit
                  align: TOP_MID
                  y: 236
                  width: 190
                  text_align: CENTER
                  text_font: font_ui_24
                  text: "LIMIT --A"
                  text_color: 0x555555

              - button:
                  id: btn_mppt_limit_up
                  align: TOP_MID
                  x: 140
                  y: 220
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "+"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_mppt_limit_up

              - button:
                  id: btn_solar_popup_close
                  align: BOTTOM_MID
                  y: -20
                  width: 200
                  height: 56
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "SCHLIESSEN"
                        text_font: font_ui_16
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: close_solar_popup

        # ---- Battery popup: switch.fram_parkmodus, a single toggle.
        - button:
            id: obj_battery_popup_backdrop
            align: TOP_LEFT
            x: 0
            y: 0
            width: ${screen_w}
            height: ${screen_h}
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            shadow_width: 0
            hidden: true
            on_click:
              - script.execute: close_battery_popup

        - obj:
            id: obj_battery_popup_panel
            align: CENTER
            width: 520
            height: 300
            radius: 16
            bg_color: 0x1A1C1E
            bg_opa: COVER
            border_width: 2
            border_color: 0x4A9EFF
            hidden: true
            widgets:
              - label:
                  align: TOP_MID
                  y: 20
                  text: "BATTERY"
                  text_font: font_ui_20
                  text_color: 0xBDC1C6

              - label:
                  align: TOP_MID
                  y: 60
                  text: "PARKMODUS"
                  text_font: font_ui_16
                  text_color: 0x707070

              - button:
                  id: btn_park_toggle
                  align: TOP_MID
                  y: 96
                  width: 200
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        id: lbl_park_state
                        align: CENTER
                        text: "---"
                        text_font: font_ui_20
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_park_toggle

              - button:
                  id: btn_battery_popup_close
                  align: BOTTOM_MID
                  y: -20
                  width: 200
                  height: 56
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "SCHLIESSEN"
                        text_font: font_ui_16
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: close_battery_popup

    # =========================================================================
    # Truma (page_climate) - pages.md §5, ONE page for both sides of the
    # same Truma Combi 4 (repo owner's own unit): left = Heizung (room
    # heating, the entities/scripts already named s_climate_*/
    # act_climate_*/draw_climate), right = Boiler (water heating,
    # s_boiler_*/act_boiler_*/draw_boiler) - previously two separate
    # pages/nav entries, merged per repo-owner request. Two plain `obj:`
    # containers (obj_truma_room/obj_truma_water) act as local coordinate
    # origins so each half's widgets can use align/y offsets relative to
    # THAT half, the same way a whole page normally would - see
    # design_rules.md §9's arc/label pattern, now scoped per-container
    # instead of per-page.
    - id: page_climate
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - script.execute: poll_climate
        - script.execute: poll_boiler
      widgets:
        - obj:
            id: obj_truma_divider
            align: TOP_LEFT
            x: 705
            y: 90
            width: 1
            height: 650
            bg_color: 0x3C4043
            bg_opa: COVER
            border_width: 0
            radius: 0
            clickable: false

        # ---- Left half: Heizung (room) -----------------------------------
        - obj:
            id: obj_truma_room
            align: TOP_LEFT
            x: 160
            y: 90
            width: 530
            height: 650
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 0
                  text_font: font_ui_20
                  text: "HEIZUNG"
                  text_color: 0x707070

              - arc:
                  id: arc_climate_temp
                  align: TOP_MID
                  y: 50
                  width: 200
                  height: 200
                  start_angle: 135
                  end_angle: 45
                  min_value: 0
                  max_value: 100
                  adjustable: false
                  arc_width: 10
                  arc_color: 0x1A1C1E
                  indicator:
                    arc_width: 10
                    arc_color: 0x555555
                  knob:
                    bg_opa: TRANSP

              - label:
                  id: lbl_climate_temp
                  align: TOP_MID
                  y: 120
                  text_font: font_ui_40
                  text: "---°C"
                  text_color: 0x555555

              # "SOLL" / "nn°C" stacked, centered in the gap BETWEEN the
              # +/- buttons below (not a separate line above them, like
              # this used to be) - x:0 sits exactly midway between
              # btn_climate_temp_down's x:-95 and btn_climate_temp_up's
              # x:95, width:100 keeps it clear of both (each button is
              # 80px wide, so the gap between their inner edges is
              # 2*95-80=110px). Two lines via "\n" in one label rather
              # than two separate ones - simpler to keep centered as one
              # unit, and there's only ever one color/visibility state to
              # update (see draw_climate below).
              - label:
                  id: lbl_climate_target
                  align: TOP_MID
                  x: 0
                  y: 316
                  width: 100
                  text_align: CENTER
                  text_font: font_ui_16
                  text: "SOLL\n---°C"
                  text_color: 0x555555

              - button:
                  id: btn_climate_temp_down
                  align: TOP_MID
                  x: -95
                  y: 310
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "-"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_climate_temp_down

              - button:
                  id: btn_climate_temp_up
                  align: TOP_MID
                  x: 95
                  y: 310
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "+"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_climate_temp_up

              - button:
                  id: btn_climate_heater
                  align: TOP_MID
                  y: 390
                  width: 200
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        id: lbl_climate_heater
                        align: CENTER
                        text: "HEIZ ---"
                        text_font: font_ui_20
                        text_color: 0x555555
                  on_click:
                    - script.execute: act_climate_heater

              - label:
                  id: lbl_climate_active
                  align: TOP_MID
                  y: 462
                  text_font: font_ui_16
                  text: "AKTIV ---"
                  text_color: 0x555555

              # ---- Fan level (Lüfterstufe) - tap-to-cycle through the
              # confirmed real fan_modes (off/low/medium/high), climate.
              # womolin_controller_mqtt_truma_room's own attribute - see
              # act_climate_fan_cycle's comment for why one cycling button
              # instead of the Electric popup's 4-button shape.
              - button:
                  id: btn_climate_fan_mode
                  align: TOP_MID
                  y: 500
                  width: 200
                  height: 44
                  radius: 10
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  shadow_width: 0
                  widgets:
                    - label:
                        id: lbl_climate_fan_mode
                        align: CENTER
                        text_font: font_ui_16
                        text: "LÜFTER ---"
                        text_color: 0x555555
                  on_click:
                    - script.execute: act_climate_fan_cycle

        # ---- Right half: Boiler (water) -----------------------------------
        - obj:
            id: obj_truma_water
            align: TOP_LEFT
            x: 730
            y: 90
            width: 530
            height: 650
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 0
                  text_font: font_ui_20
                  text: "BOILER"
                  text_color: 0x707070

              - arc:
                  id: arc_boiler_temp
                  align: TOP_MID
                  y: 50
                  width: 200
                  height: 200
                  start_angle: 135
                  end_angle: 45
                  min_value: 0
                  max_value: 100
                  adjustable: false
                  arc_width: 10
                  arc_color: 0x1A1C1E
                  indicator:
                    arc_width: 10
                    arc_color: 0x555555
                  knob:
                    bg_opa: TRANSP

              - label:
                  id: lbl_boiler_temp
                  align: TOP_MID
                  y: 120
                  text_font: font_ui_40
                  text: "---°C"
                  text_color: 0x555555

              # "SOLL" / "nn°C" stacked, centered between the +/- buttons -
              # same layout as lbl_climate_target above, mirrored.
              - label:
                  id: lbl_boiler_target
                  align: TOP_MID
                  x: 0
                  y: 316
                  width: 100
                  text_align: CENTER
                  text_font: font_ui_16
                  text: "SOLL\n---°C"
                  text_color: 0x555555

              - button:
                  id: btn_boiler_temp_down
                  align: TOP_MID
                  x: -95
                  y: 310
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "-"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_boiler_temp_down

              - button:
                  id: btn_boiler_temp_up
                  align: TOP_MID
                  x: 95
                  y: 310
                  width: 80
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        align: CENTER
                        text: "+"
                        text_font: font_ui_24
                        text_color: 0xBDC1C6
                  on_click:
                    - script.execute: act_boiler_temp_up

              - button:
                  id: btn_boiler_heater
                  align: TOP_MID
                  y: 390
                  width: 200
                  height: 60
                  radius: 12
                  bg_color: 0x202124
                  border_width: 1
                  border_color: 0x3C4043
                  widgets:
                    - label:
                        id: lbl_boiler_heater
                        align: CENTER
                        text: "BOILER ---"
                        text_font: font_ui_20
                        text_color: 0x555555
                  on_click:
                    - script.execute: act_boiler_heater

              - label:
                  id: lbl_boiler_active
                  align: TOP_MID
                  y: 462
                  text_font: font_ui_16
                  text: "AKTIV ---"
                  text_color: 0x555555

        # ---- Shared footer - ONE Truma unit behind both halves, so its
        # status/error shows once here instead of on two separate pages
        # (see sensor:/text_sensor: blocks' own header comments).
        - label:
            id: lbl_truma_status
            align: BOTTOM_MID
            y: -12
            width: 1000
            text_font: font_ui_16
            text: ""
            text_color: 0x555555
